<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumbo a España">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<!-- APP START -->
<title>Rumbo a España</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: uma coluna de bolso (max 560px), painel de "salidas" no topo, abas fixas embaixo. */
:root{
  --paper:#f4f5f9; --surface:#ffffff; --ink:#151b2e; --muted:#586179; --line:#dde1eb;
  --cobalt:#2443a6; --cobalt-soft:#e5eaf9; --on-cobalt:#ffffff;
  --saffron:#d9920f; --saffron-soft:#fbefd4; --on-saffron:#1d1608;
  --ok:#1d7448; --ok-soft:#dcf2e5; --bad:#b0302a; --bad-soft:#f8e0de;
  --board:#151b2e; --board-fg:#f6c453; --board-dim:#8c93a8; --board-cell:#222a42;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0c111e; --surface:#151c2e; --ink:#e6eaf4; --muted:#9aa3b9; --line:#262f47;
  --cobalt:#8ea7ff; --cobalt-soft:#1c2750; --on-cobalt:#0c111e;
  --saffron:#f2bb4b; --saffron-soft:#372c13; --on-saffron:#1d1608;
  --ok:#62d29d; --ok-soft:#14332a; --bad:#ff8c82; --bad-soft:#3b1c1b;
  --board:#05080f; --board-fg:#f6c453; --board-dim:#7d859b; --board-cell:#131a2b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c111e; --surface:#151c2e; --ink:#e6eaf4; --muted:#9aa3b9; --line:#262f47;
  --cobalt:#8ea7ff; --cobalt-soft:#1c2750; --on-cobalt:#0c111e;
  --saffron:#f2bb4b; --saffron-soft:#372c13; --on-saffron:#1d1608;
  --ok:#62d29d; --ok-soft:#14332a; --bad:#ff8c82; --bad-soft:#3b1c1b;
  --board:#05080f; --board-fg:#f6c453; --board-dim:#7d859b; --board-cell:#131a2b;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 112px}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Painel de partidas */
.board{background:var(--board);color:var(--board-fg);margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:18px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));font-family:var(--f-mono);
  background-image:
   conic-gradient(from 45deg at 50% 50%, transparent 0 25%, rgba(255,255,255,.025) 0 50%, transparent 0 75%, rgba(255,255,255,.025) 0);
  background-size:28px 28px}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.board-top .lbl{font-size:12px;letter-spacing:.18em;color:var(--board-dim)}
.gear{background:transparent;border:1px solid var(--board-cell);color:var(--board-fg);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.gear svg{width:20px;height:20px}
.board-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end;margin-top:14px}
.dest{font-size:13px;color:var(--board-dim);letter-spacing:.08em}
.dest b{display:block;color:var(--board-fg);font-size:22px;letter-spacing:.12em;font-weight:700;margin-top:2px}
.flaps{display:flex;gap:4px}
.flap{background:var(--board-cell);border-radius:6px;min-width:34px;padding:6px 6px;text-align:center;font-size:30px;font-weight:700;line-height:1;position:relative}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--board)}
.flap-lbl{font-size:11px;letter-spacing:.16em;color:var(--board-dim);text-align:right;margin-top:6px}
.board-sub{margin-top:12px;font-size:12px;color:var(--board-dim);letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--board-dim);display:inline-block}
.sync.on i{background:#62d29d}

/* Seções */
main{padding-top:18px}
section.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero-week h2{font-size:26px;font-weight:800}
.hero-week .sub{color:var(--muted);margin-top:4px}
.meter{height:8px;border-radius:99px;background:var(--cobalt-soft);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--cobalt);border-radius:99px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--cobalt);color:var(--on-cobalt);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--cobalt);border:1.5px solid var(--cobalt)}
.btn.soft{background:var(--cobalt-soft);color:var(--cobalt)}
.btn.saff{background:var(--saffron);color:var(--on-saffron)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.btn .ct{font-family:var(--f-mono);font-weight:500;font-size:13px;opacity:.85}
.btn.two{flex-direction:column;gap:2px;padding-block:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.days{display:flex;gap:6px;margin-top:10px}
.day{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.day i{display:block;height:28px;border-radius:8px;background:var(--line);margin-bottom:4px}
.day.on i{background:var(--saffron)}
.day.today{color:var(--ink);font-weight:700}

.phrase{display:flex;gap:12px;align-items:flex-start}
.phrase .txt{flex:1;min-width:0}
.es{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.25}
.pt{color:var(--muted)}
.note{font-size:14px;margin-top:6px;background:var(--saffron-soft);border-radius:8px;padding:6px 10px;color:var(--ink)}
.say{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center}
.say svg{width:20px;height:20px}
.say.lg{width:56px;height:56px}
.say.lg svg{width:26px;height:26px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile b{font-family:var(--f-display);font-size:17px}
.tile span{font-size:14px;color:var(--muted)}
.tile .ic{width:30px;height:30px;border-radius:9px;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center}
.tile .ic svg{width:18px;height:18px}

/* Plano */
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.week>button.head{width:100%;background:none;border:0;text-align:left;padding:14px 16px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.wnum{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.week.now .wnum{background:var(--cobalt);color:var(--on-cobalt);border-color:var(--cobalt)}
.week.done .wnum{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.wtitle{font-family:var(--f-display);font-weight:600;font-size:17px}
.wdates{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pill.now{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.soon{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.wbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line);padding-top:14px}
.tip h3{font-size:16px;margin-bottom:6px}
.tip p,.tip li{font-size:15px}
.tip ul{margin:6px 0 0;padding-left:18px}
.tip table{border-collapse:collapse;font-size:14px;margin-top:6px}
.tip td{padding:3px 12px 3px 0;border-bottom:1px solid var(--line)}
.tip td:first-child{color:var(--muted)}
.tblwrap{overflow-x:auto}
.mission{display:flex;gap:12px;align-items:flex-start;background:var(--saffron-soft);border-radius:12px;padding:12px}
.mission input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--saffron);flex:none}
.mission label{font-size:15px}
.dlg{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:none;border:0;text-align:left;padding:8px 10px;border-radius:10px}
.line:hover{background:var(--paper)}
.who{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--cobalt);padding-top:3px;min-width:22px}
.line .es{font-size:16px}
.line .pt{font-size:14px}
.list{display:flex;flex-direction:column}
.list .phrase{padding:10px 0;border-bottom:1px solid var(--line)}
.list .phrase:last-child{border-bottom:0}
.list .es{font-size:17px}

/* Frases */
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 13px;font-size:14px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.group h3{font-size:15px;color:var(--muted);font-family:var(--f-body);font-weight:700;letter-spacing:.04em;margin:6px 0 2px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);margin-right:6px}

/* Abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{background:none;border:0;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs svg{width:24px;height:24px}
nav.tabs button.on{color:var(--cobalt);background:var(--cobalt-soft)}

/* Treino (tela cheia) */
.drill{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.drill .top{display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto}
.x{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.x svg{width:20px;height:20px}
.drill .meter{flex:1}
.drill .count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{flex:1;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:18px 0;overflow-y:auto}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.flash .kind{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--saffron)}
.flash .big{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.15;text-wrap:balance}
.flash .big.pt{color:var(--ink);font-weight:600}
.flash hr{width:100%;border:0;border-top:1px dashed var(--line);margin:0}
.flash .ans{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.25}
.flash .note{text-align:left;width:100%}
.actions{max-width:560px;width:100%;margin:0 auto;display:grid;gap:10px}
.actions.three{grid-template-columns:1fr 1fr 1fr}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;font-size:17px;min-height:54px}
.opt svg{width:18px;height:18px;vertical-align:-3px;color:var(--cobalt);margin-right:8px}
.actions.duo{grid-template-columns:1fr 1.4fr}
.slowbtn{min-height:42px;border-radius:99px;padding:8px 14px;border:0;background:var(--cobalt-soft);color:var(--cobalt);font-weight:700;font-size:14px}
.say.lg+.slowbtn{min-height:56px}
.ctx{font-size:14px;color:var(--muted);text-align:left;width:100%;border-left:3px solid var(--line);padding-left:10px}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:20px;font-family:var(--f-display)}
.accents{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.accents button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.verdict{border-radius:12px;padding:12px 14px;font-weight:700;text-align:left;width:100%}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.mid{background:var(--saffron-soft);color:var(--ink)}
.done-box{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done-box .big{font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--cobalt)}

/* Ajustes */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(5,8,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.field textarea{min-height:90px;font-family:var(--f-mono);font-size:12px}
.field input[type=range]{padding:0;accent-color:var(--cobalt)}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){
  .flash,.opt,.verdict{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="board" aria-label="Contagem regressiva">
    <div class="board-top">
      <span class="lbl">SALIDAS · DEPARTURES</span>
      <button class="gear" data-act="settings" aria-label="Ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="board-row">
      <div class="dest">DESTINO<b id="b-dest">ESPAÑA</b><span id="b-date">01 FEB 2027</span></div>
      <div>
        <div class="flaps" id="b-flaps"><span class="flap">1</span><span class="flap">0</span><span class="flap">1</span></div>
        <div class="flap-lbl">DÍAS</div>
      </div>
    </div>
    <div class="board-sub"><span id="b-week">SEMANA 1 / 14</span><span class="sync" id="b-sync"><i></i><span>salvo neste aparelho</span></span></div>
  </header>

  <main>
    <section class="view" id="v-hoje"></section>
    <section class="view" id="v-plano" hidden></section>
    <section class="view" id="v-treino" hidden></section>
    <section class="view" id="v-frases" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Seções">

{ n:1, me:"B", title:"Hola, ¿qué tal?", sub:"Saudações, apresentação e pronúncia",
  tip:`<h3>Pronúncia: o que muda para quem fala português</h3>
  <ul>
   <li><b>j</b> e <b>g</b> antes de e/i soam como um "rr" forte, raspado na garganta: <i>jamón, gente</i>.</li>
   <li><b>ll</b> e <b>y</b> soam como "i" (não como "lh"): <i>calle</i> ≈ "cái-e".</li>
   <li><b>z</b> e <b>c</b> antes de e/i: na Espanha soam como o "th" do inglês <i>think</i>: <i>gracias</i> ≈ "grá-thias".</li>
   <li><b>ñ</b> = nh. O <b>h</b> é mudo. <b>v</b> soa como <b>b</b>.</li>
   <li>Não existe vogal nasal: <i>bien</i> é "bi-én", não "biẽ". O "o" e o "e" finais não viram "u" e "i": <i>noche</i> ≠ "nóchi".</li>
  </ul>
  <p style="margin-top:8px"><b>Tú ou usted?</b> Na Espanha o <i>tú</i> é usado quase sempre, até com desconhecidos da sua idade. Use <i>usted</i> com pessoas mais velhas ou em situações formais.</p>`,

{ n:2, title:"Números, horas y precios", sub:"Contar, pagar e saber que horas são",
  tip:`<h3>Números e horas</h3>

{ n:3, title:"En la cafetería", sub:"Café, tapas e o bar de esquina",
  tip:`<h3>Artigos e gênero</h3>

{ n:4, title:"En el restaurante", sub:"Pedir, entender o cardápio e pagar",

{ n:6, title:"En el hotel", sub:"Check-in, problemas e pedidos",

const TOTAL_WEEKS = WEEKS.length;
const INTERVALS = [0,1,3,7,14,30,60];

/* índice de cards */
const CARDS = [];
WEEKS.forEach(w => w.cards.forEach((c,i) => CARDS.push({id:`w${w.n}-${i}`, es:c[0], pt:c[1], note:c[2]||"", week:w.n, kind:"v", ord:w.n*100+i})));
FALSOS.forEach((c,i) => CARDS.push({id:`fa-${i}`, es:c[0], pt:c[1], note:c[2] ? "Armadilha: "+c[2] : "", week:c[3], kind:"fa", ord:c[3]*100+50+i}));
CARDS.sort((a,b)=>a.ord-b.ord);
const BYID = Object.fromEntries(CARDS.map(c=>[c.id,c]));

/* ============================================================
   DATAS
   ============================================================ */
function keyOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function numOf(key){ const [y,m,d]=key.split("-").map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5); }
function keyFromNum(n){ const d=new Date(n*864e5); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`; }
const todayKey = () => keyOf(new Date());
const todayN = () => numOf(todayKey());
const MES = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
function fmtShort(n){ const k=keyFromNum(n).split("-"); const m=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][+k[1]-1]; return `${+k[2]} ${m}`; }

/* ============================================================
   ESTADO (localStorage + sincronização opcional)
   ============================================================ */
const LS_KEY = "rumbo-espana-v1";
function defaults(){ return {v:1,start:todayKey(),trip:"2027-02-01",dest:"ESPAÑA",daily:8,rate:0.9,unlocked:1,cards:{},missions:{},log:{},updatedAt:0}; }
function normalize(s){ const d=defaults(); s = (s && typeof s==="object") ? s : {}; return Object.assign(d, s, {cards:s.cards||{}, missions:s.missions||{}, log:s.log||{}}); }
function loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw) return normalize(JSON.parse(raw)); }catch(e){} return defaults(); }
let S = loadLocal();
function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function save(){ S.updatedAt = Date.now(); persistLocal(); scheduleRemote(); }

let remote = null, remoteTimer = null, writing = false, again = false;
function scheduleRemote(){ if(!remote) return; clearTimeout(remoteTimer); remoteTimer = setTimeout(flushRemote, 1500); }
async function flushRemote(){
  if(!remote) return;
  if(writing){ again = true; return; }
  writing = true;
  try{ await remote.set({state:S}); setSync(true); }
  catch(e){ const c=e && e.code; if(c==="unavailable"){ setTimeout(scheduleRemote, 4000+Math.random()*2000); } else { remote=null; setSync(false); } }
  writing = false;
  if(again){ again=false; flushRemote(); }
}
function setSync(on){ const el=document.getElementById("b-sync"); el.classList.toggle("on",on); el.lastElementChild.textContent = on ? "sincronizado na conta" : "salvo neste aparelho"; }
async function connectRemote(){
  try{
    if(!window.claude || typeof window.claude.use!=="function") return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc("data/users/"+uid+"/progress");
    const snap = await ref.get();
    const r = snap.exists ? snap.data() : null;
    const rs = r && r.state;
    remote = ref; setSync(true);
    if(rs && (rs.updatedAt||0) > (S.updatedAt||0)){ S = normalize(JSON.parse(JSON.stringify(rs))); persistLocal(); renderAll(); }
    else if((S.updatedAt||0) > ((rs && rs.updatedAt)||0)){ flushRemote(); }
  }catch(e){ remote=null; }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && remoteTimer){ clearTimeout(remoteTimer); flushRemote(); } });

/* ============================================================
   LÓGICA DE ESTUDO
   ============================================================ */
function weekByDate(){ return Math.min(TOTAL_WEEKS, Math.max(1, Math.floor((todayN()-numOf(S.start))/7)+1)); }
function curWeek(){ return Math.min(TOTAL_WEEKS, Math.max(weekByDate(), S.unlocked||1)); }
function weekStart(n){ return numOf(S.start)+(n-1)*7; }
function unlockedCards(){ const w=curWeek(); return CARDS.filter(c=>c.week<=w); }
function seenCards(){ return CARDS.filter(c=>S.cards[c.id]); }
function newCards(){ return unlockedCards().filter(c=>!S.cards[c.id]); }
function dueCards(){ const t=todayN(); return CARDS.filter(c=>S.cards[c.id] && S.cards[c.id].d<=t).sort((a,b)=>S.cards[a.id].d-S.cards[b.id].d); }
function logToday(){ const k=todayKey(); if(!S.log[k]) S.log[k]={n:0,r:0,q:0,s:0}; if(!S.log[k].s) S.log[k].s=0; return S.log[k]; }
const activity = l => l ? (l.n||0)+(l.r||0)+(l.q||0)+(l.s||0) : 0;
function spokenTotal(){ return Object.values(S.log).reduce((a,l)=>a+(l.s||0),0); }
function newLeftToday(){ const l=S.log[todayKey()]; return Math.max(0, S.daily - (l ? l.n : 0)); }
function streak(){ let n=todayN(), s=0; const active=k=>activity(S.log[k])>0;
  if(!active(keyFromNum(n))) n--; while(active(keyFromNum(n))){ s++; n--; } return s; }
function weekProgress(w){ const cs=CARDS.filter(c=>c.week===w); const seen=cs.filter(c=>S.cards[c.id]).length; return {seen,total:cs.length}; }
function learnedCount(){ return CARDS.filter(c=>S.cards[c.id] && S.cards[c.id].b>=1).length; }
function masteredCount(){ return CARDS.filter(c=>S.cards[c.id] && S.cards[c.id].b>=4).length; }
function grade(card, result){
  const t=todayN(); const st=S.cards[card.id] || {b:0,d:t};
  if(result==="bad"){ st.b=0; st.d=t; }
  else if(result==="mid"){ st.b=Math.max(1,st.b); st.d=t+1; }
  else { st.b=Math.min(INTERVALS.length-1, st.b + (result==="easy"?2:1)); st.d=t+INTERVALS[st.b]; }
  S.cards[card.id]=st;
}

/* ============================================================
   VOZ (speechSynthesis, voz es-ES quando existir)
   ============================================================ */
const canSpeak = "speechSynthesis" in window;
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices() || []; }catch(e){ voices=[]; } }
if(canSpeak){ loadVoices(); try{ speechSynthesis.addEventListener("voiceschanged", loadVoices); }catch(e){} }
function esVoice(){ return voices.find(v=>/^es[-_]ES/i.test(v.lang)) || voices.find(v=>/^es/i.test(v.lang)); }
function cleanSpeech(t){ return t.replace(/\(.*?\)/g,"").replace(/…/g,"").replace(/\s\/\s/g,", ").trim(); }
function utter(t, pitch, slow){ const u=new SpeechSynthesisUtterance(cleanSpeech(t)); u.lang="es-ES"; const v=esVoice(); if(v) u.voice=v; u.rate=slow ? Math.max(0.5,S.rate*0.7) : S.rate; if(pitch) u.pitch=pitch; return u; }
function speak(t, slow){ if(!canSpeak) return; try{ speechSynthesis.cancel(); speechSynthesis.speak(utter(t, 0, slow)); }catch(e){} }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let MIC = !!SR && !window.claude && window.isSecureContext;
function hear(){ return new Promise((res,rej)=>{ let done=false; const r=new SR(); r.lang="es-ES"; r.interimResults=false; r.maxAlternatives=3;
  r.onresult=e=>{ done=true; res(Array.from(e.results[0]).map(a=>a.transcript)); };
  r.onerror=e=>{ done=true; rej(e.error); }; r.onend=()=>{ if(!done) res([]); };
  try{ speechSynthesis.cancel(); r.start(); }catch(e){ rej("start"); } }); }
function similarity(said, target){ const w=x=>norm(x).replace(/[¿?¡!.,;:…]/g," ").split(/\s+/).filter(Boolean); const T=w(cleanSpeech(target)); const A=new Set(w(said)); return T.length ? T.filter(x=>A.has(x)).length/T.length : 0; }
function speakDialog(lines){ if(!canSpeak) return; try{ speechSynthesis.cancel(); const who=[...new Set(lines.map(l=>l[0]))]; lines.forEach(l=>speechSynthesis.speak(utter(l[1], who.indexOf(l[0])%2 ? 1.25 : 0.9))); }catch(e){} }

   TREINOS (tela cheia)
   ============================================================ */
let D = null; // treino atual
function openDrill(d){ D = d; D.i = 0; D.score = 0; D.revealed = false; D.total = d.items.length; $("#drill").hidden = false; document.body.style.overflow="hidden"; drawDrill(); }
function closeDrill(){ D = null; $("#drill").hidden = true; document.body.style.overflow=""; try{ speechSynthesis.cancel(); }catch(e){} renderAll(); }
function drillTop(){ const pct = D.items.length ? Math.round(100*D.i/D.items.length) : 100;
  return `<div class="top"><button class="x" data-act="closedrill" aria-label="Fechar">${ICON.x}</button><div class="meter"><span style="width:${pct}%"></span></div><span class="count">${Math.min(D.i+1,D.items.length)}/${D.items.length}</span></div>`; }

function startSession(){
  const fresh = newCards().slice(0, newLeftToday());
  const due = shuffle(dueCards().slice(0,40));
  const items = [];
  for(let i=0;i<fresh.length;i+=4){ const chunk=fresh.slice(i,i+4); chunk.forEach(c=>items.push({t:"learn",c})); shuffle(chunk).forEach(c=>items.push({t:"test",c,dir:Math.random()<.8?"pt":"es"})); }
  due.forEach(c=>items.push({t:"test",c,dir:Math.random()<.8?"pt":"es"}));
  if(!items.length){ toast("Nada pendente hoje. Faça um quiz!"); return; }
  openDrill({mode:"session", items, revealed:false, retries:{}});
}
function quizPool(week){
  let pool = week ? CARDS.filter(c=>c.week===week) : seenCards();
  if(pool.length < 6) pool = unlockedCards();
  return pool;
}
function startQuiz(kind, week){
  const pool = quizPool(week);
  const qs = shuffle(pool).slice(0,10).map(c=>{
    const dir = kind==="listen" ? "listen" : (Math.random()<.5 ? "es" : "pt");
    const field = dir==="pt" ? "es" : "pt";
    const sameW = CARDS.filter(x=>x.id!==c.id && x.kind===c.kind && x[field]!==c[field]);
    const near = shuffle(sameW.filter(x=>Math.abs(x.week-c.week)<=1));
    const far = shuffle(sameW);
    const opts=[c[field]]; for(const x of [...near,...far]){ if(opts.length>=4) break; if(!opts.includes(x[field])) opts.push(x[field]); }
    return {t:"mc", c, dir, field, opts:shuffle(opts), picked:null};
  });
  openDrill({mode:kind, items:qs});
}
function startWrite(){
  let pool = seenCards(); if(pool.length<6) pool = unlockedCards();
  pool = pool.filter(c=>!/[\/…,]/.test(c.es) && c.es.length<=36);
  if(!pool.length){ toast("Veja algumas frases primeiro."); return; }
  openDrill({mode:"write", items:shuffle(pool).slice(0,8).map(c=>({t:"write",c,answer:null}))});
}
function startConv(week, role){
  const w = WEEKS[(week||curWeek())-1]; const me = role || w.me || "A";
  openDrill({mode:"conv", week:w.n, me, items:w.dialog.map((l,k)=>({t:l[0]===me?"mine":"theirs", line:l, prev:k?w.dialog[k-1]:null}))});
}
function pickConv(){
  const cw = curWeek();
  openDrill({mode:"pick", items:[{t:"pick"}]});
  $("#drill").innerHTML = drillTop().replace(/<div class="meter">.*?<\/div><span class="count">.*?<\/span>/,'<h2 style="font-size:20px;flex:1">Escolha a conversa</h2>') +
    `<div class="stage" style="justify-content:flex-start"><div class="opts">${WEEKS.filter(w=>w.n<=cw).map(w=>`<button class="opt" data-act="conv" data-week="${w.n}"><b>${String(w.n).padStart(2,"0")}</b> · ${h(w.title)}<br><span class="muted small">${h(w.dialog[0][1])}</span></button>`).join("")}</div></div>`;
}
function startEco(){ let pool=seenCards(); if(pool.length<6) pool=unlockedCards(); openDrill({mode:"eco", items:shuffle(pool).slice(0,10).map(c=>({t:"eco",c}))}); }
function startSons(){ openDrill({mode:"sons", items:SOUNDS.map(x=>({t:"som",s:x}))}); }
function heardHtml(it){ if(!it.heard) return ""; const sc=it.heard.score; const cls=sc>=.8?"ok":sc>=.5?"mid":"bad";
  return `<div class="verdict ${cls}">${sc>=.8?"¡Muy bien!":sc>=.5?"Quase lá.":"Não ficou claro."} Entendi: “${h(it.heard.text)}”</div>`; }
function micBtn(it){ return `<button class="btn saff" data-act="mic">${ICON.mic} ${it.listening?"Ouvindo…":"Falar"}</button>`; }
function startFalsos(){
  const pool = CARDS.filter(c=>c.kind==="fa");
  const qs = shuffle(pool).slice(0,10).map(c=>{ const opts=[c.pt, ...shuffle(pool.filter(x=>x.id!==c.id)).slice(0,3).map(x=>x.pt)]; return {t:"mc",c,dir:"es",field:"pt",opts:shuffle(opts),picked:null}; });
  openDrill({mode:"falsos", items:qs});
}

function drawDrill(){
  const el = $("#drill");
  if(D.i >= D.items.length){ return drawDone(); }
  const it = D.items[D.i], c = it.c;
  let stage = "", actions = "";
  if(it.t==="learn"){
    if(!it.played){ it.played=true; speak(c.es); }
    stage = `<div class="flash"><span class="kind">${c.kind==="fa"?"Falso amigo":"Frase nova"} · ouça e repita em voz alta</span><div class="big">${h(c.es)}</div>${sayRow(c.es,true)}<hr><div class="ans" style="color:var(--muted)">${h(c.pt)}</div>${c.note?`<div class="note">${h(c.note)}</div>`:""}</div>`;
    actions = `<div class="actions"><button class="btn wide" data-act="learned">Repeti em voz alta, próxima</button></div>`;
  } else if(it.t==="test"){
    const oral = it.dir==="pt";
    if(!oral && !it.played){ it.played=true; speak(c.es); }
    const front = oral ? c.pt : c.es;
    const back = oral ? c.es : c.pt;
    stage = `<div class="flash"><span class="kind">${oral?"Diga em voz alta, em espanhol":"Ouça: o que significa?"}</span><div class="big ${oral?"pt":""}">${h(front)}</div>${!oral?sayBtn(c.es,true):""}${heardHtml(it)}${D.revealed?`<hr><div class="ans">${h(back)}</div>${oral?sayRow(c.es):""}${c.note?`<div class="note">${h(c.note)}</div>`:""}`:""}</div>`;
    actions = D.revealed
      ? `<div class="actions three"><button class="btn bad" data-act="grade" data-g="bad">Não saiu</button><button class="btn soft" data-act="grade" data-g="mid">Quase</button><button class="btn ok" data-act="grade" data-g="good">${oral?"Falei bem":"Entendi"}</button></div>`
      : `<div class="actions${MIC&&oral?" duo":""}">${MIC&&oral?micBtn(it):""}<button class="btn wide" data-act="reveal">${oral?"Já falei: ouvir a resposta":"Mostrar significado"}</button></div>`;
  } else if(it.t==="theirs"){
    if(!it.played){ it.played=true; speak(it.line[1]); }
    const nextMine = D.items[D.i+1] && D.items[D.i+1].t==="mine";
    stage = `<div class="flash"><span class="kind">${h(it.line[0])} fala</span><div class="big">${h(it.line[1])}</div>${sayRow(it.line[1],true)}<hr><div class="pt">${h(it.line[2])}</div></div>`;
    actions = `<div class="actions"><button class="btn wide" data-act="next">${nextMine?"Sua vez de responder":"Continuar"}</button></div>`;
  } else if(it.t==="mine"){
    stage = `${it.prev?`<div class="ctx">${h(it.prev[0])}: “${h(it.prev[1])}”</div>`:""}<div class="flash"><span class="kind">Sua fala · diga em espanhol</span><div class="big pt">${h(it.line[2])}</div>${heardHtml(it)}${D.revealed?`<hr><div class="ans">${h(it.line[1])}</div>${sayRow(it.line[1])}<p class="small muted">Repita imitando a entonação.</p>`:""}</div>`;
    actions = D.revealed ? `<div class="actions"><button class="btn wide" data-act="next">Próxima fala</button></div>`
      : `<div class="actions${MIC?" duo":""}">${MIC?micBtn(it):""}<button class="btn wide" data-act="reveal">Já falei: ouvir o certo</button></div>`;
  } else if(it.t==="eco"){
    if(!it.played){ it.played=true; speak(c.es); }
    stage = `<div class="flash"><span class="kind">Eco · ouça e repita junto</span><div class="big">${h(c.es)}</div>${sayRow(c.es,true)}<hr><div class="pt">${h(c.pt)}</div><p class="small muted">Repita 3 vezes: devagar, no ritmo normal e de olhos fechados.</p></div>`;
    actions = `<div class="actions"><button class="btn wide" data-act="spoke">Repeti, próxima</button></div>`;
  } else if(it.t==="som"){
    const x = it.s;
    stage = `<div class="flash" style="text-align:left;align-items:stretch"><span class="kind">Som difícil</span><div class="big" style="font-size:26px">${h(x.t)}</div><p>${h(x.d)}</p><div class="opts">${x.ex.map(e=>`<button class="opt" data-act="say" data-say="${h(e)}">${ICON.say}${h(e)}</button>`).join("")}</div><p class="small muted">Toque em cada uma, ouça e repita em voz alta.</p></div>`;
    actions = `<div class="actions"><button class="btn wide" data-act="spoke">Repeti todas, próximo som</button></div>`;
  } else if(it.t==="mc"){
    const prompt = it.dir==="listen" ? `<span class="kind">Ouça e escolha</span>${sayBtn(c.es,true)}${it.picked!==null?`<div class="ans">${h(c.es)}</div>`:""}`
      : `<span class="kind">${it.dir==="es"?"O que significa?":"Como se diz em espanhol?"}</span><div class="big ${it.dir==="pt"?"pt":""}">${h(it.dir==="es"?c.es:c.pt)}</div>${it.dir==="es"?sayBtn(c.es):""}`;
    stage = `<div class="flash">${prompt}</div><div class="opts">${it.opts.map((o,k)=>{ let cls=""; if(it.picked!==null){ if(o===c[it.field]) cls=" right"; else if(k===it.picked) cls=" wrong"; } return `<button class="opt${cls}" data-act="pick" data-k="${k}" ${it.picked!==null?"disabled":""}>${h(o)}</button>`; }).join("")}</div>${it.picked!==null && c.note ? `<div class="note">${h(c.note)}</div>`:""}`;
    actions = it.picked!==null ? `<div class="actions"><button class="btn wide" data-act="next">Próxima</button></div>` : "";
  } else if(it.t==="write"){
    const res = it.answer;
    stage = `<div class="flash"><span class="kind">Escreva em espanhol</span><div class="big pt">${h(c.pt)}</div>
      ${res ? `<div class="verdict ${res.v}">${res.v==="ok"?"¡Perfecto!":res.v==="mid"?"Quase! Confira os acentos:":"A resposta é:"} <span style="font-family:var(--f-display)">${h(c.es)}</span></div>${sayBtn(c.es)}${c.note?`<div class="note">${h(c.note)}</div>`:""}`
      : `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Digite aqui"><div class="accents">${["á","é","í","ó","ú","ñ","ü","¿","¡"].map(a=>`<button data-act="acc" data-a="${a}">${a}</button>`).join("")}</div>`}</div>`;
    actions = res ? `<div class="actions"><button class="btn wide" data-act="next">Próxima</button></div>` : `<div class="actions"><button class="btn wide" data-act="check">Conferir</button></div>`;
  }
  el.innerHTML = drillTop() + `<div class="stage">${stage}</div>` + actions;
  const a = $("#ans"); if(a){ a.focus(); a.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); checkWrite(); } }); }
}
function drawDone(){
  const M = {
    session:["¡Olé!","Sessão concluída!",`Agora pratique a conversa da semana. Sequência: ${streak()} ${streak()===1?"dia":"dias"}.`],
    conv:["¡Genial!","Conversa completa!","Agora troque de papel e faça a outra pessoa."],
    eco:["¡Bien!","Eco concluído","Quanto mais você repete em voz alta, mais natural fica."],
    sons:["¡Perfecto!","Sons revisados","Volte aqui sempre que algum som travar."]
  }[D.mode];
  const [big, msg, sub] = M || [`${D.score} de ${D.total}`, "", D.score>=D.total*0.8 ? "¡Muy bien! Você está mandando bem." : "Os erros voltam na sua próxima sessão de revisão."];
  const btns = D.mode==="session" ? `<button class="btn saff wide" data-act="conv">Praticar a conversa da semana</button>`
    : D.mode==="conv" ? `<button class="btn saff wide" data-act="convswap">Trocar de papel</button><button class="btn soft wide" data-act="again">De novo</button>`
    : `<button class="btn soft wide" data-act="again">Mais uma rodada</button>`;
  $("#drill").innerHTML = drillTop() + `<div class="stage"><div class="done-box"><div class="big">${h(big)}</div>${msg?`<p style="font-size:18px;font-weight:700">${h(msg)}</p>`:""}<p class="muted">${h(sub)}</p></div></div><div class="actions">${btns}<button class="btn ghost wide" data-act="closedrill">Voltar</button></div>`;
}
function checkWrite(){
  const it = D.items[D.i]; const v = ($("#ans")||{}).value || "";
  const strip = s => s.toLowerCase().replace(/[¿?¡!.,;:]/g,"").replace(/\s+/g," ").trim();
  const exact = strip(v)===strip(it.c.es);
  const loose = norm(strip(v))===norm(strip(it.c.es));
  it.answer = {v: exact?"ok":loose?"mid":"bad"};
  if(exact||loose) D.score++;
  if(!exact && !loose && S.cards[it.c.id]){ S.cards[it.c.id].d = todayN(); }
  logToday().q++; save();
  drawDrill();
}

/* ============================================================
   AJUSTES
   ============================================================ */
let resetArmed = false;
function openSettings(){
  resetArmed = false;
  const el = $("#sheet");
  el.innerHTML = `<div class="sheet" role="dialog" aria-label="Ajustes">
    <div class="spread"><h2 style="font-size:22px">Ajustes</h2><button class="x" data-act="closesheet" aria-label="Fechar">${ICON.x}</button></div>
    <div class="field"><label for="s-trip">Data da viagem</label><input type="date" id="s-trip" value="${h(S.trip)}"></div>
    <div class="field"><label for="s-dest">Destino no painel</label><input id="s-dest" maxlength="14" value="${h(S.dest||"ESPAÑA")}"><span class="hint">Ex.: MADRID, BARCELONA, SEVILLA.</span></div>
    <div class="field"><label for="s-start">Início do plano (semana 1)</label><input type="date" id="s-start" value="${h(S.start)}"><span class="hint">As semanas avançam sozinhas a cada 7 dias a partir desta data.</span></div>
    <div class="field"><label for="s-daily">Frases novas por dia</label><select id="s-daily">${[5,8,10,12,15].map(n=>`<option value="${n}" ${S.daily===n?"selected":""}>${n}${n===8?" (recomendado)":""}</option>`).join("")}</select></div>
    <div class="field"><label for="s-rate">Velocidade da voz: <span id="s-rate-v">${S.rate.toFixed(2)}</span>×</label><input type="range" id="s-rate" min="0.6" max="1.1" step="0.05" value="${S.rate}">${canSpeak?`<button class="btn soft" data-act="say" data-say="Hola, ¿qué tal? Me llamo Lucía y vivo en Madrid.">Testar voz</button>`:`<span class="hint">Este navegador não oferece voz.</span>`}<span class="hint">${canSpeak ? (esVoice() ? "Voz em uso: "+h(esVoice().name) : "Nenhuma voz de espanhol instalada; o aparelho usará a voz padrão. No Android, instale 'Espanhol (Espanha)' em Configurações › Idioma › Conversão de texto em voz.") : ""}</span></div>
    <div class="field"><label for="s-io">Backup do progresso</label><textarea id="s-io" placeholder="Cole aqui um backup para restaurar"></textarea>
      <div class="row"><button class="btn soft" data-act="export" style="flex:1">Copiar backup</button><button class="btn ghost" data-act="import" style="flex:1">Restaurar</button></div>
      <span class="hint">Use para levar seu progresso para outro aparelho.</span></div>
    <button class="btn bad wide" data-act="reset" id="s-reset">Apagar todo o progresso</button>
  </div>`;
  el.hidden = false;
  $("#s-rate").addEventListener("input", e=>{ $("#s-rate-v").textContent = (+e.target.value).toFixed(2); });
  ["s-trip","s-start","s-daily","s-rate","s-dest"].forEach(id=>$("#"+id).addEventListener("change", applySettings));
}
function applySettings(){
  const trip=$("#s-trip").value, start=$("#s-start").value;
  if(/^\d{4}-\d{2}-\d{2}$/.test(trip)) S.trip=trip;
  if(/^\d{4}-\d{2}-\d{2}$/.test(start)) S.start=start;
  S.daily = +$("#s-daily").value || 8;
  S.rate = +$("#s-rate").value || 0.9;
  S.dest = ($("#s-dest").value || "ESPAÑA").slice(0,14);
  save(); renderAll();
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(act==="mission") return; // tratado no change
  switch(act){
    case "tab": showTab(el.dataset.tab); break;
    case "say": speak(el.dataset.say); break;
    case "dialog": speakDialog(WEEKS[+el.dataset.week-1].dialog); break;
    case "session": startSession(); break;
    case "quiz": startQuiz("quiz", el.dataset.week ? +el.dataset.week : null); break;
    case "listen": startQuiz("listen"); break;
    case "write": startWrite(); break;
    case "falsos": startFalsos(); break;
    case "again": { const m=D.mode, wk=D.week, me=D.me; closeDrill(); if(m==="write") startWrite(); else if(m==="falsos") startFalsos(); else if(m==="conv") startConv(wk,me); else if(m==="eco") startEco(); else if(m==="sons") startSons(); else startQuiz(m); break; }
    case "conv": { if(el.dataset.pick){ pickConv(); break; } const wk = el.dataset.week ? +el.dataset.week : null; if(D) closeDrill(); startConv(wk); break; }
    case "convswap": { const wk=D.week, me=D.me; const other=[...new Set(WEEKS[wk-1].dialog.map(l=>l[0]))].find(x=>x!==me); closeDrill(); startConv(wk, other); break; }
    case "eco": startEco(); break;
    case "sons": startSons(); break;
    case "slow": speak(el.dataset.say, true); break;
    case "spoke": logToday().s++; save(); D.i++; drawDrill(); break;
    case "mic": {
      const it=D.items[D.i]; if(it.listening) break;
      const target = it.c ? it.c.es : it.line[1];
      it.listening=true; drawDrill();
      hear().then(alts=>{
        it.listening=false;
        if(!D || D.items[D.i]!==it) return;
        if(!alts.length){ toast("Não ouvi nada. Tente de novo, mais perto do celular."); drawDrill(); return; }
        it.heard={text:alts[0], score:Math.max(...alts.map(a=>similarity(a,target)))};
        D.revealed=true; logToday().s++; save(); drawDrill(); speak(target);
      }).catch(err=>{
        it.listening=false;
        if(err==="not-allowed"||err==="service-not-allowed"||err==="start"){ MIC=false; toast("Microfone indisponível. Fale em voz alta e confira ouvindo."); }
        else toast("Não ouvi direito. Tente de novo.");
        if(D) drawDrill();
      });
      break; }
    case "goweek": openWeek=+el.dataset.week; renderPlano(); showTab("plano"); break;
    case "toggleweek": { const n=+el.dataset.week; openWeek = openWeek===n ? -1 : n; renderPlano(); const nb=document.querySelector(`[data-act="toggleweek"][data-week="${n}"]`); if(nb) nb.scrollIntoView({block:"start",behavior:"smooth"}); break; }
    case "unlock": { const n=+el.dataset.week; S.unlocked=Math.max(S.unlocked||1,n); save(); renderAll(); toast(`Semana ${n} liberada no treino`); break; }
    case "chip": phraseFilter=el.dataset.k; renderFrases(); break;
    case "closedrill": closeDrill(); break;
    case "learned": { const c=D.items[D.i].c; if(!S.cards[c.id]){ S.cards[c.id]={b:0,d:todayN()}; logToday().n++; save(); } D.i++; drawDrill(); break; }
    case "reveal": { const it=D.items[D.i]; const first=!D.revealed; D.revealed=true;
      if(it.t==="mine"){ if(first && !it.heard){ logToday().s++; save(); } drawDrill(); speak(it.line[1]); }
      else { drawDrill(); if(it.dir==="pt") speak(it.c.es); } break; }
    case "grade": {
      const it=D.items[D.i], g=el.dataset.g;
      const wasNew = !S.cards[it.c.id];
      grade(it.c, g);
      const lg=logToday(); if(wasNew) lg.n++; else lg.r++; if(it.dir==="pt" && !it.heard) lg.s++;
      if(g==="bad"){ D.retries[it.c.id]=(D.retries[it.c.id]||0)+1; if(D.retries[it.c.id]<=2) D.items.push({t:"test",c:it.c,dir:it.dir==="pt"?"es":"pt"}); }
      save(); D.revealed=false; D.i++; drawDrill(); break; }
    case "pick": {
      const it=D.items[D.i]; if(it.picked!==null) break; it.picked=+el.dataset.k;
      const right = it.opts[it.picked]===it.c[it.field];
      if(right) D.score++; else if(S.cards[it.c.id]) S.cards[it.c.id].d=todayN();
      logToday().q++; save(); drawDrill(); if(it.dir==="pt") speak(it.c.es); break; }
    case "next": D.revealed=false; D.i++; drawDrill(); break;
    case "check": checkWrite(); break;
    case "acc": { const a=$("#ans"); if(a){ const s=a.selectionStart??a.value.length, en=a.selectionEnd??a.value.length; a.value=a.value.slice(0,s)+el.dataset.a+a.value.slice(en); a.focus(); a.setSelectionRange(s+1,s+1); } break; }
    case "settings": openSettings(); break;
    case "closesheet": $("#sheet").hidden=true; break;
    case "export": { const txt=JSON.stringify(S); const ta=$("#s-io"); ta.value=txt;
      try{ navigator.clipboard.writeText(txt).then(()=>toast("Backup copiado"), ()=>{ ta.select(); toast("Selecionado: copie o texto"); }); }catch(err){ ta.select(); toast("Selecionado: copie o texto"); } break; }
    case "import": { try{ const obj=JSON.parse($("#s-io").value); if(!obj || typeof obj!=="object" || !obj.cards) throw 0; S=normalize(obj); save(); renderAll(); $("#sheet").hidden=true; toast("Progresso restaurado"); }catch(err){ toast("Backup inválido: cole o texto completo copiado antes"); } break; }
    case "reset": { if(!resetArmed){ resetArmed=true; el.textContent="Toque de novo para confirmar"; break; } const keep={trip:S.trip,dest:S.dest}; S=Object.assign(defaults(),keep); save(); renderAll(); $("#sheet").hidden=true; openWeek=null; toast("Progresso apagado"); break; }
  }
});
document.addEventListener("change", e=>{
  const el = e.target; if(el.dataset && el.dataset.act==="mission"){ S.missions[el.dataset.week] = el.checked; save(); if(el.checked) toast("Missão cumprida. ¡Muy bien!"); renderAll(); }
});
document.addEventListener("input", e=>{ if(e.target.id==="q"){ phraseQuery=e.target.value; renderPhraseList(); } });
$("#sheet").addEventListener("click", e=>{ if(e.target.id==="sheet") $("#sheet").hidden=true; });

/* início */
if(!S.updatedAt){ persistLocal(); }
renderAll();
connectRemote();
if("serviceWorker" in navigator && !window.claude && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
