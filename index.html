document.addEventListener("click", e=>{
  const wd = e.target.closest(".w");
  if(wd && !e.target.closest('[data-act="pick"]')){
    e.preventDefault(); e.stopPropagation();
    document.querySelectorAll(".w.hit").forEach(x=>x.classList.remove("hit")); wd.classList.add("hit");
    const ctxEl = wd.closest(".es,.big,.ans,.bub,.opt,.ttl,.wtitle,i"); showDict(wd.textContent, ctxEl ? ctxEl.textContent.trim() : "");
    return;
  }
  if(!e.target.closest("#dic") && !$("#dic").hidden) hideDict();
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act;
  if(act==="dicclose"){ hideDict(); return; }
  if(act==="dictword"){ showDict(el.dataset.w, ""); return; }
  if(act==="asklola"){ askLola(el.dataset.w, el.dataset.ctx); return; }
  if(act==="mission") return; // tratado no change
  switch(act){
    case "tab": showTab(el.dataset.tab); break;
    case "say": speak(el.dataset.say); break;
    case "dialog": speakDialog(el.dataset.which==="B" ? WEEKS[+el.dataset.week-1].dialogB : WEEKS[+el.dataset.week-1].dialog); break;
    case "session": startSession(); break;
    case "quiz": startQuiz("quiz", el.dataset.week ? +el.dataset.week : null); break;
    case "listen": startQuiz("listen"); break;
    case "write": startWrite(); break;
    case "falsos": startFalsos(); break;
    case "pasajeros": openPasajeros(); break;
    case "progreso": openProgreso(); break;
    case "obdone": { const n=(($("#ob-name")||{}).value||"").trim().slice(0,20); if(n){ S.name=n; me().name=n; } PR.onboarded=true; saveProfiles(); save(); $("#sheet").hidden=true; renderAll(); toast(n?`¡Encantada, ${n}!`:"¡Vamos!"); break; }
    case "vdest": { const id=el.dataset.id; if(V.dests.includes(id)) V.dests=V.dests.filter(x=>x!==id); else { V.dests.push(id); if(!V.days[id]) V.days[id]=DEST[id].stay.ideal; } saveProfiles(); renderViaje(); break; }
    case "vdays": { const id=el.dataset.id; V.days[id]=Math.min(7,Math.max(1,(V.days[id]||1)+(+el.dataset.d))); saveProfiles(); renderViaje(); break; }
    case "vint": { const k=el.dataset.k; V.interests = V.interests.includes(k) ? V.interests.filter(x=>x!==k) : [...V.interests,k]; saveProfiles(); renderViaje(); break; }
    case "vritmo": V.ritmo=el.dataset.k; saveProfiles(); renderViaje(); break;
    case "vmove": moveDest(el.dataset.id, +el.dataset.d); saveProfiles(); renderViaje(); break;
    case "vclear": viajeQ=""; renderViaje(); break;
    case "vopen": { const id=el.dataset.id; V.open = V.open===id ? null : id; saveProfiles(); renderViaje(); const nb=document.querySelector(`[data-act="vopen"][data-id="${id}"]`); if(nb) nb.scrollIntoView({block:"start",behavior:"smooth"}); break; }
    case "useprofile": switchProfile(el.dataset.id); $("#sheet").hidden=true; toast(`Agora é ${me().name}. ¡Vamos!`); break;
    case "delprofile": { if(el.dataset.armed){ removeProfile(el.dataset.id); openPasajeros(); toast("Removido."); } else { el.dataset.armed="1"; el.style.background="var(--bad-soft)"; el.style.color="var(--bad)"; toast("Toque de novo para remover"); setTimeout(()=>{ delete el.dataset.armed; el.style.background=""; el.style.color=""; }, 2500); } break; }
    case "share": sharePlacar(); break;
    case "recvinv": { const d=parseInvite(($("#s-inv")||{}).value); if(!d){ toast("Não reconheci esse link. Cole o link inteiro."); break; } if(receiveScore(d)){ renderAll(); openPasajeros(); toast(`Placar de ${d.name} atualizado.`); } break; }
    case "addprofile": { const id=addProfile(($("#s-newp")||{}).value); if(!id){ toast("Digite um nome"); break; } openPasajeros(); toast("Passageiro adicionado. Toque em Usar para trocar."); break; }
    case "duel": startDuel(); break;
    case "again": { const m=D.mode, wk=D.week, me=D.me, wh=D.which; closeDrill(); if(m==="write") startWrite(); else if(m==="falsos") startFalsos(); else if(m==="conv") startConv(wk,me,wh); else if(m==="duel") startDuel(); else if(m==="eco") startEco(); else if(m==="pron") startPron(); else if(m==="sons") startSons(); else startQuiz(m); break; }
    case "conv": { if(el.dataset.pick){ pickConv(); break; } const wk = el.dataset.week ? +el.dataset.week : null; const wh=el.dataset.which||"A"; if(D) closeDrill(); startConv(wk, null, wh); break; }
    case "convswap": { const wk=D.week, me=D.me, wh=D.which||"A"; const lines = wh==="B" ? WEEKS[wk-1].dialogB : WEEKS[wk-1].dialog; const other=[...new Set(lines.map(l=>l[0]))].find(x=>x!==me); closeDrill(); startConv(wk, other, wh); break; }
    case "eco": startEco(); break;
    case "sons": startSons(); break;
    case "slow": speak(el.dataset.say, true); break;
    case "spoke": logToday().s++; save(); D.i++; drawDrill(); break;
    case "micstop": { try{ if(REC) REC.stop(); }catch(e){} break; }
    case "mic": {
      const it=D.items[D.i]; if(it.listening) break;
      const target = it.txt || (it.c ? it.c.es : it.line[1]);
      it.listening=true; drawDrill(); heardLive("");
      hear(heardLive, 9000).then(r=>{
        it.listening=false;
        if(!D || D.items[D.i]!==it) return;
        const alts=r.alts;
        if(!alts.length){
          it.micFail=(it.micFail||0)+1;
          toast(IS_IOS && STANDALONE && it.micFail>=2 ? "No iPhone instalado o microfone costuma falhar. Abra o mesmo endereço no Safari." : "Não ouvi nada. Toque em Falar e comece a falar logo em seguida.");
          drawDrill(); return;
        }
        if(it.t==="pron"){
          const ps=pronScore(alts, target); it.tries++;
          it.heard={text:alts[0], score:ps.score, marks:ps.marks, msg: ps.score>=.99 ? rnd(PRAISE) : rnd(CHEER)};
          if(ps.score>=.99 && it.tries===1) D.firstTry++;
          tone(ps.score>=.99?"ok":"bad"); if(ps.score>=.99) buzz(15); logToday().s++; save(); drawDrill(); if(ps.score<.99) speak(target, true);
          return;
        }
        it.heard={text:alts[0], score:Math.max(...alts.map(a=>similarity(a,target)))}; tone(it.heard.score>=.5?"ok":"bad"); if(it.heard.score>=.8) buzz(15);
        D.revealed=true; logToday().s++; save(); drawDrill(); speak(target);
      }).catch(code=>{
        it.listening=false;
        if(code==="not-allowed"||code==="service-not-allowed"||code==="start"||code==="language-not-supported") MIC=false;
        toast(micHint(code));
        if(D) drawDrill();
      });
      break; }
    case "mictest": micTest(); break;
    case "pron": startPron(); break;
    case "phototest": {
      const out=$("#photo-test-out"); out.textContent="Testando…"; out.className="verdict mid";
      (async()=>{ const lines=[]; const t0=Date.now();
        try{ const r=await fetch("https://es.wikipedia.org/api/rest_v1/page/media-list/Puerta_de_Alcal%C3%A1",{headers:{"Accept":"application/json"}}); lines.push(`1) REST media-list: HTTP ${r.status}`); const j=await r.json(); lines.push(`   ${(j.items||[]).length} itens; primeiro: ${(j.items&&j.items[0]&&j.items[0].title)||"—"}`); }catch(e){ lines.push(`1) REST media-list: ERRO ${e&&e.message||e}`); }
        try{ const r=await fetch("https://es.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=400&titles=Puerta%20de%20Alcal%C3%A1&format=json&origin=*"); lines.push(`2) API pageimages: HTTP ${r.status}`); const j=await r.json(); const pg=Object.values((j.query||{}).pages||{})[0]; lines.push(`   thumb: ${(pg&&pg.thumbnail&&pg.thumbnail.source)||"—"}`); }catch(e){ lines.push(`2) API pageimages: ERRO ${e&&e.message||e}`); }
        try{ await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(); im.onerror=()=>rej(new Error("imagem não carregou")); im.src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/PNG_transparency_demonstration_1.png/120px-PNG_transparency_demonstration_1.png"; }); lines.push("3) Imagem do upload.wikimedia.org: OK"); }catch(e){ lines.push("3) Imagem do upload.wikimedia.org: ERRO"); }
        for(const [city,title] of Object.entries(WP_CITY)){
          try{ delete WPCACHE[title]; const info=await wpSummary(title); let okU=null; const bad=[];
            for(const u of (info.srcs||[])){ const ok=await new Promise(res=>{ const im=new Image(); im.referrerPolicy="no-referrer"; im.onload=()=>res(true); im.onerror=()=>res(false); im.src=u; }); if(ok){ okU=u; break; } bad.push(u.split("/")[2]); }
            lines.push(`4) ${city} (${info.title}): ${okU ? "OK via "+okU.split("/")[2] : "ERRO em "+(bad.join(", ")||"nenhum endereço")}`);
          }catch(e){ lines.push(`4) ${city}: ERRO ${e&&e.message||e}`); }
        }
        lines.push(`Erros desta sessão: ${PHOTO_ERR.length ? PHOTO_ERR.slice(0,4).join(" · ") : "nenhum"}`);
        lines.push(`Versão ${APP_VERSION} · ${Date.now()-t0} ms`);
        out.innerHTML=lines.map(h).join("<br>"); out.className="verdict "+(lines.some(l=>/ERRO/.test(l))?"bad":"ok"); })();
      break; }
    case "checkupdate": { toast("Verificando…"); fetch("index.html",{cache:"no-store"}).then(r=>r.text()).then(t=>{ const m=t.match(/APP_VERSION = "([^"]+)"/); if(m && m[1]!==APP_VERSION){ toast(`Versão ${m[1]} disponível. Atualizando…`); if(navigator.serviceWorker && navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(reg=>reg&&reg.update()); setTimeout(()=>location.reload(), 1200); } else toast("Você já está na versão mais recente."); }).catch(()=>toast("Sem conexão para verificar.")); break; }
    case "extra": { const lg=logToday(); lg.x=(lg.x||0)+S.daily; save(); renderAll(); startSession(); break; }
    case "unlocknext": { if(curWeek()<TOTAL_WEEKS){ S.unlocked=Math.max(S.unlocked||1, curWeek()+1); const lg=logToday(); lg.x=(lg.x||0)+S.daily; save(); renderAll(); toast(`Semana ${curWeek()} liberada. ¡A por ella!`); startSession(); } else toast("Você já liberou todas as semanas. ¡Enhorabuena!"); break; }
    case "pronretry": { const it=D.items[D.i]; it.heard=null; drawDrill(); break; }
    case "goweek": e.preventDefault(); openWeek=+el.dataset.week; renderPlano(); showTab("plano"); break;
    case "toggleweek": { const n=+el.dataset.week; openWeek = openWeek===n ? -1 : n; renderPlano(); const nb=document.querySelector(`[data-act="toggleweek"][data-week="${n}"]`); if(nb) nb.scrollIntoView({block:"start",behavior:"smooth"}); break; }
    case "unlock": { const n=+el.dataset.week; S.unlocked=Math.max(S.unlocked||1,n); save(); renderAll(); toast(`Semana ${n} liberada no treino`); break; }
    case "chip": phraseFilter=el.dataset.k; renderFrases(); break;
    case "closedrill": closeDrill(); break;
    case "learned": { const c=D.items[D.i].c; if(!S.cards[c.id]){ S.cards[c.id]={b:0,d:todayN()}; logToday().n++; save(); } D.i++; drawDrill(); break; }
    case "reveal": { const it=D.items[D.i]; const first=!D.revealed; D.revealed=true;
      if(it.t==="mine"){ if(first && !it.heard){ logToday().s++; save(); } drawDrill(); speak(it.line[1]); }
      else { drawDrill(); if(it.dir==="pt") speak(it.c.es); } break; }
    case "grade": {
      const it=D.items[D.i], g=el.dataset.g;
      const wasNew = !S.cards[it.c.id];
      grade(it.c, g); tone(g==="bad"?"bad":"ok"); if(g!=="bad") buzz(15);
      const lg=logToday(); if(wasNew) lg.n++; else lg.r++; if(it.dir==="pt" && !it.heard) lg.s++;
      if(g==="bad"){ D.retries[it.c.id]=(D.retries[it.c.id]||0)+1; if(D.retries[it.c.id]<=2) D.items.push({t:"test",c:it.c,dir:it.dir==="pt"?"es":"pt"}); }
      save(); D.revealed=false; D.i++; drawDrill(); break; }
    case "pick": {
      const it=D.items[D.i]; if(it.picked!==null) break; it.picked=+el.dataset.k;
      const right = it.opts[it.picked]===it.c[it.field];
      if(D.mode==="duel"){ if(right) D.dscore[it.who.id]++; }
      else if(right) D.score++; else if(S.cards[it.c.id]) S.cards[it.c.id].d=todayN();
      const pm = right ? rnd(PRAISE) : rnd(CHEER); it.msg={ok:right, es:pm[0], pt:pm[1]}; tone(right?"ok":"bad"); if(right) buzz(15);
      if(D.mode!=="duel"){ logToday().q++; save(); } drawDrill(); if(it.dir==="pt") speak(it.c.es); else if(it.dir==="reply") speak(it.c.ans); break; }
    case "next": D.revealed=false; D.i++; drawDrill(); break;
    case "check": checkWrite(); break;
    case "acc": { const a=$("#ans"); if(a){ const s=a.selectionStart??a.value.length, en=a.selectionEnd??a.value.length; a.value=a.value.slice(0,s)+el.dataset.a+a.value.slice(en); a.focus(); a.setSelectionRange(s+1,s+1); } break; }
    case "settings": openSettings(); break;
    case "closesheet": $("#sheet").hidden=true; break;
    case "backup": shareBackup(); break;
    case "import": { const bk=parseBackup(($("#s-io")||{}).value); if(!bk){ toast("Não reconheci. Cole o link de backup inteiro."); break; }
      if(bk.legacy){ S=normalize(bk.legacy); save(); renderAll(); $("#sheet").hidden=true; toast("Progresso restaurado"); break; }
      if(restoreBackup(bk)){ $("#sheet").hidden=true; toast(`Progresso de ${me().name} restaurado. ¡Bienvenida de vuelta!`); } else toast("Esse backup está vazio ou é de outra versão."); break; }
    case "obrestore": { $("#sheet").hidden=true; openSettings(); setTimeout(()=>{ const ta=$("#s-io"); if(ta){ ta.focus(); ta.scrollIntoView({block:"center"}); } }, 100); break; }
    case "reset": { if(!resetArmed){ resetArmed=true; el.textContent="Toque de novo para confirmar"; break; } const keep={trip:S.trip,dest:S.dest,name:S.name,sound:S.sound}; S=Object.assign(defaults(),keep); save(); renderAll(); $("#sheet").hidden=true; openWeek=null; toast("Progresso apagado"); break; }
  }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.dataset && el.dataset.act==="varr"){ setArrival(el.value); saveProfiles(); renderViaje(); return; }
  if(el.dataset && el.dataset.act==="vdep"){ setDeparture(el.value); saveProfiles(); renderViaje(); return; }
  if(el.dataset && el.dataset.act==="vtrip"){ if(/^\d{4}-\d{2}-\d{2}$/.test(el.value)){ S.trip=el.value; save(); renderAll(); renderViaje(); } return; } if(el.dataset && el.dataset.act==="mission"){ S.missions[el.dataset.week] = el.checked; save(); if(el.checked){ const pm=rnd(PRAISE); toast(`Missão cumprida. ${pm[0]} +25 XP`); confetti(); tone("done"); } renderAll(); }
});
document.addEventListener("input", e=>{ if(e.target.id==="q"){ phraseQuery=e.target.value; renderPhraseList(); } if(e.target.id==="vq"){ const was=viajeQ.trim().length>=2; viajeQ=e.target.value; const is=viajeQ.trim().length>=2; if(was||is) renderViaje(); } });
$("#sheet").addEventListener("click", e=>{ if(e.target.id==="sheet") $("#sheet").hidden=true; });

/* início */
if(!S.updatedAt){ persistLocal(); }
renderAll();
connectRemote();
setTimeout(()=>{ if(!PR.onboarded && $("#sheet").hidden) openOnboarding(); }, 400);
(function(){ const m=location.hash.match(/bk=([A-Za-z0-9_-]+)/); if(m){ let bk=null; try{ bk=b64d(m[1]); }catch(e){} try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  if(bk && bk.v===2){ const names=(bk.list||[]).filter(x=>!x.remote).map(x=>x.name).join(", "); const el=$("#sheet");
    el.innerHTML=`<div class="sheet" role="dialog"><h2 style="font-size:22px">Restaurar backup?</h2><p>Encontrei um backup de <b>${h(names)}</b> feito ${h(agoText(bk.t||Date.now()))}. Restaurar substitui o que está neste aparelho agora.</p><button class="btn wide" id="bk-yes">Restaurar</button><button class="btn ghost wide" data-act="closesheet">Agora não</button></div>`;
    el.hidden=false; $("#bk-yes").onclick=()=>{ if(restoreBackup(bk)){ el.hidden=true; toast(`Pronto, ${me().name}. Tudo de volta!`); confetti(); } else toast("Não consegui restaurar esse backup."); };
  } else toast("Esse link de backup não é válido."); return; }
  const d=parseInvite(location.hash); if(d && receiveScore(d)){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} renderAll(); setTimeout(()=>{ toast(`Placar de ${d.name} recebido. Agora mande o seu!`); if(PR.onboarded) openPasajeros(); }, 600); } })();
/* Atualização automática: quando sai versão nova, o app baixa e recarrega sozinho (fora de um treino). */
const APP_VERSION = "2026.10.24-1239";
let pendingReload = false;
function maybeReload(){ if(!pendingReload) return; if(D || !$("#drill").hidden){ return; } pendingReload=false; toast("Atualizando o app…"); setTimeout(()=>location.reload(), 600); }
if("serviceWorker" in navigator && !window.claude && location.protocol==="https:"){
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg=>{
    const check = () => { try{ reg.update(); }catch(e){} };
    document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") check(); });
    window.addEventListener("focus", check);
    setInterval(check, 30*60*1000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(!hadController){ hadController=true; return; } pendingReload=true; maybeReload(); });
}
</script>
<!-- APP END -->
