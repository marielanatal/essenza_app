<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rumbo mudou de endereço</title>
<style>body{font-family:-apple-system,Segoe UI,system-ui,sans-serif;background:#faf5ee;color:#151b2e;margin:0;padding:32px 20px;line-height:1.5}a,button{color:#2443a6;font-weight:700}.box{max-width:480px;margin:0 auto;background:#fff;border:1px solid #e5dcd0;border-radius:16px;padding:20px}button{font:inherit;background:#2443a6;color:#fff;border:0;border-radius:12px;padding:12px 16px;width:100%;margin-top:12px}</style>
<script>
const NEW="https://marielanatal.github.io/cursodeidiomas/";
function pack(){ const d={}; let n=0; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(/^rumbo-/.test(k) && !/^rumbo-(wp2|auto)$/.test(k)){ d[k]=localStorage.getItem(k); n++; } } }catch(e){} if(!n) return ""; const b=btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); return "#mig="+b; }
function go(){ const h = location.hash && /bk=|inv=/.test(location.hash) ? location.hash : pack(); location.href = NEW + h; }
try{ if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); }catch(e){}
try{ caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }catch(e){}
window.addEventListener("load", ()=>{ const n=(()=>{ try{ let c=0; for(let i=0;i<localStorage.length;i++){ if(/^rumbo-(profiles|espana)/.test(localStorage.key(i))) c++; } return c; }catch(e){ return 0; } })(); document.getElementById("st").textContent = n ? "Encontrei seu progresso aqui; vou levá-lo junto." : "Não há progresso guardado neste endereço."; setTimeout(go, 1500); });
</script></head>
<body><div class="box"><h2>O Rumbo mudou de endereço</h2><p>O app agora fica em <a href="https://marielanatal.github.io/cursodeidiomas/">marielanatal.github.io/cursodeidiomas</a>.</p><p id="st">Verificando seu progresso…</p><button onclick="go()">Ir para o app novo com meu progresso</button><p style="font-size:14px;color:#586179;margin-top:14px">Depois, adicione o endereço novo à tela de início e apague este ícone.</p></div></body></html>
