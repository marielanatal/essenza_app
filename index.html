<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumbo a España">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<!-- APP START -->
<title>Rumbo a España</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: uma coluna de bolso (max 560px), painel de "salidas" no topo, abas fixas embaixo. */
:root{
  --paper:#f4f5f9; --surface:#ffffff; --ink:#151b2e; --muted:#586179; --line:#dde1eb;
  --cobalt:#2443a6; --cobalt-soft:#e5eaf9; --on-cobalt:#ffffff;
  --saffron:#d9920f; --saffron-soft:#fbefd4; --on-saffron:#1d1608;
  --ok:#1d7448; --ok-soft:#dcf2e5; --bad:#b0302a; --bad-soft:#f8e0de;
  --board:#1b2f80; --board-fg:#f6c453; --board-dim:#8c93a8; --board-cell:#222a42;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0c111e; --surface:#151c2e; --ink:#e6eaf4; --muted:#9aa3b9; --line:#262f47;
  --cobalt:#8ea7ff; --cobalt-soft:#1c2750; --on-cobalt:#0c111e;
  --saffron:#f2bb4b; --saffron-soft:#372c13; --on-saffron:#1d1608;
  --ok:#62d29d; --ok-soft:#14332a; --bad:#ff8c82; --bad-soft:#3b1c1b;
  --board:#1b2f80; --board-fg:#f6c453; --board-dim:#7d859b; --board-cell:#131a2b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c111e; --surface:#151c2e; --ink:#e6eaf4; --muted:#9aa3b9; --line:#262f47;
  --cobalt:#8ea7ff; --cobalt-soft:#1c2750; --on-cobalt:#0c111e;
  --saffron:#f2bb4b; --saffron-soft:#372c13; --on-saffron:#1d1608;
  --ok:#62d29d; --ok-soft:#14332a; --bad:#ff8c82; --bad-soft:#3b1c1b;
  --board:#1b2f80; --board-fg:#f6c453; --board-dim:#7d859b; --board-cell:#131a2b;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 112px}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Painel de partidas */
.board{background:linear-gradient(140deg,#1b2f80 0%,#2443a6 55%,#3b57c4 100%);color:#fff;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.board::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.brand{display:inline-flex;align-items:center;gap:8px;flex:none}
.brand span{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.01em;color:#fff}
.brand svg{width:28px;height:28px;border-radius:7px}
.pax{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:99px;height:32px;padding:0 12px;font-family:var(--f-body);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.pax i{width:8px;height:8px;border-radius:50%;background:#62d29d;display:inline-block;flex:none}
.gear{background:transparent;border:0;color:rgba(255,255,255,.85);border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.gear svg{width:20px;height:20px}
.count{display:flex;align-items:center;gap:12px;margin-top:10px;position:relative}
.count b{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.count .lbl{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.25;color:rgba(255,255,255,.85);min-width:0}
.count .lbl strong{color:#fff;font-family:var(--f-display);font-weight:700}
.count .lbl span:last-child{font-size:12px;color:rgba(255,255,255,.7)}
.sync{display:none}

/* Seções */
main{padding-top:18px}
section.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:22px;padding:18px}
.card.tint-c{background:var(--cobalt-soft)}
.card.tint-s{background:var(--saffron-soft)}
.card.tint-g{background:var(--ok-soft)}
.card.plain{background:transparent;padding:4px 2px}
button.card{border:0;font:inherit;color:inherit}
.hero-week{background:linear-gradient(140deg,#2443a6 0%,#3550bd 60%,#4a63cc 100%);color:#fff;border-radius:26px;position:relative;overflow:hidden}
.hero-week::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-week>*{position:relative}
.hero-week h2{font-size:28px;font-weight:800;color:#fff}
.hero-week .sub{color:rgba(255,255,255,.78);margin-top:4px}
.hero-week .eyebrow{color:rgba(255,255,255,.7)}
.hero-week .muted{color:rgba(255,255,255,.8)}
.hero-week .meter{background:rgba(255,255,255,.22)}
.hero-week .meter>span{background:#f6c453}
.hero-week .btn{background:#f6c453;color:#1d1608}
.hero-week .btn.saff{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.hero-week .verdict.ok{background:rgba(255,255,255,.14);color:#fff}
.wicon{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;margin-bottom:10px}
.wicon svg{width:24px;height:24px}
.meter{height:8px;border-radius:99px;background:var(--cobalt-soft);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--cobalt);border-radius:99px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--cobalt);color:var(--on-cobalt);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--cobalt);border:1.5px solid var(--cobalt)}
.btn.soft{background:var(--cobalt-soft);color:var(--cobalt)}
.btn.saff{background:var(--saffron);color:var(--on-saffron)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.btn .ct{font-family:var(--f-mono);font-weight:500;font-size:13px;opacity:.85}
.btn.two{flex-direction:column;gap:2px;padding-block:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 4px}
.stat{text-align:center;padding:6px 2px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--cobalt);line-height:1.1}
.stat span{font-size:12px;color:var(--muted);line-height:1.2;display:block}
.days{display:flex;gap:6px;margin-top:10px}
.day{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.day i{display:block;height:10px;width:10px;border-radius:50%;background:var(--line);margin:0 auto 6px}
.day.on i{background:var(--saffron);box-shadow:0 0 0 4px var(--saffron-soft)}
.day.today{color:var(--ink);font-weight:700}

.phrase{display:flex;gap:12px;align-items:flex-start}
.phrase .txt{flex:1;min-width:0}
.es{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.25}
.pt{color:var(--muted)}
.note{font-size:14px;margin-top:6px;background:var(--saffron-soft);border-radius:8px;padding:6px 10px;color:var(--ink)}
.say{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center}
.say svg{width:20px;height:20px}
.say.lg{width:56px;height:56px}
.say.lg svg{width:26px;height:26px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:0;border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tile b{font-family:var(--f-display);font-size:17px}
.tile span{font-size:13px;color:var(--muted);line-height:1.35}
.tile .ic{width:38px;height:38px;border-radius:50%;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center;margin-bottom:4px}
.tile .ic svg{width:20px;height:20px}
.tile.t-s{background:var(--saffron-soft)} .tile.t-s .ic{background:var(--saffron);color:var(--on-saffron)}
.tile.t-c{background:var(--cobalt-soft)} .tile.t-c .ic{background:var(--cobalt);color:var(--on-cobalt)}
.tile.t-g{background:var(--ok-soft)} .tile.t-g .ic{background:var(--ok);color:#fff}
.tile.t-r{background:var(--bad-soft)} .tile.t-r .ic{background:var(--bad);color:#fff}

/* Lola, níveis e conquistas */
.lola{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}
.av{width:56px;height:56px;border-radius:50%;background:var(--saffron-soft);display:grid;place-items:center;overflow:hidden;flex:none}
.av svg{width:100%;height:100%}
.bubble{background:var(--surface);border:0;border-radius:6px 22px 22px 22px;padding:14px 16px;text-align:left;width:100%;min-width:0}
.bubble .name{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--saffron);font-weight:700;margin-bottom:2px}
.bubble .es{font-size:18px}
.bubble .pt{font-size:14px;margin-top:2px}
.level .ttl{font-family:var(--f-display);font-size:19px;font-weight:600}
.level .meter>span{background:var(--saffron)}
.badges{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.badge{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.badge .ic{width:52px;height:52px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--muted)}
.badge.on .ic{background:var(--saffron);color:var(--on-saffron);box-shadow:0 0 0 4px var(--saffron-soft)}
.badge.on{color:var(--ink)}
.badge b{font-size:11px;line-height:1.2;font-weight:700}
.badge span{display:none}
.fact{font-size:15px}
.fact b{color:var(--cobalt)}
.flame{color:var(--saffron)}
@media (prefers-reduced-motion: no-preference){
  .badge.on .ic{animation:pop .4s ease-out}
  .av.cheer svg{animation:wiggle .7s ease-in-out}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
}

/* Plano */
.week{background:var(--surface);border-radius:22px;overflow:hidden}
.week>button.head{width:100%;background:none;border:0;text-align:left;padding:14px 16px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.wnum{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--muted)}
.wnum svg{width:22px;height:22px}
.week.now .wnum{background:var(--cobalt);color:var(--on-cobalt)}
.week.done .wnum{background:var(--ok);color:#fff}
.week.soon .wnum{opacity:.7}
.wtitle{font-family:var(--f-display);font-weight:600;font-size:17px}
.wdates{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pill.now{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.soon{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.wbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:16px;padding-top:6px}
.tip{background:var(--paper);border-radius:16px;padding:14px}
.tip h3{font-size:16px;margin-bottom:6px}
.tip p,.tip li{font-size:15px}
.tip ul{margin:6px 0 0;padding-left:18px}
.tip table{border-collapse:collapse;font-size:14px;margin-top:6px}
.tip td{padding:3px 12px 3px 0;border-bottom:1px solid var(--line)}
.tip td:first-child{color:var(--muted)}
.tblwrap{overflow-x:auto}
.mission{display:flex;gap:12px;align-items:flex-start;background:var(--saffron-soft);border-radius:12px;padding:12px}
.mission input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--saffron);flex:none}
.mission label{font-size:15px}
.dlg{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.r{align-self:flex-end;flex-direction:row-reverse}
.msg .bub{background:var(--paper);border-radius:18px 18px 18px 6px;padding:10px 12px;min-width:0}
.msg.r .bub{background:var(--cobalt-soft);border-radius:18px 18px 6px 18px}
.msg .bub .es{font-size:16px}
.msg .bub .pt{font-size:13px;margin-top:2px}
.msg .say{width:34px;height:34px;flex:none}
.msg .say svg{width:16px;height:16px}
.msg .who{font-size:11px;color:var(--muted);margin-bottom:2px;font-weight:700;letter-spacing:.06em}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:none;border:0;text-align:left;padding:8px 10px;border-radius:10px}
.line:hover{background:var(--paper)}
.who{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--cobalt);padding-top:3px;min-width:22px}
.line .es{font-size:16px}
.line .pt{font-size:14px}
.list{display:flex;flex-direction:column}
.list .phrase{padding:10px 0}
.list .phrase+.phrase{border-top:1px solid var(--line)}
.list .es{font-size:17px}

/* Frases */
.search{width:100%;border:0;background:var(--surface);border-radius:16px;padding:14px 16px;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);border-radius:99px;padding:9px 14px;font-size:14px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.group h3{font-size:15px;color:var(--muted);font-family:var(--f-body);font-weight:700;letter-spacing:.04em;margin:6px 0 2px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);margin-right:6px}

.illus{display:block;width:100%;height:auto;max-width:100%}
.photo{position:relative;margin:0;border-radius:20px;overflow:hidden;background:var(--cobalt-soft);aspect-ratio:16/9;max-width:100%;width:100%}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--cobalt);opacity:.5}
.photo .ph svg{width:36px;height:36px}
.photo figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));display:flex;justify-content:space-between;gap:8px}
.photo figcaption a{color:#fff;opacity:.85;text-decoration:none}
.photo figcaption b{font-family:var(--f-display);font-size:14px;font-weight:600}
.photo.banner{aspect-ratio:2/1}
.photo.sq{aspect-ratio:1;border-radius:12px;width:64px;flex:none}
.photo.sq figcaption{display:none}
.item.with-thumb{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.item.with-thumb>div:not(.photo){min-width:0}
@media (prefers-reduced-motion: no-preference){ .photo img{animation:fadein .4s ease-out} @keyframes fadein{from{opacity:0}to{opacity:1}} }
.hero-art{display:grid;grid-template-columns:1fr 128px;gap:10px;align-items:center}
.hero-art .illus{width:128px;filter:drop-shadow(0 6px 12px rgba(0,0,0,.18))}
.plan-art{margin:-6px 0 4px;background:var(--paper);border-radius:16px;padding:6px 20px}
.plan-art .illus{max-height:110px;margin:0 auto}
.postcard{border-radius:18px;overflow:hidden;background:var(--paper)}
.postcard .illus{display:block}
.links{display:flex;flex-direction:column;gap:6px}
.lnk{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;background:var(--surface);border-radius:12px;padding:8px 10px;text-decoration:none;color:var(--ink)}
.lnk .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.lnk .ic.video{background:${"#d9372b"}} .lnk .ic.podcast{background:var(--cobalt)} .lnk .ic.site{background:var(--ok)}
.lnk b{font-size:14px;display:block;line-height:1.25}
.lnk span.k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lnk .go{color:var(--cobalt);font-weight:700}
.res{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;padding:10px 0}
.res+.res{border-top:1px solid var(--line)}
.res .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.res .ic.video{background:${"#d9372b"}} .res .ic.podcast{background:var(--cobalt)} .res .ic.site{background:var(--ok)}
.res a{font-family:var(--f-display);font-weight:600;color:var(--ink);text-decoration:none}
.res a::after{content:" ↗";color:var(--cobalt);font-size:12px}
.res p{font-size:14px;color:var(--muted)}

/* Rotina de hoje */
.steps{display:flex;flex-direction:column;gap:0;background:var(--surface);border-radius:26px;padding:6px 0;overflow:hidden}
.step{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px 16px;position:relative}
.step+.step::before{content:"";position:absolute;left:37px;top:-14px;height:14px;width:2px;background:var(--line)}
.step .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--paper);color:var(--muted)}
.step.cur .n{background:var(--cobalt);color:var(--on-cobalt);box-shadow:0 0 0 5px var(--cobalt-soft)}
.step.done .n{background:var(--ok);color:#fff}
.step.done .n svg{width:20px;height:20px}
.step b{font-family:var(--f-display);font-size:17px;display:block}
.step .d{font-size:13px;color:var(--muted)}
.step.todo{opacity:.6}
.step .go{border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--cobalt);color:var(--on-cobalt);min-height:42px;white-space:nowrap}
.step.done .go{background:transparent;color:var(--ok);padding:0;min-height:0}
.step.todo .go{background:var(--paper);color:var(--muted)}
.stepfoot{padding:8px 16px 12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.todayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 4px}
.todayhead h2{font-size:26px}
.todayhead .wk{font-size:13px;color:var(--muted);text-align:right}
.todayhead .wk a{color:var(--cobalt);font-weight:700;text-decoration:none}
.alldone{background:linear-gradient(140deg,var(--ok) 0%,#2a9a63 100%);color:#fff;border-radius:26px;padding:22px 18px;display:flex;gap:14px;align-items:center}
.alldone .big{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.alldone p{opacity:.9;font-size:14px;margin-top:4px}
.prog{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:0;border-radius:22px;padding:14px 16px;width:100%;text-align:left;font:inherit;color:inherit}
.prog .nums{display:flex;gap:16px}
.prog .nums b{font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--cobalt);display:block;line-height:1}
.prog .nums span{font-size:11px;color:var(--muted)}
.prog .lv{font-size:13px;color:var(--muted);margin-top:8px}
.prog .lv .meter{margin-top:4px;height:6px}
.prog .lv .meter>span{background:var(--saffron)}
.prog .chev{color:var(--muted);font-size:22px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini .card{padding:14px}
.mini .es{font-size:17px}
.onb{display:flex;flex-direction:column;gap:14px}
.onb .pt-step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.onb .pt-step .n{width:40px;height:40px;border-radius:50%;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.onb .pt-step b{display:block;font-family:var(--f-display);font-size:16px}
.onb .pt-step span{font-size:14px;color:var(--muted)}

/* Viaje */
.bk{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.bk i{width:7px;height:7px;border-radius:50%;display:inline-block;background:currentColor}
.bk.g{background:var(--ok-soft);color:var(--ok)} .bk.h{background:var(--cobalt-soft);color:var(--cobalt)} .bk.d{background:var(--saffron-soft);color:#8a5a00} .bk.s{background:var(--bad-soft);color:var(--bad)}
:root[data-theme="dark"] .bk.d{color:var(--saffron)} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bk.d{color:var(--saffron)}}
.dchip{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:0;border-radius:18px;padding:12px 12px;background:var(--surface);text-align:left;flex:1;min-width:0}
.dchip>span:last-child{min-width:0;max-width:100%}
.dchip.on{background:var(--cobalt);color:var(--on-cobalt)}
.dchip .em{font-size:22px}
.dchip b{font-family:var(--f-display);font-size:15px;display:block;line-height:1.1}
.dchip span span{font-size:11px;opacity:.75;display:block;margin-top:2px}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border-radius:99px;padding:3px}
.stepper button{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);font-weight:800;font-size:18px}
.stepper b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.ichip{border:0;border-radius:99px;padding:9px 13px;font-size:14px;font-weight:700;background:var(--surface);color:var(--muted)}
.ichip.on{background:var(--saffron);color:var(--on-saffron)}
details.sec{background:var(--surface);border-radius:20px;padding:0 16px}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 0;font-family:var(--f-display);font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-weight:400;font-size:22px;color:var(--muted)}
details.sec[open]>summary::after{content:"–"}
details.sec>.in{padding:0 0 16px;display:flex;flex-direction:column;gap:12px}
.item{display:flex;flex-direction:column;gap:4px;padding:10px 0}
.item+.item{border-top:1px solid var(--line)}
.item .hd{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.item .hd a{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--ink);text-decoration:none}
.item .hd .meta2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .hd a::after{content:" ↗";color:var(--cobalt);font-size:13px}
.item .meta{font-size:13px;color:var(--muted)}
.item .tip{background:transparent;padding:0;font-size:14px}
.dayc{background:var(--surface);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.dayc h3{font-size:18px}
.blk{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start}
.blk .sl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding-top:3px}
.blk .sl.m{color:var(--saffron)} .blk .sl.n{color:var(--cobalt)}
.blk a{font-weight:700;color:var(--ink);text-decoration:none}
.blk a::after{content:" ↗";color:var(--cobalt);font-size:12px}
.blk .meta{font-size:13px;color:var(--muted);margin-top:2px}
.leg{background:var(--cobalt-soft);border-radius:18px;padding:12px 16px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.leg a{color:var(--cobalt);font-weight:700;text-decoration:none;margin-right:10px}
.verd{background:var(--saffron-soft);border-radius:16px;padding:12px 14px;font-size:15px}
.curio{font-size:15px;padding:8px 0}
.curio+.curio{border-top:1px solid var(--line)}
.curio b{color:var(--cobalt)}
nav.tabs .in{grid-template-columns:repeat(5,1fr)}
nav.tabs button{font-size:11px}

/* Abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{background:none;border:0;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs svg{width:24px;height:24px}
nav.tabs button.on{color:var(--cobalt);background:var(--cobalt-soft)}

/* Treino (tela cheia) */
.drill{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.drill .top{display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto}
.x{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.x svg{width:20px;height:20px}
.drill .meter{flex:1}
.drill .count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{flex:1;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:18px 0;overflow-y:auto}
.flash{background:var(--surface);border:0;border-radius:26px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.flash .kind{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--saffron)}
.flash .big{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.15;text-wrap:balance}
.flash .big.pt{color:var(--ink);font-weight:600}
.flash hr{width:100%;border:0;border-top:1px dashed var(--line);margin:0}
.flash .ans{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.25}
.flash .note{text-align:left;width:100%}
.actions{max-width:560px;width:100%;margin:0 auto;display:grid;gap:10px}
.actions.three{grid-template-columns:1fr 1fr 1fr}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid transparent;background:var(--surface);border-radius:16px;padding:14px;text-align:left;font-size:17px;min-height:54px}
.opt svg{width:18px;height:18px;vertical-align:-3px;color:var(--cobalt);margin-right:8px}
.actions.duo{grid-template-columns:1fr 1.4fr}
.slowbtn{min-height:42px;border-radius:99px;padding:8px 14px;border:0;background:var(--cobalt-soft);color:var(--cobalt);font-weight:700;font-size:14px}
.say.lg+.slowbtn{min-height:56px}
.ctx{font-size:14px;color:var(--muted);text-align:left;width:100%;border-left:3px solid var(--line);padding-left:10px}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:20px;font-family:var(--f-display)}
.accents{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.accents button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.marks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wm{padding:4px 10px;border-radius:99px;font-family:var(--f-display);font-weight:600;font-size:18px}
.wm.ok{background:var(--ok-soft);color:var(--ok)} .wm.bad{background:var(--bad-soft);color:var(--bad);text-decoration:underline dotted}
.tries{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.verdict{border-radius:12px;padding:12px 14px;font-weight:700;text-align:left;width:100%}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.mid{background:var(--saffron-soft);color:var(--ink)}
.done-box{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done-box .big{font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--cobalt)}

/* Ajustes */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(5,8,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.field textarea{min-height:90px;font-family:var(--f-mono);font-size:12px}
.field input[type=range]{padding:0;accent-color:var(--cobalt)}
.hint{font-size:13px;color:var(--muted)}
.w{cursor:pointer;border-radius:4px;transition:background .12s}
.w:active,.w.hit{background:var(--saffron-soft);box-shadow:0 0 0 2px var(--saffron-soft)}
.dic{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:80;width:min(100% - 24px,520px);background:var(--ink);color:var(--paper);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dic.hi{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dic .dw{font-family:var(--f-display);font-weight:800;font-size:24px;display:flex;align-items:center;gap:10px}
.dic .dw .say{background:rgba(255,255,255,.15);color:var(--paper);width:36px;height:36px}
.dic .dw .say svg{width:18px;height:18px}
.dic .dpt{font-size:18px}
.dic .dnote{font-size:13px;opacity:.75}
.dic .drow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.dic .drow a,.dic .drow button{font-size:13px;font-weight:700;border-radius:99px;padding:7px 12px;background:rgba(255,255,255,.14);color:var(--paper);border:0;text-decoration:none;min-height:34px;display:inline-flex;align-items:center}
.dic .dx{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:var(--paper);display:grid;place-items:center}
.dic .dx svg{width:16px;height:16px}
.dichint{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){
  .flash,.opt,.verdict{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>

<script type="text/plain" id="dict">
# Dicionário ES→PT do app. Uma entrada por linha: palavra=tradução
# Verbos: infinitivo=tradução|forma1,forma2,...  (cada forma aponta para o infinitivo)
# Linhas com # são comentários.

## Verbos
ser=ser|soy,eres,es,somos,sois,son,era,eras,éramos,eran,fui,fuiste,fue,fuimos,fueron,sido,sea,seas,sean,siendo

ir=ir|voy,vas,va,vamos,vais,van,iba,iban,ido,ve,vaya,vayan,yendo
hacer=fazer|hago,haces,hace,hacemos,hacéis,hacen,hacía,hice,hiciste,hizo,hicimos,hecho,hecha,haz,haga,hagan
poder=poder|puedo,puedes,puede,podemos,podéis,pueden,podía,pude,pudo,podido,pueda,puedas,puedan
querer=querer|quiero,quieres,quiere,queremos,queréis,quieren,quería,quise,quiso,querido,quisiera,quiera
decir=dizer|digo,dices,dice,decimos,decís,dicen,decía,dije,dijo,dicho,di,diga,digan,diciendo
ver=ver|veo,ves,vemos,veis,ven,veía,vi,vio,visto,vea,viendo
dar=dar|doy,das,da,damos,dais,dan,daba,dio,dado,dé,den,dame,deme
saber=saber|sé,sabes,sabe,sabemos,sabéis,saben,sabía,supe,supo,sabido,sepa,sepas
conocer=conhecer|conozco,conoces,conoce,conocemos,conocéis,conocen,conocí,conoció,conocido,conozca
venir=vir|vengo,vienes,viene,venimos,venís,vienen,venía,vine,vinimos,venido,venga,vengan
salir=sair|salgo,sales,sale,salimos,salís,salen,salí,salió,salido,sal,salga
poner=pôr, colocar; servir (no bar)|pongo,pones,pone,ponemos,ponéis,ponen,puse,puso,puesto,pon,ponga,ponme
seguir=seguir, continuar|sigo,sigues,sigue,seguimos,seguís,siguen,seguí,siguió,seguido,siga,sigan
pedir=pedir|pido,pides,pide,pedimos,pedís,piden,pedí,pidió,pedido,pida

{ n:1, me:"B", title:"Hola, ¿qué tal?", sub:"Saudações, apresentação e pronúncia",
  tip:`<h3>Pronúncia: o que muda para quem fala português</h3>
  <ul>
   <li><b>j</b> e <b>g</b> antes de e/i soam como um "rr" forte, raspado na garganta: <i>jamón, gente</i>.</li>
   <li><b>ll</b> e <b>y</b> soam como "i" (não como "lh"): <i>calle</i> ≈ "cái-e".</li>
   <li><b>z</b> e <b>c</b> antes de e/i: na Espanha soam como o "th" do inglês <i>think</i>: <i>gracias</i> ≈ "grá-thias".</li>
   <li><b>ñ</b> = nh. O <b>h</b> é mudo. <b>v</b> soa como <b>b</b>.</li>
   <li>Não existe vogal nasal: <i>bien</i> é "bi-én", não "biẽ". O "o" e o "e" finais não viram "u" e "i": <i>noche</i> ≠ "nóchi".</li>
  </ul>
  <p style="margin-top:8px"><b>Tú ou usted?</b> Na Espanha o <i>tú</i> é usado quase sempre, até com desconhecidos da sua idade. Use <i>usted</i> com pessoas mais velhas ou em situações formais.</p>`,

{ n:2, me:"A", title:"Aeropuerto y estación", sub:"Chegar, pedir ajuda e pegar o trem",
  tip:`<h3>Pedir ajuda com educação: o "usted"</h3>
  <p>No aeroporto, na estação e com funcionários, use <b>usted</b> (o senhor / a senhora). O verbo fica na 3ª pessoa:</p>
  <ul><li><i>Perdone, ¿<b>me puede</b> ayudar?</i> (e não "puedes")</li><li><i>¿<b>Habla</b> inglés?</i></li><li><i>¿<b>Me lo puede</b> escribir?</i></li></ul>
  <p style="margin-top:8px"><b>IR</b> (ir): <i>voy, vas, va, vamos, vais, van</i>. <i>a + el = al</i>: <i>Voy al centro.</i></p>
  <p style="margin-top:6px"><b>Coger</b> = pegar um transporte. Na Espanha é a palavra normal: <i>¿Dónde cojo el tren?</i></p>
  <p style="margin-top:6px">Em Madri, o trem do aeroporto ao centro é o <b>Cercanías</b> (T4) ou o <b>metro</b> (linha 8). Em Barcelona, o <b>Aerobús</b> ou o trem R2.</p>`,
  mission:"Abra o site do aeroporto onde você vai chegar (aena.es) em espanhol e descubra: como se diz 'retirada de bagagem', 'saída' e 'trem' nas placas. Diga em voz alta o caminho até o centro.",

{ n:3, title:"En la cafetería", sub:"Café, tapas e o bar de esquina",
  tip:`<h3>Artigos e gênero</h3>

{ n:6, title:"Números, horas y precios", sub:"Contar, pagar e saber que horas são",

{ n:8, title:"De compras", sub:"Roupas, tamanhos e as 'rebajas'",
  tip:`<h3>Este, ese, aquel e o pronome LO</h3>

{ n:9, title:"Verbos para todo", sub:"Os verbos que resolvem a viagem",

{ n:10, title:"El tiempo y el calendario", sub:"Clima de inverno, dias e datas",
  tip:`<h3>Falar do tempo: HACER</h3>

  <p style="margin-top:6px">Datas: <i>el 14 de febrero</i>. "No sábado" = <i>el sábado</i> (sem "en").</p>`,

const WP_BAD=/escudo|bandera|flag|coat|mapa|map_|_map|locat|situaci|logo|plano|diagram|icon|se[ñn]al|wikidata|commons-logo|placa/i;
async function wpJson(url){ let res; try{ res=await fetch(url,{headers:{"Accept":"application/json"}}); }catch(e){ throw new Error("rede: "+(e&&e.message||e)); } if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); }
async function wpSummary(title){
  if(WPCACHE[title] && WPCACHE[title].srcs && WPCACHE[title].t > Date.now()-30*864e5) return WPCACHE[title];
  const enc=t=>encodeURIComponent(t.replace(/ /g,"_"));
  let t=title, ml=null;
  try{ ml=await wpJson("https://es.wikipedia.org/api/rest_v1/page/media-list/"+enc(t)); }catch(e){}
  if(!ml || !(ml.items||[]).length){
    const sr=await wpJson("https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(title.replace(/_/g," "))+"&srlimit=1&format=json&origin=*");
    const hit=sr && sr.query && sr.query.search && sr.query.search[0]; if(!hit) throw new Error("no article");
    t=hit.title; ml=await wpJson("https://es.wikipedia.org/api/rest_v1/page/media-list/"+enc(t));
  }
  const pics=(ml.items||[]).filter(i=>i.type==="image" && i.showInGallery!==false && /\.jpe?g$/i.test(i.title||"") && !WP_BAD.test(i.title||""));
  const srcs=[];
  const abs=u=>u.startsWith("//")?"https:"+u:u;
  pics.slice(0,3).forEach(it=>{
    const file=(it.title||"").replace(/^[^:]+:/,"");
    if(file) srcs.push("https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(file)+"?width=800");
    const s0=(it.srcset && it.srcset[0] && it.srcset[0].src) || (it.original && it.original.source) || "";
    if(s0){ const a=abs(s0); srcs.push(a.replace(/\/\d+px-/, "/800px-").replace(/([?&])width=\d+/, "$1width=800"), a); }
  });
  if(!srcs.length){
    const pi=await wpJson("https://es.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=800&titles="+encodeURIComponent(t.replace(/_/g," "))+"&format=json&origin=*");
    const pg=pi && pi.query && pi.query.pages && Object.values(pi.query.pages)[0];
    const ps=(pg && pg.thumbnail && pg.thumbnail.source) || ""; if(!ps) throw new Error("no photo"); srcs.push(abs(ps));
  }
  const out={t:Date.now(), src:srcs[0], srcs:[...new Set(srcs)], title:t.replace(/_/g," "), url:"https://es.wikipedia.org/wiki/"+enc(t)};
  WPCACHE[title]=out; wpSave(); return out;
}
function loadPhotos(){
  if(!PHOTOS_ON) return;
  document.querySelectorAll(".photo[data-wp]:not([data-done])").forEach(async fig=>{
    fig.dataset.done="1"; const title=fig.dataset.wp;
    try{
      const info = await wpSummary(title);
      const list = (info.srcs && info.srcs.length) ? info.srcs : (info.src ? [info.src] : []);
      if(!list.length) throw new Error("no src");
      let k=0;
      const tryNext=()=>{
        if(k>=list.length){ fig.hidden=true; PHOTO_ERR.push(`${title}: imagem não carregou (${list.length} endereços)`); return; }
        const u=list[k++]; const img=new Image(); img.alt=fig.dataset.label||info.title; img.decoding="async"; img.referrerPolicy="no-referrer";
        img.onload=()=>{ fig.appendChild(img); const cap=document.createElement("figcaption"); cap.innerHTML = `<b>${h(fig.dataset.label||"")}</b><a href="${h(info.url)}" target="_blank" rel="noopener">Foto: Wikipedia ↗</a>`; fig.appendChild(cap); };
        img.onerror=()=>{ PHOTO_ERR.push(`${title}: falhou ${u.split("/")[2]}`); tryNext(); };
        img.src=u;
      };
      tryNext();
    }catch(e){ fig.hidden=true; PHOTO_ERR.push(`${title}: ${e && e.message || e}`); }
  });
}

/* Monta o roteiro de um destino, dado o número de dias e os interesses */
function buildPlan(id, days, interests, ritmo){
  const d = DEST[id]; if(!d) return [];
  const score = x => (x.tags||[]).reduce((s,t)=>s+(interests.includes(t)?1:0),0);
  const used = new Set();
  const pick = alts => { const names=alts.split("|"); let best=null, bs=-1; names.forEach(n=>{ const m=d.must.find(x=>x.t===n); if(!m||used.has(n)) return; const sc=score(m)*10 + (m.book==="s"?1:0); if(sc>bs){ bs=sc; best=m; } }); if(best) used.add(best.t); return best; };
  const out=[];
  const cityDays = Math.min(days, d.cityMax||d.days.length);
  const trips = days - cityDays;
  for(let i=0;i<cityDays;i++){
    let blocks = d.days[i].map(([slot,alts])=>({slot, m:pick(alts)})).filter(b=>b.m);
    if(ritmo==="tranquilo" && blocks.length>3) blocks = blocks.filter((b,k)=> b.slot!=="t" || k===blocks.findIndex(x=>x.slot==="t"));
    out.push({kind:"city", title:`${d.name}, dia ${i+1}`, blocks});
  }
  // bate-voltas pelos interesses, sem repetir
  const tripsSorted = d.daytrips.filter(t=>!/pernoite/i.test(t.t)).map(t=>({t, sc:score(t)})).sort((a,b)=>b.sc-a.sc);
  for(let j=0;j<trips;j++){ const tr=tripsSorted[j]; if(!tr) break; out.push({kind:"trip", title:`${d.name}, dia ${cityDays+j+1}: bate-volta a ${tr.t.t}`, trip:tr.t}); }
  return out;
}

const DICT = {};            // palavra → {pt, lemma}
const DICTN = {};           // sem acento → palavra
const strip = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
(function buildDict(){
  const src = (document.getElementById("dict")||{}).textContent || "";
  src.split("\n").forEach(line=>{
    line=line.trim(); if(!line || line[0]==="#") return;
    const eq=line.indexOf("="); if(eq<0) return;
    const w=line.slice(0,eq).trim().toLowerCase(); let rest=line.slice(eq+1);
    let forms=[]; const bar=rest.indexOf("|"); if(bar>=0){ forms=rest.slice(bar+1).split(",").map(x=>x.trim().toLowerCase()).filter(Boolean); rest=rest.slice(0,bar); }
    const pt=rest.trim();
    if(!DICT[w]) DICT[w]={pt}; else if(!DICT[w].lemma) DICT[w].pt = DICT[w].pt;   // primeira definição direta vence
    forms.forEach(f=>{ if(!DICT[f]) DICT[f]={pt, lemma:w}; });
  });
  Object.keys(DICT).forEach(k=>{ const n=strip(k); if(!DICTN[n]) DICTN[n]=k; });
})();
function dictLookup(raw){
  const w0=(raw||"").toLowerCase().replace(/[^a-záéíóúñü]/g,""); if(!w0) return null;
  const tryW = w => { if(DICT[w]) return {w, ...DICT[w]}; const n=DICTN[strip(w)]; if(n) return {w:n, ...DICT[n]}; return null; };
  const cands=[w0];
  if(w0.length>3){
    if(/es$/.test(w0)) cands.push(w0.slice(0,-2), w0.slice(0,-2)+"e");                 // plurais
    if(/s$/.test(w0)) cands.push(w0.slice(0,-1));
    if(/a$/.test(w0)) cands.push(w0.slice(0,-1)+"o");                                   // feminino
    if(/as$/.test(w0)) cands.push(w0.slice(0,-2)+"o", w0.slice(0,-2)+"a");
    if(/os$/.test(w0)) cands.push(w0.slice(0,-2)+"o");
    if(/mente$/.test(w0)) cands.push(w0.slice(0,-5), w0.slice(0,-5).replace(/a$/,"o"));  // advérbios
    if(/(ísimo|ísima|ísimos|ísimas)$/.test(w0)) cands.push(w0.replace(/(ísimo|ísima|ísimos|ísimas)$/,"o"), w0.replace(/(ísimo|ísima|ísimos|ísimas)$/,"e"), w0.replace(/qu(ísimo|ísima)$/,"co"), w0.replace(/gu(ísimo|ísima)$/,"go"));
    if(/(ito|ita|itos|itas|illo|illa)$/.test(w0)) cands.push(w0.replace(/(ito|ita|itos|itas|illo|illa)$/,"o"), w0.replace(/(ito|ita|itos|itas|illo|illa)$/,"a"), w0.replace(/c(ito|ita)$/,""), w0.replace(/qu(ito|ita)$/,"co"));
  }
  // pronome grudado (ayúdame, pedirme, quédese, dame) e futuro (recibiré, tardará)
  if(w0.length>4){
    for(const suf of ["nos","los","las","les","me","te","se","lo","la","le"]){
      if(w0.endsWith(suf) && w0.length-suf.length>=2){ const base=w0.slice(0,-suf.length); const plain=strip(base); cands.push(base, plain, base+"r", plain+"r", plain.replace(/a$/,"ar"), plain.replace(/e$/,"ar")); }
    }
    const fut=w0.match(/^(.*?r)(é|ás|á|emos|éis|án)$/); if(fut) cands.push(fut[1]);
  }
  for(const c of cands){ const hit=tryW(c); if(hit){ let note=""; if(hit.lemma) note=`forma de ${hit.lemma}`; else if(c!==w0) note=`de ${hit.w}`; return {w:w0, pt:hit.pt, note, lemma:hit.lemma||hit.w}; } }
  return null;
}

      if(last.isFinal){ alts=Array.from(last).map(a=>a.transcript.trim()).filter(Boolean); if(!alts.length && best) alts=[best]; finish({alts, partial:false}); }

let phraseFilter = "all", phraseQuery = "";
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function renderFrases(){
  const chips = [["all","Todas"],["kit","Kit de sobrevivência"],["fa","Falsos amigos"],...WEEKS.map(w=>[String(w.n), w.title])];
  $("#v-frases").innerHTML = `
    <div><h2 style="font-size:24px">Guia de frases</h2><p class="muted small" style="margin-top:4px">Todas as frases do plano, para consultar na viagem. Funciona sem internet.</p></div>
    <input class="search" id="q" type="search" placeholder="Buscar frase ou palavra (ex.: andén)" value="${h(phraseQuery)}" autocomplete="off">
    <div class="chips">${chips.map(([k,l])=>`<button class="chip${phraseFilter===k?" on":""}" data-act="chip" data-k="${k}">${h(l)}</button>`).join("")}</div>
    <div id="phr-list" class="stack"></div>`;
  renderPhraseList();
}
function renderPhraseList(){
  const q = norm(phraseQuery.trim());
  let cs = phraseFilter==="kit" ? KITCARDS : CARDS.filter(c => phraseFilter==="all" || (phraseFilter==="fa" ? c.kind==="fa" : (c.kind==="v" && String(c.week)===phraseFilter)));
  if(q) cs = cs.filter(c => norm(c.es+" "+c.pt+" "+c.note).includes(q));
  const groups = [];
  if(phraseFilter==="kit") groups.push(["Kit de sobrevivência: as 24 frases que resolvem", cs]);
  else if(phraseFilter==="fa") groups.push(["Falsos amigos", cs]);
  else WEEKS.forEach(w=>{ const g=cs.filter(c=>c.week===w.n && (c.kind==="v" || phraseFilter==="all")); if(g.length) groups.push([w.title, g]); });
  const dh = q && !q.includes(" ") ? dictLookup(phraseQuery.trim()) : null;

  $("#phr-list").innerHTML = dictHtml + (groups.length ? groups.map(([t,g])=>`<div class="card group"><h3>${h(t)}</h3><div class="list">${g.map(phraseRow).join("")}</div></div>`).join("") : (dictHtml ? "" : `<div class="card muted">Nada encontrado para “${h(phraseQuery)}”.</div>`));

let viajeQ = "";
function viajeSearch(q){
  const n = norm(q.trim()); if(n.length<2) return [];
  const hit = (...xs) => xs.some(x => x && norm(String(x).replace(/<[^>]+>/g,"")).includes(n));
  const out=[];
  Object.entries(DEST).forEach(([id,d])=>{
    const cityHit = hit(d.name, d.region);
    d.must.forEach(m=>{ if(cityHit || hit(m.t, m.area, m.tip, m.price)) out.push({city:d.name, id, kind:"Imperdível", m}); });
    d.daytrips.forEach(m=>{ if(cityHit || hit(m.t, m.how, m.tip)) out.push({city:d.name, id, kind:"Bate e volta", m}); });
    d.curios.forEach((c,i)=>{ if(hit(c)) out.push({city:d.name, id, kind:"Curiosidade", text:c}); });
    d.transit.forEach(g=>g.o.forEach(o=>{ if(hit(o[0], o[3], g.t)) out.push({city:d.name, id, kind:"Transporte", m:{t:o[0], how:g.t+" · "+o[1], link:o[2], tip:o[3], book:"h", pay:0}}); }));
  });

}

let D = null; // treino atual
function openDrill(d){ D = d; D.i = 0; D.score = 0; D.revealed = false; D.total = d.items.length; $("#drill").hidden = false; document.body.style.overflow="hidden"; drawDrill(); }
function closeDrill(){ hideDict(); D = null; setTimeout(maybeReload, 300); $("#drill").hidden = true; document.body.style.overflow=""; try{ speechSynthesis.cancel(); }catch(e){} renderAll(); }
function drillTop(){ const pct = D.items.length ? Math.round(100*D.i/D.items.length) : 100;
  return `<div class="top"><button class="x" data-act="closedrill" aria-label="Fechar">${ICON.x}</button><div class="meter"><span style="width:${pct}%"></span></div><span class="count">${Math.min(D.i+1,D.items.length)}/${D.items.length}</span></div>`; }

function startSession(){
  const fresh = newCards().slice(0, newLeftToday());
  const due = shuffle(dueCards().slice(0,40));
  const items = [];
  for(let i=0;i<fresh.length;i+=4){ const chunk=fresh.slice(i,i+4); chunk.forEach(c=>items.push({t:"learn",c})); shuffle(chunk).forEach(c=>items.push({t:"test",c,dir:Math.random()<.8?"pt":"es"})); }
  due.forEach(c=>items.push({t:"test",c,dir:Math.random()<.8?"pt":"es"}));
  if(!items.length){ toast("Nada pendente hoje. Faça um quiz!"); return; }
  openDrill({mode:"session", items, revealed:false, retries:{}});
}
function quizPool(week){
  let pool = week ? CARDS.filter(c=>c.week===week) : seenCards();
  if(pool.length < 6) pool = unlockedCards();
  return pool;
}
function replyItems(n, week){
  const ds = allDialogs(week||curWeek()); const pairs=[];
  ds.forEach(d=>{ for(let i=0;i<d.lines.length-1;i++) pairs.push({q:d.lines[i], a:d.lines[i+1], d}); });
  if(pairs.length<4) return [];
  const allAnswers = pairs.map(p=>p.a[1]);
  return shuffle(pairs).slice(0,n).map(p=>{
    const opts=[p.a[1]]; for(const x of shuffle(allAnswers)){ if(opts.length>=4) break; if(!opts.includes(x) && x!==p.q[1]) opts.push(x); }
    const c={es:p.q[1], pt:p.q[2], ans:p.a[1], ansPt:p.a[2], note:`Resposta: ${p.a[1]} (${p.a[2]})`, week:p.d.week, kind:"v"};
    return {t:"mc", c, dir:"reply", field:"ans", opts:shuffle(opts), picked:null};
  });
}
function startQuiz(kind, week){
  const pool = quizPool(week);
  const nReply = kind==="quiz" ? 4 : 0;
  const rep = replyItems(nReply, week);
  const qs = shuffle(pool).slice(0,10-rep.length).map(c=>{
    const dir = kind==="listen" ? "listen" : (Math.random()<.5 ? "es" : "pt");
    const field = dir==="pt" ? "es" : "pt";
    const sameW = CARDS.filter(x=>x.id!==c.id && x.kind===c.kind && x[field]!==c[field]);
    const near = shuffle(sameW.filter(x=>Math.abs(x.week-c.week)<=1));
    const far = shuffle(sameW);
    const opts=[c[field]]; for(const x of [...near,...far]){ if(opts.length>=4) break; if(!opts.includes(x[field])) opts.push(x[field]); }
    return {t:"mc", c, dir, field, opts:shuffle(opts), picked:null};
  });
  openDrill({mode:kind, items:shuffle([...qs, ...rep])});
}
function startWrite(){
  let pool = seenCards(); if(pool.length<6) pool = unlockedCards();
  pool = pool.filter(c=>!/[\/…,]/.test(c.es) && c.es.length<=36);
  if(!pool.length){ toast("Veja algumas frases primeiro."); return; }
  openDrill({mode:"write", items:shuffle(pool).slice(0,8).map(c=>({t:"write",c,answer:null}))});
}
function startConv(week, role, which){
  const w = WEEKS[(week||curWeek())-1]; which = (which==="B" && w.dialogB) ? "B" : "A";
  const lines = which==="B" ? w.dialogB : w.dialog; const me = role || (which==="B" ? (w.meB||"A") : (w.me||"A"));
  openDrill({mode:"conv", week:w.n, which, me, items:lines.map((l,k)=>({t:l[0]===me?"mine":"theirs", line:l, prev:k?lines[k-1]:null}))});
}
function pickConv(){
  const cw = curWeek();
  openDrill({mode:"pick", items:[{t:"pick"}]});
  $("#drill").innerHTML = drillTop().replace(/<div class="meter">.*?<\/div><span class="count">.*?<\/span>/,'<h2 style="font-size:20px;flex:1">Escolha a conversa</h2>') +
    `<div class="stage" style="justify-content:flex-start"><div class="opts">${allDialogs(cw).map(d=>`<button class="opt" data-act="conv" data-week="${d.week}" data-which="${d.which}"><b>${String(d.week).padStart(2,"0")}${d.which}</b> · ${h(d.title)}${d.which==="B"?' <span class="pill soon" style="font-size:10px">2ª conversa</span>':""}<br><span class="muted small">${h(d.lines[0][1])}</span></button>`).join("")}</div></div>`;
}
function startPron(){
  if(!MIC){ toast(window.claude ? "O microfone não funciona dentro do Claude. Use o app instalado." : "Este navegador não permite microfone. Vou abrir o Eco."); startEco(); return; }
  const w=curWeek(); let pool=seenCards(); if(pool.length<8) pool=unlockedCards();
  const soundWords = shuffle(SOUNDS.flatMap(x=>x.ex.filter(e=>!/\s/.test(e)))).slice(0,3);
  const cardWords = shuffle([...new Set(pool.flatMap(c=>wordsOf(c.es)).filter(x=>x.length>=4))]).slice(0,4).map(x=>{ const c=pool.find(c=>wordsOf(c.es).includes(x)); const orig=c ? c.es.replace(/[¿?¡!.,;:…]/g," ").split(/\s+/).find(o=>norm(o)===x) : x; return orig||x; });
  const words=[...new Set([...soundWords, ...cardWords])].slice(0,5).map(t=>({t:"pron",kind:"word",txt:t,tries:0}));
  const phrases=shuffle(pool.filter(c=>!/[\/…]/.test(c.es) && c.es.split(" ").length>=2 && c.es.length<=40)).slice(0,7).map(c=>({t:"pron",kind:"phrase",txt:c.es,pt:c.pt,tries:0}));
  openDrill({mode:"pron", items:[...words,...phrases], firstTry:0});
}
function startEco(){ let pool=seenCards(); if(pool.length<6) pool=unlockedCards(); openDrill({mode:"eco", items:shuffle(pool).slice(0,10).map(c=>({t:"eco",c}))}); }
function startSons(){ openDrill({mode:"sons", items:SOUNDS.map(x=>({t:"som",s:x}))}); }
function heardHtml(it){ if(!it.heard) return ""; const sc=it.heard.score; const cls=sc>=.8?"ok":sc>=.5?"mid":"bad";
  if(!it.heard.msg) it.heard.msg = sc>=.8 ? rnd(PRAISE) : rnd(CHEER);
  return `<div class="verdict ${cls}">${h(it.heard.msg[0])} ${sc>=.8?"":sc>=.5?"Quase lá.":"Não ficou claro."} <span class="muted" style="font-weight:400">Entendi: “${h(it.heard.text)}”</span></div>`; }
function micBtn(it){ return it.listening
  ? `<button class="btn bad" data-act="micstop">${ICON.mic} Ouvindo… <span class="ct">toque para parar</span></button>`
  : `<button class="btn saff" data-act="mic">${ICON.mic} Falar</button>`; }
function heardLive(txt){ let el=$("#heard-live"); if(!el){ const flash=$("#drill .flash"); if(!flash) return; el=document.createElement("div"); el.id="heard-live"; el.className="verdict mid"; flash.appendChild(el); } el.textContent = txt ? "Ouvindo: "+txt : "Ouvindo… pode falar"; }
function mcItem(c, dir, pool){
  const field = dir==="pt" ? "es" : "pt";
  const same = CARDS.filter(x=>x.id!==c.id && x.kind===c.kind && x[field]!==c[field]);
  const near = shuffle(same.filter(x=>Math.abs(x.week-c.week)<=1)), far = shuffle(same);
  const opts=[c[field]]; for(const x of [...near,...far]){ if(opts.length>=4) break; if(!opts.includes(x[field])) opts.push(x[field]); }
  return {t:"mc", c, dir, field, opts:shuffle(opts), picked:null};
}
function startDuel(){
  if(locals().length<2){ toast("O duelo é para duas pessoas no mesmo celular. Adicione um perfil em Pasajeros."); openPasajeros(); return; }
  const others = locals().filter(x=>x.id!==PR.active);
  const players = [me(), others[Math.floor(Math.random()*others.length)]];
  let pool = unlockedCards(); if(pool.length<8) pool = CARDS.filter(c=>c.week<=2);
  const qs = shuffle(pool).slice(0,10);
  const items=[]; qs.forEach((c,i)=>{ const who=players[i%2]; items.push({t:"turn", who}); const it=mcItem(c, Math.random()<.5?"es":"pt", pool); it.who=who; items.push(it); });
  $("#sheet").hidden=true;
  openDrill({mode:"duel", items, players, dscore:{[players[0].id]:0,[players[1].id]:0}});
}
function startFalsos(){
  const pool = CARDS.filter(c=>c.kind==="fa");
  const qs = shuffle(pool).slice(0,10).map(c=>{ const opts=[c.pt, ...shuffle(pool.filter(x=>x.id!==c.id)).slice(0,3).map(x=>x.pt)]; return {t:"mc",c,dir:"es",field:"pt",opts:shuffle(opts),picked:null}; });
  openDrill({mode:"falsos", items:qs});
}

function drawDrill(){
  const el = $("#drill");
  if(D.i >= D.items.length){ return drawDone(); }
  const it = D.items[D.i], c = it.c;
  let stage = "", actions = "";
  if(it.t==="learn"){
    if(!it.played){ it.played=true; speak(c.es); }
    stage = `<div class="flash"><span class="kind">${c.kind==="fa"?"Falso amigo":"Frase nova"} · ouça e repita em voz alta</span><div class="big">${W(c.es)}</div>${sayRow(c.es,true)}<hr><div class="ans" style="color:var(--muted)">${h(c.pt)}</div>${c.note?`<div class="note">${h(c.note)}</div>`:""}</div>`;
    actions = `<div class="actions"><button class="btn wide" data-act="learned">¡Dicho! Próxima</button></div>`;
  } else if(it.t==="test"){
    const oral = it.dir==="pt";
    if(!oral && !it.played){ it.played=true; speak(c.es); }
    const front = oral ? c.pt : c.es;
    const back = oral ? c.es : c.pt;
    stage = `<div class="flash"><span class="kind">${oral?"Diga em voz alta, em espanhol":"Ouça: o que significa?"}</span><div class="big ${oral?"pt":""}">${oral?h(front):W(front)}</div>${!oral?sayBtn(c.es,true):""}${heardHtml(it)}${D.revealed?`<hr><div class="ans">${oral?W(back):h(back)}</div>${oral?sayRow(c.es):""}${c.note?`<div class="note">${h(c.note)}</div>`:""}`:""}</div>`;
    actions = D.revealed
      ? `<div class="actions three"><button class="btn bad" data-act="grade" data-g="bad">Não saiu</button><button class="btn soft" data-act="grade" data-g="mid">Quase</button><button class="btn ok" data-act="grade" data-g="good">${oral?"Falei bem":"Entendi"}</button></div>`
      : `<div class="actions${MIC&&oral?" duo":""}">${MIC&&oral?micBtn(it):""}<button class="btn wide" data-act="reveal">${oral?"Já falei: ouvir a resposta":"Mostrar significado"}</button></div>`;
  } else if(it.t==="theirs"){
    if(!it.played){ it.played=true; speak(it.line[1]); }
    const nextMine = D.items[D.i+1] && D.items[D.i+1].t==="mine";
    stage = `<div class="flash"><span class="kind">${h(it.line[0])} fala</span><div class="big">${W(it.line[1])}</div>${sayRow(it.line[1],true)}<hr><div class="pt">${h(it.line[2])}</div></div>`;
    actions = `<div class="actions"><button class="btn wide" data-act="next">${nextMine?"Sua vez de responder":"Continuar"}</button></div>`;
  } else if(it.t==="mine"){
    stage = `${it.prev?`<div class="ctx">${h(it.prev[0])}: “${h(it.prev[1])}”</div>`:""}<div class="flash"><span class="kind">Sua fala · diga em espanhol</span><div class="big pt">${h(it.line[2])}</div>${heardHtml(it)}${D.revealed?`<hr><div class="ans">${W(it.line[1])}</div>${sayRow(it.line[1])}<p class="small muted">Repita imitando a entonação.</p>`:""}</div>`;
    actions = D.revealed ? `<div class="actions"><button class="btn wide" data-act="next">Próxima fala</button></div>`
      : `<div class="actions${MIC?" duo":""}">${MIC?micBtn(it):""}<button class="btn wide" data-act="reveal">Já falei: ouvir o certo</button></div>`;
  } else if(it.t==="pron"){
    if(!it.played){ it.played=true; speak(it.txt); }
    const hd=it.heard;
    stage = `<div class="flash"><span class="kind">${it.kind==="word"?"Palavra":"Frase"} · ouça e repita no microfone</span>
      ${hd ? `<div class="marks">${hd.marks.map(m=>`<span class="wm ${m.ok?"ok":"bad"}">${h(m.w)}</span>`).join("")}</div>` : `<div class="big">${W(it.txt)}</div>`}
      ${it.pt?`<div class="pt">${h(it.pt)}</div>`:""}
      ${sayRow(it.txt,true)}
      ${hd ? `<div class="verdict ${hd.score>=.99?"ok":hd.score>=.5?"mid":"bad"}">${h(hd.msg[0])} <span class="muted" style="font-weight:400">${hd.score>=.99?"Perfeito.":hd.score>=.5?"Quase: repita as palavras em vermelho.":"Não entendi bem. Ouça de novo e fale mais devagar."} Entendi: “${h(hd.text)}”</span></div>` : ""}
      ${it.tries>1?`<span class="tries">tentativa ${it.tries}</span>`:""}
    </div>`;
    actions = hd
      ? `<div class="actions${hd.score<.99?" duo":""}">${hd.score<.99?`<button class="btn saff" data-act="pronretry">${ICON.mic} De novo</button>`:""}<button class="btn wide" data-act="next">Próxima</button></div>`
      : `<div class="actions duo">${micBtn(it)}<button class="btn ghost" data-act="next">Pular</button></div>`;
  } else if(it.t==="eco"){
    if(!it.played){ it.played=true; speak(c.es); }
    stage = `<div class="flash"><span class="kind">Eco · ouça e repita junto</span><div class="big">${W(c.es)}</div>${sayRow(c.es,true)}<hr><div class="pt">${h(c.pt)}</div><p class="small muted">Repita 3 vezes: devagar, no ritmo normal e de olhos fechados.</p></div>`;
    actions = `<div class="actions"><button class="btn wide" data-act="spoke">Repeti, próxima</button></div>`;
  } else if(it.t==="som"){
    const x = it.s;
    stage = `<div class="flash" style="text-align:left;align-items:stretch"><span class="kind">Som difícil</span><div class="big" style="font-size:26px">${h(x.t)}</div><p>${h(x.d)}</p><div class="opts">${x.ex.map(e=>`<button class="opt" data-act="say" data-say="${h(e)}">${ICON.say}${W(e)}</button>`).join("")}</div><p class="small muted">Toque em cada uma, ouça e repita em voz alta.</p></div>`;
    actions = `<div class="actions"><button class="btn wide" data-act="spoke">Repeti todas, próximo som</button></div>`;
  } else if(it.t==="turn"){
    stage = `<div class="flash"><span class="kind">Duelo · ${D.dscore[D.players[0].id]} × ${D.dscore[D.players[1].id]}</span><div class="av" style="width:84px;height:84px">${faceOf(it.who.id)}</div><div class="big">Vez de ${h(it.who.name)}</div><p class="muted">Passe o celular. Vale 1 ponto por acerto.</p></div>`;
    actions = `<div class="actions"><button class="btn wide" data-act="next">¡Vamos!</button></div>`;
  } else if(it.t==="mc"){
    const prompt = it.dir==="listen" ? `<span class="kind">Ouça e escolha</span>${sayBtn(c.es,true)}${it.picked!==null?`<div class="ans">${h(c.es)}</div>`:""}`
      : it.dir==="reply" ? `<span class="kind">Alguém diz… o que você responde?</span><div class="big">${W(c.es)}</div><div class="pt">${h(c.pt)}</div>${sayBtn(c.es)}`
      : `<span class="kind">${it.dir==="es"?"O que significa?":"Como se diz em espanhol?"}</span><div class="big ${it.dir==="pt"?"pt":""}">${h(it.dir==="es"?c.es:c.pt)}</div>${it.dir==="es"?sayBtn(c.es):""}`;
    stage = `${it.who?`<div class="ctx">Respondendo: <b>${h(it.who.name)}</b></div>`:""}<div class="flash">${prompt}</div><div class="opts">${it.opts.map((o,k)=>{ let cls=""; if(it.picked!==null){ if(o===c[it.field]) cls=" right"; else if(k===it.picked) cls=" wrong"; } return `<button class="opt${cls}" data-act="pick" data-k="${k}" ${it.picked!==null?"disabled":""}>${h(o)}</button>`; }).join("")}</div>${it.msg ? `<div class="verdict ${it.msg.ok?"ok":"mid"}">${h(it.msg.es)} <span class="muted" style="font-weight:400">${h(it.msg.pt)}</span></div>`:""}${it.picked!==null && c.note ? `<div class="note">${h(c.note)}</div>`:""}`;
    actions = it.picked!==null ? `<div class="actions"><button class="btn wide" data-act="next">Próxima</button></div>` : "";
  } else if(it.t==="write"){
    const res = it.answer;
    stage = `<div class="flash"><span class="kind">Escreva em espanhol</span><div class="big pt">${h(c.pt)}</div>
      ${res ? `<div class="verdict ${res.v}">${res.v==="ok"?"¡Perfecto!":res.v==="mid"?"Quase! Confira os acentos:":"A resposta é:"} <span style="font-family:var(--f-display)">${h(c.es)}</span></div>${sayBtn(c.es)}${c.note?`<div class="note">${h(c.note)}</div>`:""}`
      : `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Digite aqui"><div class="accents">${["á","é","í","ó","ú","ñ","ü","¿","¡"].map(a=>`<button data-act="acc" data-a="${a}">${a}</button>`).join("")}</div>`}</div>`;
    actions = res ? `<div class="actions"><button class="btn wide" data-act="next">Próxima</button></div>` : `<div class="actions"><button class="btn wide" data-act="check">Conferir</button></div>`;
  }
  el.innerHTML = drillTop() + `<div class="stage">${stage}</div>` + actions;
  const a = $("#ans"); if(a){ a.focus(); a.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); checkWrite(); } }); }
}
function drawDone(){
  if(D.mode==="duel") return drawDuelDone();
  if(!D.logged){ D.logged=true; const lg=logToday(); if(D.mode==="conv"){ lg.c=(lg.c||0)+1; save(); } if(D.mode==="eco"||D.mode==="sons"||D.mode==="pron"){ lg.e=(lg.e||0)+1; save(); } }
  const good = D.mode==="session" || D.mode==="conv" || D.mode==="eco" || D.mode==="sons" || D.score>=D.total*0.8;
  const pr = good ? rnd(PRAISE) : rnd(CHEER);
  confetti_if(good); tone("done");
  const M = {
    session:["¡Olé!","Sessão concluída!",`Agora pratique a conversa da semana. Sequência: ${streak()} ${streak()===1?"dia":"dias"}.`],
    conv:["¡Genial!","Conversa completa!","Agora troque de papel e faça a outra pessoa."],
    eco:["¡Bien!","Eco concluído","Quanto mais você repete em voz alta, mais natural fica."],
    pron:["¡Qué bien suena!","Pronúncia treinada",`${D.firstTry} de ${D.total} entendidas de primeira. As que falharam voltam amanhã.`],
    sons:["¡Perfecto!","Sons revisados","Volte aqui sempre que algum som travar."]
  }[D.mode];
  const [, msg0, sub] = M || ["", `${D.score} de ${D.total}`, good ? "Você está mandando bem." : "Os erros voltam na sua próxima sessão de revisão."];
  const big = pr[0], msg = msg0 ? `${msg0} · ${pr[1]}` : pr[1];
  const btns = D.mode==="session" ? `<button class="btn saff wide" data-act="conv">Praticar a conversa da semana</button>`
    : D.mode==="conv" ? `<button class="btn saff wide" data-act="convswap">Trocar de papel</button>${WEEKS[D.week-1].dialogB ? `<button class="btn soft wide" data-act="conv" data-week="${D.week}" data-which="${D.which==="B"?"A":"B"}">${D.which==="B"?"Conversa 1 desta semana":"2ª conversa desta semana"}</button>`:""}<button class="btn ghost wide" data-act="again">De novo</button>`
    : `<button class="btn soft wide" data-act="again">Mais uma rodada</button>`;
  $("#drill").innerHTML = drillTop() + `<div class="stage"><div class="done-box"><div class="av cheer" style="width:84px;height:84px">${LOLA}</div><div class="big">${h(big)}</div>${msg?`<p style="font-size:18px;font-weight:700">${h(msg)}</p>`:""}<p class="muted">${h(sub)}</p></div></div><div class="actions">${btns}<button class="btn ghost wide" data-act="closedrill">Voltar</button></div>`;
}
function confetti_if(ok){ if(ok) confetti(); }
function drawDuelDone(){
  const [a,b]=D.players, sa=D.dscore[a.id], sb=D.dscore[b.id];
  const tie = sa===sb; const win = sa>sb?a:b;
  if(!tie && !D.recorded){ D.recorded=true; PR.duels[win.id]=(PR.duels[win.id]||0)+1; saveProfiles(); }
  confetti(); tone("done"); const pr=rnd(PRAISE);
  $("#drill").innerHTML = drillTop() + `<div class="stage"><div class="done-box"><div class="av cheer" style="width:84px;height:84px">${tie?LOLA:faceOf(win.id)}</div><div class="big">${tie?"¡Empate!":h(pr[0])}</div><p style="font-size:18px;font-weight:700">${tie?"Ninguém leva desta vez":`${h(win.name)} ganha o duelo!`}</p><p class="muted">${h(a.name)} ${sa} × ${sb} ${h(b.name)}${tie?"":" · "+h(pr[1])}</p></div></div><div class="actions"><button class="btn saff wide" data-act="again">Revanche</button><button class="btn ghost wide" data-act="closedrill">Voltar</button></div>`;
}
function checkWrite(){
  const it = D.items[D.i]; const v = ($("#ans")||{}).value || "";
  const strip = s => s.toLowerCase().replace(/[¿?¡!.,;:]/g,"").replace(/\s+/g," ").trim();
  const exact = strip(v)===strip(it.c.es);
  const loose = norm(strip(v))===norm(strip(it.c.es));
  it.answer = {v: exact?"ok":loose?"mid":"bad"}; tone(exact||loose?"ok":"bad");
  if(exact||loose) D.score++;
  if(!exact && !loose && S.cards[it.c.id]){ S.cards[it.c.id].d = todayN(); }
  logToday().q++; save();
  drawDrill();
}

function applySettings(){
  const trip=$("#s-trip").value, start=$("#s-start").value;
  if(/^\d{4}-\d{2}-\d{2}$/.test(trip)) S.trip=trip;
  if(/^\d{4}-\d{2}-\d{2}$/.test(start)) S.start=start;
  S.daily = +$("#s-daily").value || 8;
  S.rate = +$("#s-rate").value || 0.9;
  S.dest = ($("#s-dest").value || "ESPAÑA").slice(0,14);
  S.name = ($("#s-name").value || "").trim().slice(0,20) || me().name;
  me().name = S.name; saveProfiles();
  S.sound = $("#s-sound").checked;
  save(); renderAll();
}
