<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rumbo mudou de endereço</title>
<style>body{font-family:-apple-system,Segoe UI,system-ui,sans-serif;background:#faf5ee;color:#151b2e;margin:0;padding:32px 20px;line-height:1.5}a{color:#2443a6;font-weight:700}.box{max-width:480px;margin:0 auto;background:#fff;border:1px solid #e5dcd0;border-radius:16px;padding:20px}</style>
<script>
try{ if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); }catch(e){}
try{ caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }catch(e){}
setTimeout(()=>{ location.replace("https://marielanatal.github.io/cursodeidiomas/"+location.hash); }, 1200);
</script></head>
<body><div class="box"><h2>O Rumbo mudou de endereço</h2><p>O app agora fica em <a href="https://marielanatal.github.io/cursodeidiomas/">marielanatal.github.io/cursodeidiomas</a>. Você será levada para lá em um instante.</p><p>Seu progresso continua: ele fica guardado neste mesmo site. Depois, adicione o novo endereço à tela de início e apague o ícone antigo.</p></div></body></html>
