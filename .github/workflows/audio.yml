name: Áudio das frases (vozes neurais)

on:
  workflow_dispatch:
  push:
    branches: [claude/spanish-learning-mobile-app-0k3vor]
    paths:
      - espanhol/audio-texts.json
      - espanhol/tools/gen_audio.py
      - .github/workflows/audio.yml

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Fonte (lista de textos)
        uses: actions/checkout@v4
        with:
          path: src
      - name: Site publicado (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar edge-tts
        run: pip install --quiet edge-tts
      - name: Gerar os áudios que faltam
        env:
          TTS_PAR: "5"
        run: python src/espanhol/tools/gen_audio.py src/espanhol/audio-texts.json site/audio
      - name: Publicar no gh-pages
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git commit -m "Áudio gravado das frases (vozes neurais)" || echo "nada novo"
          # o app pode ter sido publicado no gh-pages enquanto os áudios eram gerados
          for i in 1 2 3; do git pull --rebase origin gh-pages && git push && break || sleep 10; done
