  {t:"Pero × perro: o erre decide", r:"<b>Pero</b> (mas) tem erre simples, uma só vibração. <b>Perro</b> (cachorro) tem erre duplo. O mesmo com <b>caro/carro</b>, <b>coral/corral</b>, <b>cero/cerro</b>. Quem fala português tende a vibrar demais o <i>r</i> entre vogais.",
   ex:[["Pero no puedo.","Mas não posso."],["Tengo un perro.","Tenho um cachorro."],["Es caro.","É caro."],["Es un carro.","É uma carroça."]], bad:"'Perro no puedo' faz o espanhol sorrir, e você perceber."},
  {t:"Castellano em Barcelona", r:"<b>Español</b> e <b>castellano</b> são sinônimos, mas na Catalunha, no País Basco e na Galícia, onde há outra língua cooficial, dizer <b>castellano</b> mostra que você entende que o espanhol é uma das línguas do lugar, não a única. Pequeno gesto, grande efeito.",

function buildLevelCards(weeks, p){ const out=[]; weeks.forEach(w=>w.cards.forEach((c,i)=>out.push({id:`${p}${w.n}-${i}`, es:c[0], pt:c[1], note:c[2]||"", week:w.n, kind:"v", tier:1, ord:w.n*100+i}))); weeks.forEach(w=>(w.extra||[]).forEach((c,i)=>out.push({id:`${p}x${w.n}-${i}`, es:c[0], pt:c[1], note:c[2]||"", week:w.n, kind:"v", tier:2, ord:w.n*100+70+i}))); return out; }
const COURSE = {
  basico:     { id:"basico",     name:"Básico",        cefr:"A1–A2", short:"para a viagem",      weeks:WEEKS_A1, cards:CARDS, frames:FRAMES, peg:PEGADINHAS, lect:LECTURAS, wp:WP_WEEK_A1, p:"w" },
  intermedio: { id:"intermedio", name:"Intermediário", cefr:"B1",    short:"contar e opinar",             weeks:WEEKS_B1, cards:buildLevelCards(WEEKS_B1,"i"), frames:FRAMES_B1, peg:PEGADINHAS_B1, lect:LECTURAS_B1, wp:WP_WEEK_B1, p:"i" },
  avanzado:   { id:"avanzado",   name:"Avançado",      cefr:"B2–C1", short:"soar como local",          weeks:WEEKS_B2, cards:buildLevelCards(WEEKS_B2,"a"), frames:FRAMES_B2, peg:PEGADINHAS_B2, lect:LECTURAS_B2, wp:WP_WEEK_B2, p:"a" }
};
function curLevel(){ return COURSE[S && S.level] || COURSE.basico; }
function isBasic(){ return curLevel().id==="basico"; }
function lvKey(k){ return isBasic() ? String(k) : curLevel().p+":"+k; }
function applyLevel(){ const L=curLevel(); WEEKS=L.weeks; CARDS=L.cards; TOTAL_WEEKS=WEEKS.length; FRAMES=L.frames; PEGADINHAS=L.peg; LECTURAS=L.lect; WP_WEEK=L.wp; }
function setLevel(id, restart){ if(!COURSE[id]) return; S.level=id; if(id!=="basico"){ S.startL=S.startL||{}; if(restart || !S.startL[id]) S.startL[id]=todayKey(); } save(); applyLevel(); openWeek=null; renderAll(); }
applyLevel();
/* Página travada enquanto uma folha (ajustes, boas-vindas) está aberta: evita a tela "dançar" no iPhone */
new MutationObserver(()=>{ document.documentElement.classList.toggle("lock", !$("#sheet").hidden); }).observe($("#sheet"), {attributes:true, attributeFilter:["hidden"]});
/* início */
if(!S.updatedAt){ persistLocal(); }
renderAll();
connectRemote();
setTimeout(()=>{ if(!PR.onboarded && $("#sheet").hidden) openOnboarding(); }, 400);
(function(){ const m=location.hash.match(/bk=([A-Za-z0-9_-]+)/); if(m){ let bk=null; try{ bk=b64d(m[1]); }catch(e){} try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  if(bk && bk.v===2){ const names=(bk.list||[]).filter(x=>!x.remote).map(x=>x.name).join(", "); const el=$("#sheet");
    el.innerHTML=`<div class="sheet" role="dialog"><h2 style="font-size:22px">Restaurar backup?</h2><p>Encontrei um backup de <b>${h(names)}</b> feito ${h(agoText(bk.t||Date.now()))}. Restaurar substitui o que está neste aparelho agora.</p><button class="btn wide" id="bk-yes">Restaurar</button><button class="btn ghost wide" data-act="closesheet">Agora não</button></div>`;
    el.hidden=false; $("#bk-yes").onclick=()=>{ if(restoreBackup(bk)){ el.hidden=true; toast(`Pronto, ${me().name}. Tudo de volta!`); confetti(); } else toast("Não consegui restaurar esse backup."); };
  } else toast("Esse link de backup não é válido."); return; }
  const d=parseInvite(location.hash); if(d && receiveScore(d)){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} renderAll(); setTimeout(()=>{ toast(`Placar de ${d.name} recebido. Agora mande o seu!`); if(PR.onboarded) openPasajeros(); }, 600); } })();
/* Atualização automática: quando sai versão nova, o app baixa e recarrega sozinho (fora de um treino). */
const APP_VERSION = "__APP_VERSION__";
let pendingReload = false;
function maybeReload(){ if(!pendingReload) return; if(D || !$("#drill").hidden){ return; } pendingReload=false; toast("Atualizando o app…"); setTimeout(()=>location.reload(), 600); }
if("serviceWorker" in navigator && !window.claude && location.protocol==="https:"){
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", {updateViaCache:"none"}).then(reg=>{
    const check = () => { try{ reg.update(); }catch(e){} };
    document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") check(); });
    window.addEventListener("focus", check);
    setInterval(check, 30*60*1000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(!hadController){ hadController=true; return; } pendingReload=true; maybeReload(); });
}
