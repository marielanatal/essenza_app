<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151b2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumbo a España">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<!-- APP START -->
<title>Rumbo a España</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..600&display=swap">
<style>
/* Layout: uma coluna de bolso (max 560px), painel de "salidas" no topo, abas fixas embaixo. */
:root{
  --paper:#f4f5f9; --surface:#ffffff; --ink:#151b2e; --muted:#586179; --line:#dde1eb;
  --cobalt:#2443a6; --cobalt-soft:#e5eaf9; --on-cobalt:#ffffff;
  --saffron:#d9920f; --saffron-soft:#fbefd4; --on-saffron:#1d1608;
  --ok:#1d7448; --ok-soft:#dcf2e5; --bad:#b0302a; --bad-soft:#f8e0de;
  --board:#1b2f80; --board-fg:#f6c453; --board-dim:#8c93a8; --board-cell:#222a42;
  --hero-a:#1b2f80; --hero-b:#3b57c4; --hero-band:transparent;
  --f-display:"Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:20px; --r-sm:12px;
  --shadow:0 1px 2px rgba(21,27,46,.04), 0 12px 32px -14px rgba(21,27,46,.16);
}
/* Tema do país: cada curso define as cores do cabeçalho e do papel. O JS só troca o atributo. */
html[data-course="es"]{--hero-a:#8f0d19;--hero-b:#d1202b;--hero-band:#f6c453;--board:#8f0d19;--paper:#faf5ee}
html[data-course="fr"]{--hero-a:#1f3a93;--hero-b:#3b5bd1;--hero-band:#e8333b;--board:#1f3a93;--paper:#f3f5fb}
html[data-course="it"]{--hero-a:#0f6b3a;--hero-b:#1f9a55;--hero-band:#d8232a;--board:#0f6b3a;--paper:#f4f8f3}
html[data-course="es"][data-theme="dark"]{--paper:#15100f;--surface:#201818;--line:#332727}
html[data-course="fr"][data-theme="dark"]{--paper:#0d1120;--surface:#161c30;--line:#272f4a}
html[data-course="it"][data-theme="dark"]{--paper:#0d1510;--surface:#152018;--line:#263329}
@media (prefers-color-scheme: dark){
  html[data-course="es"]:not([data-theme="light"]){--paper:#15100f;--surface:#201818;--line:#332727}
  html[data-course="fr"]:not([data-theme="light"]){--paper:#0d1120;--surface:#161c30;--line:#272f4a}
  html[data-course="it"]:not([data-theme="light"]){--paper:#0d1510;--surface:#152018;--line:#263329}
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0c111e; --surface:#151c2e; --ink:#e6eaf4; --muted:#9aa3b9; --line:#262f47;
  --cobalt:#8ea7ff; --cobalt-soft:#1c2750; --on-cobalt:#0c111e;
  --saffron:#f2bb4b; --saffron-soft:#372c13; --on-saffron:#1d1608;
  --ok:#62d29d; --ok-soft:#14332a; --bad:#ff8c82; --bad-soft:#3b1c1b;
  --board:#1b2f80; --board-fg:#f6c453; --board-dim:#7d859b; --board-cell:#131a2b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c111e; --surface:#151c2e; --ink:#e6eaf4; --muted:#9aa3b9; --line:#262f47;
  --cobalt:#8ea7ff; --cobalt-soft:#1c2750; --on-cobalt:#0c111e;
  --saffron:#f2bb4b; --saffron-soft:#372c13; --on-saffron:#1d1608;
  --ok:#62d29d; --ok-soft:#14332a; --bad:#ff8c82; --bad-soft:#3b1c1b;
  --board:#1b2f80; --board-fg:#f6c453; --board-dim:#7d859b; --board-cell:#131a2b;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
html.lock,html.lock body{overflow:hidden;height:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.015em}
h2{font-size:24px}
h3{font-size:18px}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 128px}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Painel de partidas */
.board{background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);color:#fff;margin:12px 0 0;padding:16px 20px 22px;border-radius:28px;position:relative;overflow:hidden;box-shadow:0 18px 36px -14px color-mix(in srgb,var(--hero-a) 70%,transparent)}
.board::before{content:"";position:absolute;top:-70px;right:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 70%);pointer-events:none;z-index:1}
.board::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:4px;border-radius:4px 4px 0 0;background:var(--hero-band);z-index:1}
.board>.hero-photo{position:absolute;inset:0;margin:0;border-radius:0;aspect-ratio:auto;z-index:0;background:transparent;width:auto;max-width:none}
.board>.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;animation:none}
.board>.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--hero-a) 62%,transparent) 0%,color-mix(in srgb,var(--hero-a) 80%,transparent) 55%,color-mix(in srgb,var(--hero-a) 92%,#000 4%) 100%)}
.board>.hero-photo .ph,.board>.hero-photo figcaption{display:none}
.board-top,.count{z-index:1}
.board-top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.brand{display:inline-flex;align-items:center;gap:8px;flex:none}
.brand span{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;color:#fff}
.brand svg{width:26px;height:26px;border-radius:6px}
.pax{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);color:#fff;border-radius:99px;height:32px;padding:0 12px;font-family:var(--f-body);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%;margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.pax i{width:8px;height:8px;border-radius:50%;background:#62d29d;display:inline-block;flex:none}
.gear{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.gear svg{width:20px;height:20px}
.count{display:flex;align-items:center;gap:14px;margin-top:18px;position:relative}
.count b{font-family:var(--f-display);font-size:50px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.count .lbl{display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.25;color:rgba(255,255,255,.88);min-width:0;align-items:flex-start}
.count .lbl strong{color:#fff;font-family:var(--f-display);font-weight:700}
.count .lbl>span:first-child{font-weight:500}
.count .lbl>span:last-child{font-size:12px;font-weight:600;color:rgba(255,255,255,.92);background:rgba(0,0,0,.18);border-radius:99px;padding:5px 11px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);line-height:1.3}
.count .lbl>span:last-child span{background:none;padding:0;font:inherit;color:inherit}
.sync{display:none}

/* Seções */
main{padding-top:18px}
section.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--shadow)}
.card.tint-c{background:var(--cobalt-soft);border-color:transparent;box-shadow:none}
.card.tint-s{background:var(--saffron-soft);border-color:transparent;box-shadow:none}
.card.tint-g{background:var(--ok-soft);border-color:transparent;box-shadow:none}
.card.plain{background:transparent;padding:4px 2px;border:0;box-shadow:none}
button.card{border:0;font:inherit;color:inherit}
.hero-week{background:var(--ink);color:var(--paper);border-radius:var(--r);position:relative;overflow:hidden}
.hero-week::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-week>*{position:relative}
.hero-week h2{font-size:28px;font-weight:800;color:#fff}
.hero-week .sub{color:rgba(255,255,255,.78);margin-top:4px}
.hero-week .eyebrow{color:rgba(255,255,255,.7)}
.hero-week .muted{color:rgba(255,255,255,.8)}
.hero-week .meter{background:rgba(255,255,255,.22)}
.hero-week .meter>span{background:#f6c453}
.hero-week .btn{background:#f6c453;color:#1d1608}
.hero-week .btn.saff{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.hero-week .verdict.ok{background:rgba(255,255,255,.14);color:#fff}
.wicon{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff;margin-bottom:10px}
.wicon svg{width:24px;height:24px}
.meter{height:8px;border-radius:99px;background:var(--cobalt-soft);overflow:hidden}
.meter>span{display:block;height:100%;background:var(--cobalt);border-radius:99px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:600;letter-spacing:-.005em;background:var(--cobalt);color:var(--on-cobalt);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--cobalt);border:1.5px solid var(--cobalt)}
.btn.soft{background:var(--cobalt-soft);color:var(--cobalt)}
.btn.saff{background:var(--saffron);color:var(--on-saffron)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.btn .ct{font-family:var(--f-mono);font-weight:500;font-size:13px;opacity:.85}
.btn.two{flex-direction:column;gap:2px;padding-block:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 4px}
.stat{text-align:center;padding:6px 2px}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--cobalt);line-height:1.1}
.stat span{font-size:12px;color:var(--muted);line-height:1.2;display:block}
.days{display:flex;gap:6px;margin-top:10px}
.day{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.day i{display:block;height:10px;width:10px;border-radius:50%;background:var(--line);margin:0 auto 6px}
.day.on i{background:var(--saffron);box-shadow:0 0 0 4px var(--saffron-soft)}
.day.today{color:var(--ink);font-weight:700}

.phrase{display:flex;gap:12px;align-items:flex-start}
.phrase .txt{flex:1;min-width:0}
.es{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.3;letter-spacing:-.01em}
.pt{color:var(--muted)}
.note{font-size:14px;margin-top:6px;background:var(--saffron-soft);border-radius:8px;padding:6px 10px;color:var(--ink)}
.say{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center}
.say svg{width:20px;height:20px}
.say.lg{width:56px;height:56px}
.say.lg svg{width:26px;height:26px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.tile b{font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.tile span{font-size:13px;color:var(--muted);line-height:1.35}
.tile .ic{width:38px;height:38px;border-radius:11px;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center;margin-bottom:4px}
.tile .ic svg{width:20px;height:20px}
.tile.t-s .ic{background:var(--saffron-soft);color:#8a5a00}
.tile.t-c .ic{background:var(--cobalt-soft);color:var(--cobalt)}
.tile.t-g .ic{background:var(--ok-soft);color:var(--ok)}
.tile.t-r .ic{background:var(--bad-soft);color:var(--bad)}
:root[data-theme="dark"] .tile.t-s .ic{color:var(--saffron)} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile.t-s .ic{color:var(--saffron)}}

/* Lola, níveis e conquistas */
.lola{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}
.av{width:56px;height:56px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;overflow:hidden;flex:none}
.av svg{width:100%;height:100%}
.bubble{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px var(--r) var(--r) var(--r);padding:14px 16px;text-align:left;width:100%;min-width:0}
.bubble .name{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.bubble .es{font-size:18px}
.bubble .pt{font-size:14px;margin-top:2px}
.level .ttl{font-family:var(--f-display);font-size:19px;font-weight:700}
.level .meter>span{background:var(--saffron)}
.badges{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.badge{flex:none;width:72px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.badge .ic{width:52px;height:52px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--muted)}
.badge.on .ic{background:var(--saffron);border-color:transparent;color:var(--on-saffron);box-shadow:0 0 0 4px var(--saffron-soft)}
.badge.on{color:var(--ink)}
.badge b{font-size:11px;line-height:1.2;font-weight:700}
.badge span{display:none}
.fact{font-size:15px}
.fact b{color:var(--cobalt)}
.flame{color:var(--saffron);display:inline-block;vertical-align:-2px;margin-right:2px}
.flame svg{width:18px;height:18px}
.trophy{display:inline-block;vertical-align:-2px;color:var(--saffron)}
.trophy svg{width:14px;height:14px}
@media (prefers-reduced-motion: no-preference){
  .badge.on .ic{animation:pop .4s ease-out}
  .av.cheer svg{animation:wiggle .7s ease-in-out}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
}

/* Plano */
.week{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.week>button.head{width:100%;background:none;border:0;text-align:left;padding:14px 16px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.wnum{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--muted)}
.wnum svg{width:22px;height:22px}
.week.now .wnum{background:var(--cobalt);color:var(--on-cobalt)}
.week.done .wnum{background:var(--ok);color:#fff}
.week.soon .wnum{opacity:.7}
.wtitle{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em}
.wdates{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pill.now{background:var(--cobalt-soft);color:var(--cobalt)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.soon{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.wbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:16px;padding-top:6px}
.tip{background:var(--paper);border-radius:var(--r-sm);padding:14px}
.tip h3{font-size:16px;margin-bottom:6px}
.tip p,.tip li{font-size:15px}
.tip ul{margin:6px 0 0;padding-left:18px}
.tip table{border-collapse:collapse;font-size:14px;margin-top:6px}
.tip td{padding:3px 12px 3px 0;border-bottom:1px solid var(--line)}
.tip td:first-child{color:var(--muted)}
.tblwrap{overflow-x:auto}
.mission{display:flex;gap:12px;align-items:flex-start;background:var(--saffron-soft);border-radius:var(--r-sm);padding:12px}
.mission input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--saffron);flex:none}
.mission label{font-size:15px}
.dlg{display:flex;flex-direction:column;gap:8px}
.convlog{width:100%;max-width:560px;margin:0 auto;opacity:.85}
.convlog .msg .bub .es{font-size:15px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg.r{align-self:flex-end;flex-direction:row-reverse}
.msg .bub{background:var(--paper);border-radius:18px 18px 18px 6px;padding:10px 12px;min-width:0}
.msg.r .bub{background:var(--cobalt-soft);border-radius:18px 18px 6px 18px}
.msg .bub .es{font-size:16px}
.msg .bub .pt{font-size:13px;margin-top:2px}
.msg .say{width:34px;height:34px;flex:none}
.msg .say svg{width:16px;height:16px}
.msg .who{font-size:11px;color:var(--muted);margin-bottom:2px;font-weight:700;letter-spacing:.06em}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;background:none;border:0;text-align:left;padding:8px 10px;border-radius:10px}
.line:hover{background:var(--paper)}
.who{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--cobalt);padding-top:3px;min-width:22px}
.line .es{font-size:16px}
.line .pt{font-size:14px}
.list{display:flex;flex-direction:column}
.list .phrase{padding:10px 0}
.list .phrase+.phrase{border-top:1px solid var(--line)}
.list .es{font-size:17px}

/* Frases */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:13px 16px;font-size:16px;box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.group h3{font-size:15px;color:var(--muted);font-family:var(--f-body);font-weight:700;letter-spacing:.04em;margin:6px 0 2px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bad);margin-right:6px}

.illus{display:block;width:100%;height:auto;max-width:100%}
.photo{position:relative;margin:0;border-radius:var(--r);overflow:hidden;background:var(--cobalt-soft);aspect-ratio:16/9;max-width:100%;width:100%}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--cobalt);opacity:.5}
.photo .ph svg{width:36px;height:36px}

@media (prefers-reduced-motion: no-preference){ .photo img{animation:fadein .4s ease-out} @keyframes fadein{from{opacity:0}to{opacity:1}} }
.hero-art{display:grid;grid-template-columns:1fr 128px;gap:10px;align-items:center}

.postcard{border-radius:18px;overflow:hidden;background:var(--paper)}

.links{display:flex;flex-direction:column;gap:6px}
.lnk{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;text-decoration:none;color:var(--ink)}

.lnk .ic.video{background:${"#d9372b"}} .lnk .ic.podcast{background:var(--cobalt)} .lnk .ic.site{background:var(--ok)}
.lnk b{font-size:14px;display:block;line-height:1.25}
.lnk span.k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lnk .go{color:var(--cobalt);font-weight:700}
.res{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;padding:10px 0}
.res+.res{border-top:1px solid var(--line)}
.res .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.res .ic.video{background:${"#d9372b"}} .res .ic.podcast{background:var(--cobalt)} .res .ic.site{background:var(--ok)}
.res a{font-family:var(--f-display);font-weight:600;color:var(--ink);text-decoration:none}
.res a::after{content:" ↗";color:var(--cobalt);font-size:12px}
.res p{font-size:14px;color:var(--muted)}

/* Rotina de hoje */
.steps{display:flex;flex-direction:column;gap:0;background:transparent;border-radius:var(--r);padding:0;overflow:visible;border:0;box-shadow:none}
.step{display:grid;grid-template-columns:44px 1fr;gap:10px 12px;align-items:center;padding:12px 16px;position:relative}
.step.cur{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:4px 0}
.step.cur .go{grid-column:1 / -1;width:100%;min-height:50px;font-size:16px;font-weight:700;border-radius:12px;margin-top:4px}
.step+.step::before{content:"";position:absolute;left:37px;top:-16px;height:16px;width:2px;background:var(--line)}
.step .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--paper);color:var(--muted)}
.step.cur .n{background:var(--cobalt);color:var(--on-cobalt);box-shadow:0 0 0 5px var(--cobalt-soft)}
.step.done{opacity:.55}
.step.done .n{background:transparent;color:var(--ok);border:2px solid var(--ok)}
.step.done .n svg{width:18px;height:18px}
.step b{font-family:var(--f-display);font-size:16px;font-weight:700;display:block;letter-spacing:-.01em}
.step .d{font-size:13px;color:var(--muted)}
.step.todo{opacity:.7}
.step .go{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--cobalt);color:var(--on-cobalt);min-height:42px;white-space:nowrap}
.step.done .go{background:transparent;color:var(--ok);padding:0;min-height:0}
.step.todo .go{background:var(--paper);color:var(--muted)}
.stepfoot{padding:8px 16px 12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.todayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 4px}
.todayhead h2{font-size:24px}
.todayhead .wk{font-size:13px;color:var(--muted);text-align:right}
.todayhead .wk a{color:var(--cobalt);font-weight:700;text-decoration:none}
.alldone{background:var(--ok);color:#fff;border-radius:var(--r);padding:22px 18px;display:flex;gap:14px;align-items:center}
.alldone .big{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.alldone p{opacity:.9;font-size:14px;margin-top:4px}
.prog{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);box-shadow:none;border-radius:var(--r);padding:14px 16px;width:100%;text-align:left;font:inherit;color:inherit}
.prog .nums{display:flex;gap:16px}
.prog .nums b{font-family:var(--f-display);font-size:22px;font-weight:800;color:var(--cobalt);display:block;line-height:1}
.prog .nums span{font-size:11px;color:var(--muted)}
.prog .lv{font-size:13px;color:var(--muted);margin-top:8px}
.prog .lv .meter{margin-top:4px;height:6px}
.prog .lv .meter>span{background:var(--saffron)}
.prog .chev{color:var(--muted);font-size:22px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini .card{padding:14px}
.mini .es{font-size:17px}
.onb{display:flex;flex-direction:column;gap:14px}
.onb .pt-step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.onb .pt-step .n{width:40px;height:40px;border-radius:50%;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.onb .pt-step b{display:block;font-family:var(--f-display);font-size:16px;font-weight:700}
.onb .pt-step span{font-size:14px;color:var(--muted)}

/* Viaje: telas */
.vbar{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.vbar .back{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;color:var(--cobalt);display:inline-flex;align-items:center;gap:6px}
.vbar h2{font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;color:var(--ink)}
.menu .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--cobalt);background:var(--cobalt-soft)}

.menu b{font-family:var(--f-display);font-size:16px;font-weight:700;display:block;letter-spacing:-.01em}
.menu span{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.menu .chev{color:var(--muted);font-size:22px}
.citystrip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 12px;margin:0 -4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.citystrip::-webkit-scrollbar{display:none}
.citystrip .citycard{flex:0 0 184px;align-self:flex-start;scroll-snap-align:start;display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;text-align:left;min-height:0;height:auto}
.citystrip .citycard .photo[hidden]{display:block!important}
.citystrip .citycard .photo,.citystrip .citycard .emoji{width:100%;aspect-ratio:4/3;border-radius:0;height:auto}
.citystrip .citycard .cc{display:flex;flex-direction:column;gap:2px;padding:10px 12px 12px;min-width:0}
.citystrip .citycard .cc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citystrip .citycard .cc span{font-size:12px;line-height:1.3}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;align-items:center;padding:12px 14px}
.legend .eyebrow{grid-column:1 / -1}
.legend .bk{white-space:normal;line-height:1.25;justify-self:start}
.citycard{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:10px 12px 10px 10px;text-align:left;width:100%;color:var(--ink)}
.citycard .photo{aspect-ratio:1;width:72px;border-radius:12px}
.citycard .photo figcaption{display:none}
.citycard .emoji{width:72px;height:72px;border-radius:12px;background:var(--cobalt-soft);color:var(--cobalt);display:grid;place-items:center;font-size:26px;font-weight:800;font-family:var(--f-display)}
.citycard b{font-family:var(--f-display);font-size:17px;font-weight:700;display:block;letter-spacing:-.01em}
.citycard span{font-size:13px;color:var(--muted);display:block}
.sec-h{display:flex;align-items:center;gap:10px;margin:14px 0 6px;padding:0 4px}
.sec-h::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--hero-b,var(--cobalt))}
.sec-h h3{font-size:18px}
.citynav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.citynav button{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;background:var(--surface);font-weight:600;color:var(--cobalt);text-align:left}
.citynav button:last-child{text-align:right}
.citynav button:disabled{opacity:.4}
/* Viaje: abas, cidades, tradutor */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:11px;padding:10px;font-weight:700;background:transparent;color:var(--muted)}
.seg button.on{background:var(--cobalt);color:var(--on-cobalt)}
.ctabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.ctabs::-webkit-scrollbar{display:none}
.ctab{flex:none;width:150px;border:0;border-radius:18px;padding:0;overflow:hidden;background:var(--surface);text-align:left;color:var(--ink)}
.ctab .ph2{height:72px;background:var(--cobalt-soft);position:relative}
.ctab .ph2 .photo{border-radius:0;aspect-ratio:auto;height:72px}
.ctab .ph2 .photo figcaption{display:none}
.ctab .ph2 .em{position:absolute;left:10px;bottom:8px;font-size:22px}
.ctab .tx{padding:8px 12px 10px}
.ctab b{font-family:var(--f-display);font-size:16px;display:block}
.ctab span{font-size:12px;color:var(--muted);display:block}
.ctab.on{outline:3px solid var(--cobalt);outline-offset:0}
.ctab.on .tx{background:var(--cobalt-soft)}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;background:var(--surface);color:var(--muted)}
.subtabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.route{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.route label{display:flex;flex-direction:column;gap:4px;min-width:0}
.route select,.route input{border:0;background:var(--paper);border-radius:12px;padding:11px 12px;font-size:16px;font-weight:700;width:100%;min-width:0;font:inherit;font-weight:700}
.route .full{grid-column:1 / -1}
.cityrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0}
.cityrow+.cityrow{border-top:1px solid var(--line)}
.cityrow .pos{width:28px;height:28px;border-radius:50%;background:var(--cobalt-soft);color:var(--cobalt);font-weight:800;font-size:13px;display:grid;place-items:center}
.cityrow .pos svg{width:15px;height:15px}
.cityrow .pos.a{background:var(--ok-soft);color:var(--ok)} .cityrow .pos.d{background:var(--bad-soft);color:var(--bad)}
.cityrow b{font-family:var(--f-display);font-size:16px;font-weight:700;display:block}
.cityrow .sub{font-size:12px;color:var(--muted)}
.tr{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tr textarea{border:0;background:var(--paper);border-radius:14px;padding:12px 14px;font-size:17px;min-height:64px;resize:vertical;width:100%;font:inherit;font-size:17px}
.tr .out{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.3;min-height:28px}
.tr .gloss{display:flex;flex-wrap:wrap;gap:6px}
.tr .gloss span{background:var(--paper);border-radius:10px;padding:5px 9px;font-size:13px}
.tr .gloss span b{color:var(--cobalt);font-weight:700}
.tr .st{font-size:12px;color:var(--muted)}
.dir{display:inline-flex;background:var(--paper);border-radius:99px;padding:3px}
.dir button{border:0;background:transparent;border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.dir button.on{background:var(--cobalt);color:var(--on-cobalt)}
.kitsearch{width:100%;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;font-size:16px;font:inherit;font-size:16px}

/* Viaje */
.bk{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:99px;white-space:nowrap}
.bk i{width:7px;height:7px;border-radius:50%;display:inline-block;background:currentColor}
.bk.g{background:var(--ok-soft);color:var(--ok)} .bk.h{background:var(--cobalt-soft);color:var(--cobalt)} .bk.d{background:var(--saffron-soft);color:#8a5a00} .bk.s{background:var(--bad-soft);color:var(--bad)}
:root[data-theme="dark"] .bk.d{color:var(--saffron)} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bk.d{color:var(--saffron)}}
.dchip{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:0;border-radius:18px;padding:12px 12px;background:var(--surface);text-align:left;flex:1;min-width:0}
.dchip>span:last-child{min-width:0;max-width:100%}
.dchip.on{background:var(--cobalt);color:var(--on-cobalt)}
.dchip .em{font-size:22px}
.dchip b{font-family:var(--f-display);font-size:15px;display:block;line-height:1.1}
.dchip span span{font-size:11px;opacity:.75;display:block;margin-top:2px}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border-radius:99px;padding:3px}
.stepper button{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);font-weight:800;font-size:18px}
.stepper b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.ichip{border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-size:14px;font-weight:600;background:var(--surface);color:var(--muted)}
.ichip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
details.sec{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:0 16px}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 0;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px 0;flex:none;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(-135deg);margin:4px 6px 0 0}
details.sec>.in{padding:0 0 16px;display:flex;flex-direction:column;gap:12px}
.item{display:flex;flex-direction:column;gap:4px;padding:10px 0}
.item+.item{border-top:1px solid var(--line)}
.item .hd{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.item .hd a{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.item .hd .meta2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .hd a::after{content:" ↗";color:var(--cobalt);font-size:13px}
.item .meta{font-size:13px;color:var(--muted)}
.item .tip{background:transparent;padding:0;font-size:14px}
.dayc{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.dayc h3{font-size:18px}
.blk{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start}
.blk .sl{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding-top:3px}
.blk .sl.m{color:var(--saffron)} .blk .sl.n{color:var(--cobalt)}
.blk a{font-weight:700;color:var(--ink);text-decoration:none}
.blk a::after{content:" ↗";color:var(--cobalt);font-size:12px}
.blk .meta{font-size:13px;color:var(--muted);margin-top:2px}
.leg{background:var(--cobalt-soft);border-radius:var(--r-sm);padding:12px 16px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.leg a{color:var(--cobalt);font-weight:700;text-decoration:none;margin-right:10px}
.verd{background:var(--saffron-soft);border-radius:var(--r-sm);padding:12px 14px;font-size:15px}
.sabias{background:var(--saffron-soft);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sabias p{font-size:15px}
.sabias .eyebrow{color:#8a5a00}
:root[data-theme="dark"] .sabias .eyebrow{color:var(--saffron)} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sabias .eyebrow{color:var(--saffron)}}
.curio-in{font-size:13px;line-height:1.45;background:var(--paper);border-left:3px solid var(--saffron);border-radius:0 8px 8px 0;padding:6px 10px;margin-top:8px;color:var(--ink)}
.curio-in b{color:#8a5a00;font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
:root[data-theme="dark"] .curio-in b{color:var(--saffron)} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .curio-in b{color:var(--saffron)}}
details.more>summary{list-style:none;cursor:pointer;padding:10px 0;font-weight:700;color:var(--cobalt);font-size:14px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"– "}
.curio-in.food{border-left-color:var(--ok)}
.curio-in.food b{color:var(--ok)}
.sabias.food{background:var(--ok-soft)} .sabias.food .eyebrow{color:var(--ok)}
.sabias.food p+p{margin-top:8px}
.curio{font-size:15px;padding:8px 0}
.curio+.curio{border-top:1px solid var(--line)}
.curio b{color:var(--cobalt)}
nav.tabs .in{grid-template-columns:repeat(5,1fr)}

/* Abas */
nav.tabs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:999px;padding:6px;box-shadow:0 12px 40px -8px rgba(0,0,0,.22)}

nav.tabs button{background:none;border:0;border-radius:999px;padding:7px 4px;transition:background .2s ease;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.01em}

/* Treino (tela cheia) */
.drill{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.drill .top{display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto}
.x{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.x svg{width:20px;height:20px}
.drill .meter{flex:1}
.drill .count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{flex:1;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:18px 0;overflow-y:auto}
.flash{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:var(--r);padding:24px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.flash .kind{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--saffron)}
.flash .big{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.15;text-wrap:balance;letter-spacing:-.02em}
.flash .big.pt{color:var(--ink);font-weight:600}
.flash hr{width:100%;border:0;border-top:1px dashed var(--line);margin:0}
.flash .ans{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.25}
.flash .note{text-align:left;width:100%}
.actions{max-width:560px;width:100%;margin:0 auto;display:grid;gap:10px}
.actions.three{grid-template-columns:1fr 1fr 1fr}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:14px;text-align:left;font-size:17px;min-height:54px}
.opt svg{width:18px;height:18px;vertical-align:-3px;color:var(--cobalt);margin-right:8px}
.actions.duo{grid-template-columns:1fr 1.4fr}
.slowbtn{min-height:42px;border-radius:99px;padding:8px 14px;border:0;background:var(--cobalt-soft);color:var(--cobalt);font-weight:700;font-size:14px}
.say.lg+.slowbtn{min-height:56px}
.ctx{font-size:14px;color:var(--muted);text-align:left;width:100%;border-left:3px solid var(--line);padding-left:10px}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.answer{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:14px;font-size:20px;font-family:var(--f-display)}
.lect{font-family:var(--f-display);font-size:19px;line-height:1.65;text-align:left;width:100%}
.sent{border-radius:6px;transition:background .15s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sent.on{background:var(--saffron-soft);box-shadow:0 0 0 3px var(--saffron-soft)}
.seq{min-height:54px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;border-bottom:2px dashed var(--line);padding:4px 0 10px;width:100%}
.seq button{background:var(--cobalt);color:var(--on-cobalt);border:0;border-radius:10px;padding:8px 12px;font-size:17px;font-family:var(--f-display);font-weight:600}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bank button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:17px;font-family:var(--f-display);font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.bank button:disabled{opacity:.25;box-shadow:none}
.card.frame .list .phrase{padding:8px 0}
.blanks{display:flex;flex-wrap:wrap;gap:6px 8px;justify-content:center;align-items:flex-end;width:100%}
.bwrap{display:inline-flex;align-items:flex-end;gap:1px}
.bp{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--muted);padding-bottom:4px}
.bw{border:0;border-bottom:2px solid var(--cobalt);background:var(--cobalt-soft);border-radius:8px 8px 0 0;min-height:36px;padding:4px 8px;font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--cobalt);line-height:1.2}
.bw.on{background:transparent;border-bottom-color:transparent;color:var(--ink)}
.bw.pre{background:transparent;border-bottom-color:var(--line);color:var(--muted)}
.accents{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.accents button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.marks{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wm{padding:4px 10px;border-radius:99px;font-family:var(--f-display);font-weight:600;font-size:18px}
.wm.ok{background:var(--ok-soft);color:var(--ok)} .wm.bad{background:var(--bad-soft);color:var(--bad);text-decoration:underline dotted}
.tries{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.verdict{border-radius:12px;padding:12px 14px;font-weight:700;text-align:left;width:100%}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.mid{background:var(--saffron-soft);color:var(--ink)}
.done-box{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done-box .big{font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--cobalt);letter-spacing:-.03em}

/* Ajustes */
.sheet-bg{position:fixed;inset:0;z-index:50;overscroll-behavior:contain;overflow:hidden;background:rgba(5,8,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;min-width:0;max-width:min(560px,100%);max-height:88vh;max-height:88dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.sheet .row,.sheet label,.sheet .stack{min-width:0}
.sheet select,.sheet input,.sheet textarea{min-width:0;max-width:100%;text-overflow:ellipsis}
.field label{font-weight:700;font-size:15px}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;font-size:16px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus,.kitsearch:focus,.tr textarea:focus,.answer:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
.field textarea{min-height:90px;font-family:var(--f-mono);font-size:16px}
.field input[type=range]{padding:0;accent-color:var(--cobalt)}
/* Timeline da rotina (tela Hoy) */
.steps.timeline{background:transparent;border:0;box-shadow:none;padding:0;overflow:visible;display:flex;flex-direction:column}
.timeline .step{display:grid;grid-template-columns:44px 1fr;gap:10px 12px;align-items:center;padding:12px 16px;position:relative}
.timeline .step+.step::before{content:"";position:absolute;left:37px;top:-16px;height:16px;width:2px;background:var(--line)}
.timeline .step .n{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;background:var(--paper);color:var(--muted)}
.timeline .step.cur{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:4px 0}
.timeline .step.cur .n{background:var(--cobalt);color:var(--on-cobalt);box-shadow:0 0 0 5px var(--cobalt-soft)}
.timeline .step.cur .go{grid-column:1 / -1;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;font-size:17px;font-weight:800;border:0;border-radius:999px;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--cobalt) 60%,transparent);background:var(--cobalt);color:var(--on-cobalt);margin-top:4px;letter-spacing:-.01em}
.timeline .step.cur .go svg{width:20px;height:20px}
.timeline .step.done{opacity:.45}
.timeline .step.done b{text-decoration:line-through;text-decoration-thickness:2px}
.timeline .step.done .n{background:transparent;color:var(--ok);border:2px solid var(--ok)}
.timeline .step.done .n svg{width:18px;height:18px}
.timeline .step.todo{opacity:.7}
.timeline .step.todo .n{background:transparent;border:2px dashed var(--line);color:var(--muted)}

/* iPhone: campo com letra menor que 16px faz o Safari dar zoom ao focar e a folha de ajustes sair do lugar */
input:not([type=range]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}
.hint{font-size:13px;color:var(--muted)}
.w{cursor:pointer;border-radius:4px;transition:background .12s}
.w:active,.w.hit{background:var(--saffron-soft);box-shadow:0 0 0 2px var(--saffron-soft)}
.dic{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:80;width:min(100% - 24px,520px);background:var(--ink);color:var(--paper);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.dic.hi{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.dic .dw{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.dic .dw .say{background:rgba(255,255,255,.15);color:var(--paper);width:36px;height:36px}
.dic .dw .say svg{width:18px;height:18px}
.dic .dpt{font-size:18px}
.dic .dnote{font-size:13px;opacity:.75}
.dic .drow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.dic .drow a,.dic .drow button{font-size:13px;font-weight:700;border-radius:99px;padding:7px 12px;background:rgba(255,255,255,.14);color:var(--paper);border:0;text-decoration:none;min-height:34px;display:inline-flex;align-items:center}
.dic .dx{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:var(--paper);display:grid;place-items:center}
.dic .dx svg{width:16px;height:16px}
.dichint{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){
  .flash,.opt,.verdict{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

{ n:1, me:"B", title:"Hola, ¿qué tal?", sub:"Saudações, apresentação e pronúncia",
  tip:`<h3>Pronúncia: o que muda para quem fala português</h3>
  <ul>
   <li><b>j</b> e <b>g</b> antes de e/i soam como um "rr" forte, raspado na garganta: <i>jamón, gente</i>.</li>
   <li><b>ll</b> e <b>y</b> soam como "i" (não como "lh"): <i>calle</i> ≈ "cái-e".</li>
   <li><b>z</b> e <b>c</b> antes de e/i: na Espanha soam como o "th" do inglês <i>think</i>: <i>gracias</i> ≈ "grá-thias".</li>
   <li><b>ñ</b> = nh. O <b>h</b> é mudo. <b>v</b> soa como <b>b</b>.</li>
   <li>Não existe vogal nasal: <i>bien</i> é "bi-én", não "biẽ". O "o" e o "e" finais não viram "u" e "i": <i>noche</i> ≠ "nóchi".</li>
  </ul>
  <p style="margin-top:8px"><b>Tú ou usted?</b> Na Espanha o <i>tú</i> é usado quase sempre, até com desconhecidos da sua idade. Use <i>usted</i> com pessoas mais velhas ou em situações formais.</p>`,
  mission:"Ouça 10 minutos de espanhol da Espanha por dia (podcast, YouTube ou RTVE Play). Grave um áudio dizendo seu nome, de onde você é e que está aprendendo espanhol.",
  dialog:[["A","¡Hola! ¿Qué tal?","Oi! Tudo bem?"],["B","Muy bien, ¿y tú?","Muito bem, e você?"],["A","Bien, gracias. Me llamo Lucía. ¿Cómo te llamas?","Bem, obrigada. Eu me chamo Lucía. Como você se chama?"],["B","Me llamo Ana. Soy de Brasil.","Eu me chamo Ana. Sou do Brasil."],["A","¡Encantada!","Muito prazer!"],["B","Igualmente.","Igualmente."]],
  cards:[
   ["Hola","Olá / Oi"],
   ["Buenos días","Bom dia"],
   ["Buenas tardes","Boa tarde","Na Espanha a 'tarde' vai até umas 20h ou 21h."],
   ["Buenas noches","Boa noite"],
   ["¿Qué tal?","Tudo bem? / Como vai?"],
   ["Muy bien, gracias. ¿Y tú?","Muito bem, obrigado(a). E você?"],

   ["¿Cómo te llamas?","Como você se chama?"],
   ["Soy de Brasil","Sou do Brasil","Brasileiro = brasileño; brasileira = brasileña."],
   ["Encantado / Encantada","Muito prazer"],

   ["Más despacio, por favor","Mais devagar, por favor"],
   ["¿Hablas inglés?","Você fala inglês?"]
  ]},
{ n:2, me:"A", title:"Aeropuerto y estación", sub:"Chegar, pedir ajuda e pegar o trem",
  tip:`<h3>Pedir ajuda com educação: o "usted"</h3>
  <p>No aeroporto, na estação e com funcionários, use <b>usted</b> (o senhor / a senhora). O verbo fica na 3ª pessoa:</p>
  <ul><li><i>Perdone, ¿<b>me puede</b> ayudar?</i> (e não "puedes")</li><li><i>¿<b>Habla</b> inglés?</i></li><li><i>¿<b>Me lo puede</b> escribir?</i></li></ul>
  <p style="margin-top:8px"><b>IR</b> (ir): <i>voy, vas, va, vamos, vais, van</i>. <i>a + el = al</i>: <i>Voy al centro.</i></p>
  <p style="margin-top:6px"><b>Coger</b> = pegar um transporte. Na Espanha é a palavra normal: <i>¿Dónde cojo el tren?</i></p>
  <p style="margin-top:6px">Em Madri, o trem do aeroporto ao centro é o <b>Cercanías</b> (T4) ou o <b>metro</b> (linha 8). Em Barcelona, o <b>Aerobús</b> ou o trem R2.</p>`,
  mission:"Abra o site do aeroporto onde você vai chegar (aena.es) em espanhol e descubra: como se diz 'retirada de bagagem', 'saída' e 'trem' nas placas. Diga em voz alta o caminho até o centro.",
  dialog:[["A","Perdone, ¿me puede ayudar? Busco la salida a los taxis.","Com licença, pode me ajudar? Estou procurando a saída para os táxis."],["B","Claro. Siga las señales de «Salida» y baje a la planta baja.","Claro. Siga as placas de «Saída» e desça ao térreo."],["A","¿Y dónde puedo coger el tren al centro?","E onde posso pegar o trem para o centro?"],["B","El Cercanías está en la planta menos uno. Compre el billete en la máquina.","O Cercanías fica no andar menos um. Compre a passagem na máquina."],["A","¿Cuánto tarda hasta Atocha?","Quanto tempo demora até Atocha?"],["B","Unos veinticinco minutos.","Uns vinte e cinco minutos."],["A","Muchas gracias, muy amable.","Muito obrigada, muito gentil."],["B","De nada. ¡Buen viaje!","De nada. Boa viagem!"]],
  cards:[
   ["Perdone, ¿me puede ayudar?","Com licença, pode me ajudar? (formal)","Com 'usted'. É a frase que mais vai te salvar."],
   ["¿Habla portugués o inglés?","O senhor / a senhora fala português ou inglês?"],
   ["No entiendo. ¿Me lo puede escribir?","Não entendo. Pode escrever para mim?"],
   ["Más despacio, por favor","Mais devagar, por favor"],
   ["¿Dónde está la salida?","Onde fica a saída?"],
   ["¿Dónde recojo las maletas?","Onde pego as malas?","Esteira = cinta de equipaje."],
   ["la puerta de embarque","o portão de embarque"],
   ["la tarjeta de embarque","o cartão de embarque"],
   ["el control de seguridad","o controle de segurança"],
   ["¿Dónde están los taxis?","Onde ficam os táxis?"],
   ["¿Me lleva a esta dirección?","Pode me levar a este endereço? (táxi)","'dirección' = endereço."],
   ["¿Dónde cojo el tren al centro?","Onde pego o trem para o centro?"],
   ["¿Dónde compro el billete?","Onde compro a passagem?","'Billete' também é cédula de dinheiro."],
   ["un billete de ida / de ida y vuelta","uma passagem só de ida / de ida e volta"],
   ["¿Qué andén?","Qual plataforma?"],
   ["¿Este tren va a…?","Este trem vai para…?"],
   ["¿Cuánto tarda?","Quanto tempo demora?"],
   ["el metro, el tren, el autobús","o metrô, o trem, o ônibus"],
   ["la parada de autobús","o ponto de ônibus"],
   ["Me bajo en la próxima","Vou descer na próxima"],
   ["He perdido el tren / el vuelo","Perdi o trem / o voo"],
   ["el retraso","o atraso"],
   ["¿Dónde hay un cajero?","Onde tem um caixa eletrônico?"],
   ["la consigna","o guarda-volumes"]
  ]},
{ n:3, title:"En la cafetería", sub:"Café, tapas e o bar de esquina",
  tip:`<h3>Artigos e gênero</h3>
  <p>Artigos: <i>el, la, los, las</i> e <i>un, una, unos, unas</i>. Atenção: alguns substantivos mudam de gênero do português para o espanhol:</p>

{ n:4, title:"En el restaurante", sub:"Pedir, entender o cardápio e pagar",
  tip:`<h3>Pedir com educação: quiero, quisiera, me gustaría</h3>

{ n:6, title:"Números, horas y precios", sub:"Contar, pagar e saber que horas são",

   <li>Horas: <i>Es la una</i> (singular), <i>Son las dos, las tres…</i></li>

{ n:7, title:"En el hotel", sub:"Check-in, problemas e pedidos",
  tip:`<h3>TENER e HAY</h3>

{ n:8, title:"De compras", sub:"Roupas, tamanhos e as 'rebajas'",
  tip:`<h3>Este, ese, aquel e o pronome LO</h3>

  <li>No espanhol, o neutro é <b>esto / eso</b>: <i>¿Cuánto cuesta esto?</i></li>

{ n:9, title:"Verbos para todo", sub:"Os verbos que resolvem a viagem",
  tip:`<h3>Presente: regulares e os irregulares que você mais vai usar</h3>

{ n:10, title:"El tiempo y el calendario", sub:"Clima de inverno, dias e datas",

{ n:12, title:"Hacer amigos", sub:"Conversa, gostos e gírias da Espanha",

{ n:13, me:"B", title:"Lo que he hecho", sub:"Contar o que fez e o que vai fazer",
  tip:`<h3>Pretérito perfecto: o passado da Espanha</h3>

const WP_BAD=/escudo|bandera|flag|coat|mapa|map_|_map|locat|situaci|logo|plano|diagram|icon|se[ñn]al|wikidata|commons-logo|placa/i;
async function wpJson(url){ let res; try{ res=await fetch(url,{headers:{"Accept":"application/json"}}); }catch(e){ throw new Error("rede: "+(e&&e.message||e)); } if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); }
async function wpSummary(title){
  if(WPCACHE[title] && WPCACHE[title].srcs && WPCACHE[title].t > Date.now()-30*864e5) return WPCACHE[title];
  const enc=t=>encodeURIComponent(t.replace(/ /g,"_"));
  let t=title, ml=null;
  try{ ml=await wpJson("https://es.wikipedia.org/api/rest_v1/page/media-list/"+enc(t)); }catch(e){}
  if(!ml || !(ml.items||[]).length){
    const sr=await wpJson("https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(title.replace(/_/g," "))+"&srlimit=1&format=json&origin=*");
    const hit=sr && sr.query && sr.query.search && sr.query.search[0]; if(!hit) throw new Error("no article");
    t=hit.title; ml=await wpJson("https://es.wikipedia.org/api/rest_v1/page/media-list/"+enc(t));
  }
  let pics=(ml.items||[]).filter(i=>i.type==="image" && i.showInGallery!==false && /\.jpe?g$/i.test(i.title||"") && !WP_BAD.test(i.title||""));
  if(!pics.length) pics=(ml.items||[]).filter(i=>i.type==="image" && /\.(png|webp)$/i.test(i.title||"") && !WP_BAD.test(i.title||""));
  const srcs=[];
  const abs=u=>u.startsWith("//")?"https:"+u:u;
  pics.slice(0,3).forEach(it=>{
    const file=(it.title||"").replace(/^[^:]+:/,"");
    if(file){ srcs.push("https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(file)+"?width=800"); srcs.push("https://es.wikipedia.org/wiki/Special:FilePath/"+encodeURIComponent(file)+"?width=800"); }
    const s0=(it.srcset && it.srcset[0] && it.srcset[0].src) || (it.original && it.original.source) || "";
    if(s0){ const a=abs(s0); srcs.push(a.replace(/\/\d+px-/, "/800px-").replace(/([?&])width=\d+/, "$1width=800"), a); }
  });
  if(!srcs.length){
    const pi=await wpJson("https://es.wikipedia.org/w/api.php?action=query&prop=pageimages&piprop=thumbnail&pithumbsize=800&titles="+encodeURIComponent(t.replace(/_/g," "))+"&format=json&origin=*");
    const pg=pi && pi.query && pi.query.pages && Object.values(pi.query.pages)[0];
    const ps=(pg && pg.thumbnail && pg.thumbnail.source) || ""; if(!ps) throw new Error("no photo"); srcs.push(abs(ps));
  }
  const out={t:Date.now(), src:srcs[0], srcs:[...new Set(srcs)], title:t.replace(/_/g," "), url:"https://es.wikipedia.org/wiki/"+enc(t)};
  WPCACHE[title]=out; wpSave(); return out;
}
function loadPhotos(){
  if(!PHOTOS_ON) return;
  document.querySelectorAll(".photo[data-wp]:not([data-done])").forEach(async fig=>{
    fig.dataset.done="1"; const title=fig.dataset.wp;
    try{
      const info = await wpSummary(title);
      const list = (info.srcs && info.srcs.length) ? info.srcs : (info.src ? [info.src] : []);
      if(!list.length) throw new Error("no src");
      let k=0;
      const tryNext=()=>{
        if(k>=list.length){ PHOTO_ERR.push(`${title}: imagem não carregou (${list.length} endereços)`); photoFail(fig); return; }
        const u=list[k++]; const img=new Image(); img.alt=fig.dataset.label||info.title; img.decoding="async"; img.referrerPolicy="no-referrer";
        img.onload=()=>{ fig.appendChild(img); const cap=document.createElement("figcaption"); cap.innerHTML = `<b>${h(fig.dataset.label||"")}</b><a href="${h(info.url)}" target="_blank" rel="noopener">Foto: Wikipedia ↗</a>`; fig.appendChild(cap); };
        img.onerror=()=>{ PHOTO_ERR.push(`${title}: falhou ${u.split("/")[2]}`); tryNext(); };
        img.src=u;
      };
      tryNext();
    }catch(e){ PHOTO_ERR.push(`${title}: ${e && e.message || e}`); photoFail(fig); }
  });
}
/* Foto que falhou: a do cabeçalho tenta a próxima da lista do tema; as outras somem */
function photoFail(fig){

  fig.hidden=true;
}

function legFor(a,b){ const l=LEGS[a+"-"+b] || LEGS[b+"-"+a]; if(l) return l; const A=DEST[a], B=DEST[b]; if(!A||!B) return null;
  return {how:`${A.name} → ${B.name}: trem (Renfe) ou ônibus (Alsa/Avanza); confira horários e duração`, links:[["Renfe","https://www.renfe.com"],["Alsa","https://www.alsa.com"],["Rota no Google Maps",`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(A.name+", España")}&destination=${encodeURIComponent(B.name+", España")}&travelmode=transit`]], tip:"Trecho sem detalhes no app ainda: me peça o pacote desta cidade."}; }

/* Monta o roteiro de um destino, dado o número de dias e os interesses */
function buildPlan(id, days, interests, ritmo){
  const d = DEST[id]; if(!d) return [];
  const score = x => (x.tags||[]).reduce((s,t)=>s+(interests.includes(t)?1:0),0);
  const used = new Set();
  const pick = alts => { const names=alts.split("|"); let best=null, bs=-1; names.forEach(n=>{ const m=d.must.find(x=>x.t===n); if(!m||used.has(n)) return; const sc=score(m)*10 + (m.book==="s"?1:0); if(sc>bs){ bs=sc; best=m; } }); if(best) used.add(best.t); return best; };
  const out=[];
  const cityDays = Math.min(days, d.cityMax||d.days.length);
  const trips = days - cityDays;
  for(let i=0;i<cityDays;i++){
    let blocks = d.days[i].map(([slot,alts])=>({slot, m:pick(alts)})).filter(b=>b.m);
    if(ritmo==="tranquilo" && blocks.length>3) blocks = blocks.filter((b,k)=> b.slot!=="t" || k===blocks.findIndex(x=>x.slot==="t"));
    out.push({kind:"city", title:`${d.name}, dia ${i+1}`, blocks});
  }
  // bate-voltas pelos interesses, sem repetir
  const tripsSorted = d.daytrips.filter(t=>!/pernoite/i.test(t.t)).map(t=>({t, sc:score(t)})).sort((a,b)=>b.sc-a.sc);
  for(let j=0;j<trips;j++){ const tr=tripsSorted[j]; if(!tr) break; out.push({kind:"trip", title:`${d.name}, dia ${cityDays+j+1}: bate-volta a ${tr.t.t}`, trip:tr.t}); }
  return out;
}

/* todas as conversas disponíveis: [{week, which:"A"|"B", lines, me, title}] */
function allDialogs(maxWeek){ const out=[]; WEEKS.filter(w=>w.n<=(maxWeek||TOTAL_WEEKS)).forEach(w=>{ out.push({week:w.n, which:"A", lines:w.dialog, me:w.me||"A", title:w.title}); if(w.dialogB) out.push({week:w.n, which:"B", lines:w.dialogB, me:w.meB||"A", title:w.title}); (w.more||[]).forEach((d,i)=>out.push({week:w.n, which:"C"+(i+1), lines:d.lines, me:d.me||"A", title:w.title+" · "+d.t, t:d.t})); }); return out; }
/* Conversa de um tema pelo código: A, B ou C1, C2… (extras) */
function dialogOf(w, which){ const m=/^C(\d+)$/.exec(which||""); const ex=m && (w.more||[])[+m[1]-1]; if(ex) return {which, lines:ex.lines, me:ex.me||"A", pv:ex.pv||"f", t:ex.t}; if(which==="B" && w.dialogB) return {which:"B", lines:w.dialogB, me:w.meB||"A", t:"conversa 2"}; return {which:"A", lines:w.dialog, me:w.me||"A", t:"conversa 1"}; }

/* ============================================================
   DICIONÁRIO (toque numa palavra)
   ============================================================ */
const DICT = {};            // palavra → {pt, lemma}
const DICTN = {};           // sem acento → palavra
const strip = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
(function buildDict(){
  const src = (document.getElementById("dict")||{}).textContent || "";
  src.split("\n").forEach(line=>{
    line=line.trim(); if(!line || line[0]==="#") return;
    const eq=line.indexOf("="); if(eq<0) return;
    const w=line.slice(0,eq).trim().toLowerCase(); let rest=line.slice(eq+1);
    let forms=[]; const bar=rest.indexOf("|"); if(bar>=0){ forms=rest.slice(bar+1).split(",").map(x=>x.trim().toLowerCase()).filter(Boolean); rest=rest.slice(0,bar); }
    const pt=rest.trim();
    if(!DICT[w]) DICT[w]={pt}; else if(!DICT[w].lemma) DICT[w].pt = DICT[w].pt;   // primeira definição direta vence
    forms.forEach(f=>{ if(!DICT[f]) DICT[f]={pt, lemma:w}; const last=f.split(" ").pop(); if(last!==f && !DICT[last]) DICT[last]={pt, lemma:w}; });   // "me acuesto" também registra "acuesto"
  });
  Object.keys(DICT).forEach(k=>{ const n=strip(k); if(!DICTN[n]) DICTN[n]=k; });
})();
function dictLookup(raw){
  const w0=(raw||"").toLowerCase().replace(/[^a-záéíóúñüàèòçï-]/g,"").replace(/^-+|-+$/g,""); if(!w0) return null;
  const tryW = w => { if(DICT[w]) return {w, ...DICT[w]}; const n=DICTN[strip(w)]; if(n) return {w:n, ...DICT[n]}; return null; };
  const cands=[w0];
  if(w0.length>3){
    if(/es$/.test(w0)) cands.push(w0.slice(0,-2), w0.slice(0,-2)+"e");                 // plurais
    if(/s$/.test(w0)) cands.push(w0.slice(0,-1));
    if(/a$/.test(w0)) cands.push(w0.slice(0,-1)+"o");                                   // feminino
    if(/as$/.test(w0)) cands.push(w0.slice(0,-2)+"o", w0.slice(0,-2)+"a");
    if(/os$/.test(w0)) cands.push(w0.slice(0,-2)+"o");
    if(/mente$/.test(w0)) cands.push(w0.slice(0,-5), w0.slice(0,-5).replace(/a$/,"o"));  // advérbios
    if(/(ísimo|ísima|ísimos|ísimas)$/.test(w0)) cands.push(w0.replace(/(ísimo|ísima|ísimos|ísimas)$/,"o"), w0.replace(/(ísimo|ísima|ísimos|ísimas)$/,"e"), w0.replace(/qu(ísimo|ísima)$/,"co"), w0.replace(/gu(ísimo|ísima)$/,"go"));
    if(/(ito|ita|itos|itas|illo|illa)$/.test(w0)) cands.push(w0.replace(/(ito|ita|itos|itas|illo|illa)$/,"o"), w0.replace(/(ito|ita|itos|itas|illo|illa)$/,"a"), w0.replace(/c(ito|ita)$/,""), w0.replace(/qu(ito|ita)$/,"co"));
  }
  // pronome grudado (ayúdame, pedirme, quédese, dame) e futuro (recibiré, tardará)
  if(w0.length>4){
    for(const suf of ["nos","los","las","les","me","te","se","lo","la","le"]){
      if(w0.endsWith(suf) && w0.length-suf.length>=2){ const base=w0.slice(0,-suf.length); const plain=strip(base); cands.push(base, plain, base+"r", plain+"r", plain.replace(/a$/,"ar"), plain.replace(/e$/,"ar")); }
    }
    const fut=w0.match(/^(.*?r)(é|ás|á|emos|éis|án)$/); if(fut) cands.push(fut[1]);
  }
  // condicional e futuro com raiz irregular (podría, tendré, habría…) e imperfeito de subjuntivo (tuviera, hubiese, fuéramos…)
  if(w0.length>4){
    const IRR={podr:"poder",tendr:"tener",habr:"haber",har:"hacer",sabr:"saber",saldr:"salir",vendr:"venir",dir:"decir",pondr:"poner",querr:"querer",cabr:"caber",valdr:"valer"};
    const c1=w0.match(/^(.+?)(ía|ías|íamos|íais|ían|é|ás|á|emos|éis|án)$/); if(c1){ const st=c1[1]; if(IRR[st]) cands.push(IRR[st]); if(/r$/.test(st)) cands.push(st); }
    const PRET={tuv:"tener",hub:"haber",hic:"hacer",pud:"poder",pus:"poner",dij:"decir",quis:"querer",vin:"venir",fu:"ser",estuv:"estar",sup:"saber",anduv:"andar",cup:"caber",traj:"traer",produj:"producir",condu:"conducir",di:"dar",vi:"ver"};
    const c2=w0.match(/^(.+?)(iera|ieras|iéramos|ierais|ieran|iese|ieses|iésemos|iesen|era|eras|éramos|eran|ese|eses|ésemos|esen|ara|aras|áramos|arais|aran|ase|ases|ásemos|asen)$/);
    if(c2){ const st=c2[1], e=c2[2]; if(PRET[st]) cands.push(PRET[st]); if(st==="fu") cands.push("ir"); if(/^(ara|aras|áramos|arais|aran|ase|ases|ásemos|asen)$/.test(e)) cands.push(st+"ar"); else { cands.push(st+"er", st+"ir"); if(/y$/.test(st)) cands.push(st.slice(0,-1)+"er", st.slice(0,-1)+"ir"); } }
    const c3=w0.match(/^(.+?)(asteis|isteis|áis|éis|ad|ed|id|aos|eos|íos)$/); if(c3){ const st=c3[1]; cands.push(st+"ar", st+"er", st+"ir"); }
    const c4=w0.match(/^(.+?)(á|ié|yé)ndo(?:me|te|se|nos|lo|la|los|las|le|les)+$/); if(c4){ const st=c4[1]; cands.push(st+"ar", st+"er", st+"ir"); }   // buscándola, diciéndome
  }
  // formas verbais regulares → infinitivo (gerúndio, particípio, pretérito, imperfeito, presente)
  if(w0.length>4){
    const V=(re, ...ends)=>{ const m=w0.match(re); if(m) ends.forEach(e=>cands.push(m[1]+e)); };
    V(/^(.+)ando$/,"ar"); V(/^(.+)iendo$/,"er","ir"); V(/^(.+)yendo$/,"er","ir");
    V(/^(.+)ad[oa]s?$/,"ar"); V(/^(.+)id[oa]s?$/,"er","ir");
    V(/^(.+)aron$/,"ar"); V(/^(.+)ieron$/,"er","ir"); V(/^(.+)ó$/,"ar"); V(/^(.+)ió$/,"er","ir"); V(/^(.+)aste$/,"ar"); V(/^(.+)iste$/,"er","ir"); V(/^(.+)é$/,"ar"); V(/^(.+)í$/,"er","ir");
    V(/^(.+)aba[ns]?$/,"ar"); V(/^(.+)ábamos$/,"ar"); V(/^(.+)ía[ns]?$/,"er","ir"); V(/^(.+)íamos$/,"er","ir");
    V(/^(.+)an$/,"ar"); V(/^(.+)en$/,"er","ir"); V(/^(.+)amos$/,"ar"); V(/^(.+)emos$/,"er"); V(/^(.+)imos$/,"ir"); V(/^(.+)áis$/,"ar"); V(/^(.+)éis$/,"er"); V(/^(.+)ís$/,"ir");
    V(/^(.+)a$/,"ar"); V(/^(.+)e$/,"er","ir"); V(/^(.+)o$/,"ar","er","ir"); V(/^(.+)as$/,"ar"); V(/^(.+)es$/,"er","ir");
  }
  for(const c of cands){ const hit=tryW(c); if(hit){ let note=""; if(hit.lemma) note=`forma de ${hit.lemma}`; else if(c!==w0) note=`de ${hit.w}`; return {w:w0, pt:hit.pt, note, lemma:hit.lemma||hit.w}; } }
  return null;
}
/* envolve cada palavra em <span class="w"> para ficar clicável */
function W(t){ return String(t==null?"":t).split(/([A-Za-zÁÉÍÓÚÑÜáéíóúñüÀÈÒÇÏàèòçï]+(?:-[A-Za-z]+)?)/).map((p,i)=> i%2 ? `<span class="w">${h(p)}</span>` : h(p)).join(""); }
function Wi(html){ return String(html).replace(/<i>([^<]*)<\/i>/g, (m,inner)=>`<i>${W(inner)}</i>`); }
let SAMPLE=null, sampleTried=false;
async function getSample(){ if(sampleTried) return SAMPLE; sampleTried=true; try{ if(window.claude && typeof window.claude.use==="function") SAMPLE=await window.claude.use("sample"); }catch(e){ SAMPLE=null; } return SAMPLE; }
let dicTimer=null;
function showDict(word, context){
  const el=$("#dic"); const hit=dictLookup(word);
  const inDrill = !$("#drill").hidden;
  el.className = "dic"+(inDrill?" hi":"");
  const wr = `https://www.wordreference.com/espt/${encodeURIComponent(word.toLowerCase())}`;
  el.innerHTML = `<button class="dx" data-act="dicclose" aria-label="Fechar">${ICON.x}</button>
    <div class="dw">${h(word)}${sayBtn(word)}</div>
    ${hit ? `<div class="dpt">${h(hit.pt)}</div>${hit.note?`<div class="dnote">${h(hit.note)}</div>`:""}`
          : `<div class="dpt" style="opacity:.8">Essa não está no meu dicionário.</div>`}
    <div class="drow">${!hit ? `<button data-act="asklola" data-w="${h(word)}" data-ctx="${h(context||"")}" id="asklola" hidden>Perguntar à Lola</button>` : ""}<a href="${wr}" target="_blank" rel="noopener">Ver no WordReference ↗</a>${hit && hit.lemma && hit.lemma!==word.toLowerCase() ? `<button data-act="dictword" data-w="${h(hit.lemma)}">${h(hit.lemma)}</button>`:""}</div>`;
  el.hidden=false;
  if(!hit) getSample().then(sm=>{ const b=$("#asklola"); if(sm && b) b.hidden=false; });
  clearTimeout(dicTimer);
}
function hideDict(){ $("#dic").hidden=true; }
async function askLola(word, ctx){
  const sm=await getSample(); const b=$("#asklola"); if(!sm) return;

function keyOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function numOf(key){ const [y,m,d]=key.split("-").map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5); }
function keyFromNum(n){ const d=new Date(n*864e5); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`; }
const todayKey = () => keyOf(new Date());
const todayN = () => numOf(todayKey());
const MES = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
function fmtShort(n){ const k=keyFromNum(n).split("-"); const m=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][+k[1]-1]; return `${+k[2]} ${m}`; }

    if(n){ alert("Progresso trazido do endereço antigo ("+n+" itens). O app vai abrir com ele."); }
    location.replace(location.pathname+location.search); throw new Error("migrando");
  }catch(e){ if(e && e.message==="migrando") return; alert("Não consegui ler os dados do endereço antigo: "+(e&&e.message||e)); }
})();

  const id="p"+Date.now().toString(36); PR.list.push({id,name}); saveProfiles();
  const st=Object.assign(defaults(), {trip:S.trip, dest:S.dest, start:S.start, name});
  try{ localStorage.setItem(stateKey(id), JSON.stringify(st)); }catch(e){}
  return id;
}
function weekBounds(offset){ const t=todayN(); const dow=new Date(t*864e5).getUTCDay(); const mon=t-((dow+6)%7)+offset*7; return [mon, mon+6]; }
function xpOfLog(log, from, to){ let x=0; Object.entries(log||{}).forEach(([k,l])=>{ const n=numOf(k); if(n>=from && n<=to) x+=(l.n||0)*3+(l.r||0)*2+(l.q||0)+(l.s||0)*2; }); return x; }
function stateOf(id){ return id===PR.active ? S : (loadState(stateKey(id)) || defaults()); }
function weekXp(pf, offset){ const [a,b]=weekBounds(offset||0); return pf.remote ? ((pf.weeks||{})[a]||0) : xpOfLog(stateOf(pf.id).log,a,b); }
function ranking(offset){ return PR.list.map(pf=>({...pf, xp:weekXp(pf,offset||0)})).sort((x,y)=>y.xp-x.xp); }
const locals = () => PR.list.filter(x=>!x.remote);
function trophies(){
  const t={}; PR.list.forEach(pf=>t[pf.id]=0);
  const states=locals().map(pf=>stateOf(pf.id));
  const remoteFirst=PR.list.filter(x=>x.remote).flatMap(x=>Object.keys(x.weeks||{}).map(Number));
  const first=Math.min(...states.map(st=>numOf(st.start)), ...remoteFirst, todayN());
  const weeks=Math.min(60, Math.ceil((weekBounds(0)[0]-first)/7));
  for(let i=1;i<=weeks;i++){ const rk=ranking(-i); if(rk[0].xp>0 && (rk.length<2 || rk[0].xp>rk[1].xp)) t[rk[0].id]++; }
  return t;
}
function save(){ S.updatedAt = Date.now(); persistLocal(); scheduleRemote(); }
/* Placar por link: cada pessoa compartilha o seu; quem abre o link vê o ranking atualizado */
function b64e(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64d(t){ t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4) t+="="; return JSON.parse(decodeURIComponent(escape(atob(t)))); }
function myScore(){ const weeks={}; for(let i=0;i<12;i++){ const [a]=weekBounds(-i); const x=xpOfLog(S.log,a,a+6); if(x) weeks[a]=x; } return {v:1,id:PR.uid,name:me().name,weeks,streak:streak(),xp:xp(),t:Date.now()}; }
function myLink(){ return APP_URL+"#inv="+b64e(myScore()); }
function receiveScore(d){
  if(!d || d.v!==1 || !d.id || !d.name) return false;
  if(d.id===PR.uid) { toast("Esse é o seu próprio placar."); return false; }
  let pf=PR.list.find(x=>x.id===d.id);

  Object.assign(pf,{name:String(d.name).slice(0,20), weeks:d.weeks||{}, streak:d.streak||0, xp:d.xp||0, updated:d.t||Date.now()});
  saveProfiles(); return true;
}
function parseInvite(text){ const m=String(text||"").match(/inv=([A-Za-z0-9_-]+)/); if(!m) return null; try{ return b64d(m[1]); }catch(e){ return null; } }
async function sharePlacar(){
