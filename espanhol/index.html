/* Backup completo (todos os perfis deste celular) num link: abrir o link restaura tudo */
function packState(st){
  const cards=Object.entries(st.cards||{}).map(([id,c])=>`${id}.${c.b}.${c.d-20000}`).join(";");
  const log=Object.entries(st.log||{}).map(([k,l])=>`${numOf(k)-20000}:${l.n||0},${l.r||0},${l.q||0},${l.s||0},${l.c||0},${l.e||0}`).join(";");
  return {n:st.name,st:st.start,tr:st.trip,de:st.dest,da:st.daily,ra:st.rate,so:st.sound?1:0,un:st.unlocked,mi:Object.keys(st.missions||{}).filter(k=>st.missions[k]).join(","),ba:Object.keys(st.badges||{}).filter(k=>st.badges[k]).join(","),cards,log,u:st.updatedAt||0};
}
function unpackState(x){
  const st=defaults();
  Object.assign(st,{name:x.n||"",start:x.st||st.start,trip:x.tr||st.trip,dest:x.de||st.dest,daily:x.da||st.daily,rate:x.ra||st.rate,sound:x.so!==0,unlocked:x.un||1,updatedAt:x.u||Date.now()});
  (x.mi||"").split(",").filter(Boolean).forEach(k=>st.missions[k]=true);
  (x.ba||"").split(",").filter(Boolean).forEach(k=>st.badges[k]=true);
  (x.cards||"").split(";").filter(Boolean).forEach(e=>{ const [id,b,d]=e.split("."); st.cards[id]={b:+b,d:+d+20000}; });
  (x.log||"").split(";").filter(Boolean).forEach(e=>{ const [k,v]=e.split(":"); const [n,r,q,s2,c,ee]=v.split(",").map(Number); st.log[keyFromNum(+k+20000)]={n,r,q,s:s2,c,e:ee}; });
  return normalize(st);
}
function fullBackup(){ persistLocal(); const states={}; locals().forEach(pf=>{ states[pf.id]=packState(stateOf(pf.id)); }); return {v:2,t:Date.now(),uid:PR.uid,active:PR.active,list:PR.list,duels:PR.duels,viaje:PR.viaje,states}; }
function backupLink(){ return APP_URL+"#bk="+b64e(fullBackup()); }
function restoreBackup(bk){
  if(!bk || bk.v!==2 || !bk.states) return false;
  persistLocal(); clearTimeout(remoteTimer);
  PR={list:bk.list||[], active:bk.active, duels:bk.duels||{}, viaje:bk.viaje||PR.viaje, uid:bk.uid||PR.uid, onboarded:true, lastBackup:Date.now()};
  if(!PR.list.length) return false;
  Object.entries(bk.states).forEach(([id,x])=>{ try{ localStorage.setItem(stateKey(id), JSON.stringify(unpackState(x))); }catch(e){} });
  if(!PR.list.some(x=>x.id===PR.active && !x.remote)) PR.active=(locals()[0]||PR.list[0]).id;
  /* A viagem (V) é um apelido fixo para PR.viaje: troca o conteúdo no lugar, senão a tela Viaje continua mostrando a rota antiga até reabrir o app. */
  if(bk.viaje && bk.viaje!==V){ Object.keys(V).forEach(k=>delete V[k]); Object.assign(V, bk.viaje); } PR.viaje=V; if(!V.custom) V.custom={}; if(!Array.isArray(V.dests)||!V.dests.length) V.dests=["madrid","sevilla","barcelona"]; if(!V.days) V.days={};
  Object.entries(V.custom).forEach(([id,c])=>{ if(!DEST[id]) registerCustom(id, c.name); });
  saveProfiles(); S=loadState(stateKey(PR.active))||defaults(); applyLevel(); remote=null; openWeek=null; renderAll(); connectRemote(); return true;
}
function parseBackup(text){ const m=String(text||"").match(/bk=([A-Za-z0-9_-]+)/); if(m){ try{ return b64d(m[1]); }catch(e){ return null; } } try{ const o=JSON.parse(text); if(o && o.cards) return {v:2,legacy:o}; if(o && o.v===2) return o; }catch(e){} return null; }
async function shareBackup(){
  const url=backupLink(); PR.lastBackup=Date.now(); saveProfiles();
  const text="Backup do Rumbo a España. Guarde esta mensagem: para recuperar o progresso, basta abrir o link no celular. ";
  try{ if(navigator.share){ await navigator.share({title:"Backup Rumbo a España", text, url}); toast("Backup salvo. Guarde a mensagem!"); return; } }catch(e){ if(e && e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(text+url); toast("Link de backup copiado. Cole nas Notas ou mande para você mesma."); }
  catch(e){ const ta=$("#s-io"); if(ta){ ta.value=url; ta.select(); } toast("Copie o link do campo abaixo."); }
}
function backupAge(){ return PR.lastBackup ? Math.floor((Date.now()-PR.lastBackup)/864e5) : null; }
function removeProfile(id){
  const pf=PR.list.find(x=>x.id===id); if(!pf) return;
  if(!pf.remote && locals().length<=1){ toast("Precisa ficar ao menos um perfil neste celular."); return; }
  if(id===PR.active){ const other=locals().find(x=>x.id!==id); if(other) switchProfile(other.id); }
  PR.list=PR.list.filter(x=>x.id!==id); delete PR.duels[id]; saveProfiles();
  if(!pf.remote){ try{ localStorage.removeItem(stateKey(id)); }catch(e){} }
  renderAll();
}
function agoText(ts){ const d=Math.floor((Date.now()-ts)/864e5); return d<=0?"hoje":d===1?"ontem":`há ${d} dias`; }

let remote = null, remoteTimer = null, writing = false, again = false;
function scheduleRemote(){ if(!remote) return; clearTimeout(remoteTimer); remoteTimer = setTimeout(flushRemote, 1500); }
async function flushRemote(){
  if(!remote) return;
  if(writing){ again = true; return; }
  writing = true;
  try{ await remote.set({state:S}); setSync(true); }
  catch(e){ const c=e && e.code; if(c==="unavailable"){ setTimeout(scheduleRemote, 4000+Math.random()*2000); } else { remote=null; setSync(false); } }
  writing = false;
  if(again){ again=false; flushRemote(); }
}
function setSync(on){ const el=document.getElementById("b-sync"); el.classList.toggle("on",on); el.lastElementChild.textContent = on ? "sincronizado na conta" : "salvo neste aparelho"; const g=document.getElementById("s-sync"); if(g) g.textContent = on ? "Progresso sincronizado na sua conta Claude." : "Progresso salvo neste aparelho."; }
async function connectRemote(){
  try{
    if(!window.claude || typeof window.claude.use!=="function") return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    const ref = db.doc("data/users/"+uid+"/"+(PR.active==="p1"?"progress":"progress-"+PR.active));
    const snap = await ref.get();
    const r = snap.exists ? snap.data() : null;
    const rs = r && r.state;
    remote = ref; setSync(true);
    if(rs && (rs.updatedAt||0) > (S.updatedAt||0)){ S = normalize(JSON.parse(JSON.stringify(rs))); persistLocal(); renderAll(); }
    else if((S.updatedAt||0) > ((rs && rs.updatedAt)||0)){ flushRemote(); }
  }catch(e){ remote=null; }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && remoteTimer){ clearTimeout(remoteTimer); flushRemote(); } });

/* ============================================================
   LÓGICA DE ESTUDO
   ============================================================ */
/* Cronograma: 14 temas distribuídos entre o início do estudo e a viagem (ou nas semanas definidas) */
/* Começo do estudo no nível atual: o básico usa S.start; os outros níveis guardam a própria data em S.startL */
function startKey(){ return (!isBasic() && S.startL && S.startL[S.level]) || S.start; }
function planWeeks(){ if(S.planWeeks) return Math.max(2, Math.min(52, S.planWeeks)); const w=Math.round((numOf(S.trip)-numOf(startKey()))/7); return Math.max(2, Math.min(52, w||14)); }
function planDays(){ return planWeeks()*7; }
const MONTH_OPTS=[[1,"1 mês"],[2,"2 meses"],[3,"3 meses"],[4,"4 meses"],[6,"6 meses"],[9,"9 meses"],[12,"1 ano"]];
function goalTime(){ return S.goal==="time"; }
function goalDa(){ return goalTime() ? "do fim do plano" : "da viagem"; }     // "antes da viagem" / "antes do fim do plano"
function goalA(){ return goalTime() ? "o fim do plano" : "a viagem"; }        // "até a viagem" / "até o fim do plano"
/* Define o plano por tempo de estudo: N meses a partir do começo */
function setGoalTime(months, start){ S.goal="time"; S.start=start||S.start||todayKey(); const weeks=Math.max(2, Math.min(52, Math.round(months*4.345))); S.planWeeks=weeks; S.trip=keyFromNum(numOf(S.start)+weeks*7); S.months=months; }
function weekStart(n){ return numOf(startKey())+Math.floor((n-1)*planDays()/TOTAL_WEEKS); }         // dia em que o tema n começa
function weekEnd(n){ return n>=TOTAL_WEEKS ? numOf(startKey())+planDays()-1 : weekStart(n+1)-1; }    // último dia do tema n
function weekByDate(){ const t=todayN(); let u=1; for(let n=1;n<=TOTAL_WEEKS;n++){ if(weekStart(n)<=t) u=n; } return u; }
function unlockedLv(){ return isBasic() ? (S.unlocked||1) : ((S.unl||{})[S.level]||1); }
function setUnlocked(n){ if(isBasic()) S.unlocked=Math.max(S.unlocked||1,n); else { S.unl=S.unl||{}; S.unl[S.level]=Math.max(S.unl[S.level]||1,n); } }
function curWeek(){ return Math.min(TOTAL_WEEKS, Math.max(weekByDate(), unlockedLv())); }
function calWeek(){ return Math.max(1, Math.floor((todayN()-numOf(startKey()))/7)+1); }
const MIN_OPTS=[5,10,15,20,30];
function dailyFor(minutes){ return ({5:4,10:8,15:12,20:16,30:24})[minutes] || Math.max(3, Math.round(minutes*0.8)); }
/* Viabilidade: dá para ver as frases do plano antes da viagem com a meta atual? */
function feasibility(){
  const left = CARDS.filter(c=>c.tier===1 && !S.cards[c.id]).length;
  const days = Math.max(1, numOf(S.trip)-todayN());
  const need = Math.ceil(left/Math.max(1, Math.round(days*6/7)));   // conta ~6 dias de estudo por semana
  const reach = Math.min(TOTAL_WEEKS, Math.max(1, Math.floor((S.daily*Math.round(days*6/7))/Math.max(1,left)*(TOTAL_WEEKS-curWeek()+1))+curWeek()-1));
  return {left, days, need, ok: S.daily>=need, reach};
}
function unlockedCards(){ const w=curWeek(); return CARDS.filter(c=>c.week<=w); }
function seenCards(){ return CARDS.filter(c=>S.cards[c.id]); }
function newCards(){ const l=S.log[todayKey()]; const extraOn = l && (l.x||0)>0; const u=unlockedCards().filter(c=>!S.cards[c.id]); return [...u.filter(c=>c.tier===1), ...(extraOn ? u.filter(c=>c.tier===2) : [])]; }
function newTier(t){ return unlockedCards().filter(c=>!S.cards[c.id] && c.tier===t).length; }
function dueCards(){ const t=todayN(); return CARDS.filter(c=>S.cards[c.id] && S.cards[c.id].d<=t).sort((a,b)=>S.cards[a.id].d-S.cards[b.id].d); }
function logToday(){ const k=todayKey(); if(!S.log[k]) S.log[k]={n:0,r:0,q:0,s:0}; if(!S.log[k].s) S.log[k].s=0; return S.log[k]; }
const activity = l => l ? (l.n||0)+(l.r||0)+(l.q||0)+(l.s||0)+(l.c||0)+(l.e||0) : 0;
function todaySteps(){
  const l=S.log[todayKey()]||{}; const nw=Math.min(newLeftToday(), newCards().length), due=dueCards().length;
  const m=S.minutes||15;
  const all=[
    {id:"session", t:"Sessão", d: (nw===0&&due===0) ? "Frases de hoje em dia" : (due===0 && (l.n||0)>=S.daily) ? `Meta feita · extra: ${nw} novas à espera` : `${nw} novas · ${due} revisões · ≈ ${sessionMinutes(nw,due)} min`, done: due===0 && (nw===0 || (l.n||0)>=S.daily), started:(l.n||0)+(l.r||0)>0, act:"session", go:"Começar"},
    (()=>{ const pl=convPlan(); const w=WEEKS[pl.week-1]; const name = `${w.title} · ${pl.label}`;
      return {id:"conv", t:"Conversa falada", d:(l.c||0)>0 ? `${name} · feita` : `${name}${(l.cl||0)>0?` · ${l.cl} ${l.cl===1?"fala feita":"falas feitas"}`:""} · ≈ 3 min`, done:(l.c||0)>0, started:(l.cl||0)>0, act:"conv", plan:true, go:(l.cl||0)>0?"Continuar":"Conversar"}; })(),
    (todayN()%2===0 ? {id:"build", t:"Montar frases", d:"Coloque as palavras na ordem · 8 frases · ≈ 3 min", done:(l.b||0)>0, act:"build", go:"Montar"}
                    : {id:"build", t:"Fórmulas", d:"Molde + encaixe: diga a frase inteira · 10 frases · ≈ 3 min", done:(l.b||0)>0, act:"frames", go:"Montar"}),
    MIC ? {id:"eco", t:"Pronúncia no microfone", d:"5 palavras e 7 frases · ≈ 3 min", done:(l.e||0)>0, act:"pron", go:"Falar"}
        : {id:"eco", t:"Eco: repetir imitando", d:"10 frases · ≈ 2 min", done:(l.e||0)>0, act:"eco", go:"Repetir"},
    (()=>{ const r=readOfDay(); return {id:"read", t:"Leitura", d: r ? `${DEST[r.id]?DEST[r.id].name:r.id}: ${r.L.t} · ${r.L.q.length} perguntas · ≈ 4 min` : "Texto em espanhol com perguntas", done:(l.rd||0)>0, act:"read", go:"Ler"}; })(),
    {id:"quiz", t:"Quiz", d:"10 perguntas, com 'o que responder?' · ≈ 3 min", done:(l.q||0)>=10, act:"quiz", go:"Jogar"},
    {id:"listen", t:"Só de ouvido", d:"10 frases: ouça e escolha o sentido · ≈ 3 min", done:(l.li||0)>0, act:"listen", go:"Ouvir"},
    {id:"write", t:"Escrita", d:"Escreva a frase em espanhol · 8 frases · ≈ 3 min", done:(l.w||0)>0, act:"write", go:"Escrever"},
    {id:"extra", t:"Frases extra", d:`+${S.daily} além da meta · ≈ ${sessionMinutes(S.daily,0)} min`, done:(l.x||0)>0 && (l.n||0)>=S.daily*2, act:"extra", go:"Mais"}
  ];
  const n = m<=5 ? 1 : m<=10 ? 2 : m<=15 ? 4 : m<=20 ? 5 : 7;
  /* As etapas do meio giram a cada dia (montar, pronúncia, leitura, quiz), para a rotina não ser sempre igual */
  const mid=all.slice(2,8); const k=todayN()%mid.length; const rot=mid.slice(k).concat(mid.slice(0,k));
  return [all[0], all[1], ...rot, all[8]].slice(0,n);
}
/* Plano da conversa do dia: evolui ao longo da semana. Dias 1 e 2: guiada (conversa 1, conversa 2). Dias 3 e 4: de memória (o português só aparece se pedir).
   Dias 5 e 6: papéis trocados (você faz o garçom, a recepcionista…). Dia 7: revisão de uma conversa de tema anterior. Sem conversa 2, a sequência se adapta. */
function convPlan(){
  const w=WEEKS[curWeek()-1]; const day=Math.max(0, todayN()-weekStart(w.n));
  const list=[{which:"A", t:"conversa 1"}]; if(w.dialogB) list.push({which:"B", t:"conversa 2"}); (w.more||[]).forEach((d,i)=>list.push({which:"C"+(i+1), t:d.t}));
  const n=list.length; const pick=list[day % n]; const round=Math.floor(day / n);        // 1ª volta: guiada; 2ª: de memória; 3ª: papéis trocados; depois alterna
  const mode = round===0 ? 0 : (round%2===1 ? 1 : 2);
  const dg=dialogOf(w, pick.which); const other = mode===2 ? ([...new Set(dg.lines.map(l=>l[0]))].find(x=>x!==dg.me) || null) : null;
  return {week:w.n, which:pick.which, role:other, hard: mode===1, review:false, t:pick.t, label: mode===0 ? pick.t : pick.t+(mode===1 ? " · de memória" : " · papéis trocados")};
}
/* Qual conversa do tema de hoje praticar: alterna entre a 1ª e a 2ª conforme a menos feita. */
function todayConv(){ const w=WEEKS[curWeek()-1]; if(!w.dialogB) return "A"; const cv=S.conv||{}; const a=cv[lvKey(w.n+"A")]||0, b=cv[lvKey(w.n+"B")]||0;
  if(a+b===0){ const tk=todayKey(); const past=Object.keys(S.log).some(k=>k!==tk && k>=keyFromNum(weekStart(w.n)) && (S.log[k].c||0)>0); if(past){ S.conv=S.conv||{}; S.conv[lvKey(w.n+"A")]=1; save(); return "B"; } }
  return b < a ? "B" : "A"; }
function spokenTotal(){ return Object.values(S.log).reduce((a,l)=>a+(l.s||0),0); }
function sessionMinutes(nw, due){ return Math.max(1, Math.round((nw*2.2 + due*0.6)/2)); }
function newLeftToday(){ const l=S.log[todayKey()]; return Math.max(0, S.daily + (l ? (l.x||0) : 0) - (l ? l.n : 0)); }
function streak(){ let n=todayN(), s=0; const active=k=>activity(S.log[k])>0;
  if(!active(keyFromNum(n))) n--; while(active(keyFromNum(n))){ s++; n--; } return s; }
function weekProgress(w){ const cs=CARDS.filter(c=>c.week===w && c.tier===1); const seen=cs.filter(c=>S.cards[c.id]).length; return {seen,total:cs.length}; }
function learnedCount(){ return CARDS.filter(c=>S.cards[c.id] && S.cards[c.id].b>=1).length; }
function masteredCount(){ return CARDS.filter(c=>S.cards[c.id] && S.cards[c.id].b>=4).length; }
function xp(){ let x=0; Object.values(S.log).forEach(l=>{ x+=(l.n||0)*3+(l.r||0)*2+(l.q||0)+(l.s||0)*2; }); return x + Object.values(S.missions).filter(Boolean).length*25; }
function level(){ const x=xp(); let i=0; while(i+1<LEVELS.length && x>=LEVELS[i+1][0]) i++; return {i, title:LEVELS[i][1], x, lo:LEVELS[i][0], hi:LEVELS[i+1]?LEVELS[i+1][0]:null}; }
const BADGES = [
 {id:"primer",  t:"Primer paso",    d:"Primeira sessão feita",        g:"1",   ok:()=>seenCards().length>0},
 {id:"voz",     t:"Sin vergüenza",  d:"20 falas em voz alta",          g:"20",  ok:()=>spokenTotal()>=20},
 {id:"racha3",  t:"Tres seguidos",  d:"3 dias seguidos",               g:"3",   ok:()=>streak()>=3},
 {id:"semana",  t:"Semana redonda", d:"Todas as frases de uma semana", g:"★",   ok:()=>WEEKS.some(w=>{const p=weekProgress(w.n);return p.seen===p.total;})},
 {id:"mision",  t:"Con misión",     d:"3 missões cumpridas",           g:"M",   ok:()=>Object.values(S.missions).filter(Boolean).length>=3},
 {id:"racha7",  t:"Una semana",     d:"7 dias seguidos",               g:"7",   ok:()=>streak()>=7},
 {id:"charla",  t:"Charlatán",      d:"100 falas em voz alta",         g:"100", ok:()=>spokenTotal()>=100},
 {id:"cien",    t:"Cien frases",    d:"100 frases aprendidas",         g:"ñ",   ok:()=>learnedCount()>=100},
 {id:"racha30", t:"Un mes",         d:"30 dias seguidos",              g:"30",  ok:()=>streak()>=30}
];
function checkBadges(){
  const fresh = BADGES.filter(b=>!S.badges[b.id] && b.ok());
  if(!fresh.length) return;
  fresh.forEach(b=>S.badges[b.id]=true); save(); renderHoje();
  toast(`Conquista: ${fresh[0].t}. ${fresh[0].d}!`); confetti(); tone("done");

  stopAudio(); try{ if(AUDIO.el){ AUDIO.el.pause(); if(AUDIO.el.src){ AUDIO.el.removeAttribute("src"); AUDIO.el.load(); } } }catch(e){}
  try{ if(AC){ AC.close(); AC=null; } }catch(e){}
  if(IS_IOS && canSpeak){ try{ const u=new SpeechSynthesisUtterance("a"); u.volume=0; u.rate=10; u.lang="es-ES"; speechSynthesis.speak(u); }catch(e){} }
}
function hear(onPartial, maxMs){
  return new Promise((res,rej)=>{
    let done=false, best="", alts=[], r=null, tSilence=null, restarting=false; const t0=Date.now(); const limit=maxMs||20000;
    const finish = v => { if(done) return; done=true; clearTimeout(tAll); clearTimeout(tSilence); try{ if(r) r.stop(); }catch(e){} REC=null; MIC_END=Date.now(); res(v); };
    const fail = c => { if(done) return; done=true; clearTimeout(tAll); clearTimeout(tSilence); REC=null; MIC_END=Date.now(); rej(c); };
    const armSilence = () => { clearTimeout(tSilence); tSilence=setTimeout(()=>{ try{ r.stop(); }catch(e){} setTimeout(()=>finish({alts: alts.length?alts:(best?[best]:[]), partial:true}), 600); }, 2500); };
    const timeLeft = () => Date.now()-t0 < limit-2500;
    const start = () => {
      try{ r=new SR(); }catch(e){ return fail("start"); }
      REC=r; r.lang="es-ES"; r.interimResults=true; r.maxAlternatives=3; r.continuous=false;
      r.onresult=e=>{
        let txt=""; for(let i=0;i<e.results.length;i++){ txt += e.results[i][0].transcript+" "; }
        best=txt.trim(); if(onPartial && best) onPartial(best);
        const last=e.results[e.results.length-1];
        if(last.isFinal){ alts=Array.from(last).map(a=>a.transcript.trim()).filter(Boolean); if(!alts.length && best) alts=[best]; finish({alts, partial:false}); }
        else armSilence();
      };
      r.onerror=e=>{ if(done) return;
        if(e.error==="no-speech" && !best && !r.userStop && timeLeft()){ restarting=true; setTimeout(()=>{ if(!done) start(); }, 120); return; }
        if((e.error==="audio-capture" || e.error==="aborted" || e.error==="network") && !r.retried && Date.now()-t0<1500 && !best){ r.retried=true; restarting=true; try{ r.abort(); }catch(x){} setTimeout(()=>{ if(!done){ const rr=start(); if(rr) rr.retried=true; } }, 400); return; }
        if(e.error==="no-speech" || e.error==="aborted"){ finish({alts: best?[best]:[], partial:true}); } else fail(e.error||"error"); };
      r.onend=()=>{ if(done) return; if(restarting){ restarting=false; return; }
        if(!best && !r.userStop && timeLeft()){ start(); return; }
        finish({alts: alts.length?alts:(best?[best]:[]), partial:true}); };
      r.onaudiostart=()=>{ if(onPartial) onPartial(""); };
      micPrep();
      try{ speechSynthesis.cancel(); r.start(); }catch(e){ fail("start"); }
      MIC_TRIES++; return r;
    };
    const tAll=setTimeout(()=>{ try{ if(r) r.stop(); }catch(e){} setTimeout(()=>finish({alts: best?[best]:[], partial:true, timeout:true}), 800); }, limit);
    start();
  });
}
function micHint(code){
  if(code==="not-allowed" || code==="service-not-allowed") return "O celular bloqueou o microfone para este app. iPhone: se o app foi adicionado à Tela de Início, procure-o em Ajustes › Apps (ou role a lista de Ajustes até o nome Rumbo) › Microfone; no Safari, Ajustes › Apps › Safari › Microfone › Permitir. Android: toque no cadeado da barra de endereço › Permissões › Microfone.";
  if(code==="network") return "O reconhecimento de voz precisa de internet neste aparelho. Conecte e tente de novo.";
  if(code==="language-not-supported") return "Este aparelho não tem reconhecimento de espanhol. No Android, instale 'Espanhol (Espanha)' em Configurações › Idioma › Digitação por voz.";
  if(code==="audio-capture") return "Nenhum microfone encontrado. Feche outros apps que estejam usando o microfone.";
  if(code==="start") return "Não consegui iniciar o reconhecimento de voz neste navegador.";
  return "O reconhecimento de voz não respondeu. Tente de novo, mais perto do celular.";
}
async function micTest(){
  const out=$("#mic-test-out"); if(!out) return;
  if(!SR){ out.textContent="Este navegador não oferece reconhecimento de voz. Use Chrome (Android) ou Safari (iPhone)."; return; }
  out.textContent="Ouvindo… diga: hola, buenos días"; out.className="verdict mid";
  try{
    const r = await hear(t=>{ if(t) out.textContent="Ouvindo: "+t; }, 7000);
    if(r.alts.length){ out.textContent="Funcionou! Entendi: “"+r.alts[0]+"”"; out.className="verdict ok"; MIC=true; }
    else { out.textContent="Não ouvi nada em 7 segundos. Verifique a permissão do microfone e fale mais perto."; out.className="verdict bad"; }
  }catch(code){ out.textContent="Erro: "+code+" ("+(IS_IOS?(STANDALONE?"app da tela inicial do iPhone":"Safari do iPhone"):"navegador")+", áudio gravado "+(AUDIO.on?"ligado":"desligado")+"). "+micHint(code); out.className="verdict bad"; }
}
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j), cur=[]; for(let i=1;i<=m;i++){ cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; } return prev[n]; }
function wordsOf(x){ return norm(cleanSpeech(x)).replace(/[¿?¡!.,;:…«»"]/g," ").split(/\s+/).filter(Boolean); }
function wordMatch(a,b){ if(a===b) return true; const L=Math.max(a.length,b.length); return L>=4 && lev(a,b)/L<=0.34; }
/* devolve {score, marks:[{w,ok}]} comparando a frase-alvo com as alternativas ouvidas */
function pronScore(alts, target){
  const T=wordsOf(target); const tw=target.replace(/[¿?¡!.,;:…«»"]/g," ").split(/\s+/).filter(Boolean);
  let best={score:0, marks:tw.map(w=>({w,ok:false}))};
  alts.forEach(a=>{ const A=wordsOf(a).slice(); const marks=T.map((t,i)=>{ const k=A.findIndex(x=>wordMatch(x,t)); if(k>=0){ A.splice(k,1); return {w:tw[i]||t, ok:true}; } return {w:tw[i]||t, ok:false}; }); const sc=marks.filter(m=>m.ok).length/Math.max(1,T.length); if(sc>best.score || (sc===best.score && !best.marks.length)) best={score:sc, marks}; });
  return best;
}
function similarity(said, target){ const w=x=>norm(x).replace(/[¿?¡!.,;:…]/g," ").split(/\s+/).filter(Boolean); const T=w(cleanSpeech(target)); const A=new Set(w(said)); return T.length ? T.filter(x=>A.has(x)).length/T.length : 0; }
function speakDialog(lines, week, which){ if(!canSpeak) return; const who=[...new Set(lines.map(l=>l[0]))]; const L=lines.slice(); const w=WEEKS[(week||curWeek())-1]; const me = which==="B" ? (w.meB||"A") : (w.me||"A"); const pg=partnerWho(week||curWeek(), which); stopAudio(); try{ speechSynthesis.cancel(); }catch(e){}
  const next=()=>{ const l=L.shift(); if(!l) return; const g = l[0]===me ? "" : pg; if(hasAudio(l[1], g)) playAudio(l[1], false, g, null, ()=>setTimeout(next, 350)); else { const u=utter(l[1], g?1.25:0.9); u.onend=()=>setTimeout(next, 350); warmVoice(true); speechSynthesis.speak(u); } };
  next(); }

let phraseFilter = "all", phraseQuery = "", kitQ = "", kitQFocus = false;

/* Tradutor: online (MyMemory) + palavra por palavra offline + leitura de foto (tesseract.js) */
let TR = {dir: (localStorage.getItem("rumbo-trdir")||"es"), text:"", timer:null, seq:0};
function trGloss(text){
  if(TR.dir!=="es") return "";
  const words=text.split(/([A-Za-zÁÉÍÓÚÑÜáéíóúñü]+)/).filter((p,i)=>i%2);
  const seen=new Set(); const out=[];
  words.forEach(w=>{ const k=w.toLowerCase(); if(seen.has(k)) return; seen.add(k); const hit=dictLookup(w); out.push(`<span class="w" data-w="${h(w)}"><b>${h(w)}</b> ${hit?h(hit.pt.split(";")[0]):"?"}</span>`); });
  return out.length ? `<div class="gloss">${out.join("")}</div>` : "";
}
function trInput(v){
  TR.text=v; const out=$("#tr-out"), st=$("#tr-st"), gl=$("#tr-gloss"); if(!out) return;
  const ga=$("#tr-google"); if(ga) ga.href="https://translate.google.com/?sl="+(TR.dir==="es"?"es":"pt")+"&tl="+(TR.dir==="es"?"pt":"es")+"&op=translate&text="+encodeURIComponent(v);
  gl.innerHTML = trGloss(v);
  if(!v.trim()){ out.textContent=""; st.textContent="Escreva algo, ou toque em Ler foto."; return; }
  clearTimeout(TR.timer); st.textContent="Traduzindo…";
  TR.timer=setTimeout(async()=>{
    const seq=++TR.seq; const pair = TR.dir==="es" ? "es|pt-BR" : "pt-BR|es";
    try{
      const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(v.slice(0,500))+"&langpair="+pair+"&de=rumbo@example.com");
      const j=await r.json(); if(seq!==TR.seq) return;
      const t=(j.responseData && j.responseData.translatedText) || "";
      if(j.responseStatus===200 && t){ out.textContent=t; st.textContent="Tradução automática (MyMemory). Pode ter imprecisões; a lista palavra por palavra ajuda a conferir."; }
      else { out.textContent=""; st.textContent="O serviço de tradução não respondeu"+(j.responseDetails?": "+j.responseDetails:"")+". Use o dicionário abaixo ou o Google Tradutor."; }
    }catch(e){ if(seq!==TR.seq) return; out.textContent=""; st.textContent = window.claude ? "Dentro do Claude a tradução online não está disponível; use o app instalado. Abaixo, palavra por palavra pelo dicionário." : "Sem internet para traduzir a frase inteira. Abaixo, palavra por palavra pelo dicionário."; }
  }, 550);
}
async function trOcr(file){
  const st=$("#tr-st"); if(!file || !st) return;
  st.textContent="Carregando leitor de texto (primeira vez demora, ~20 MB)…";
  try{
    if(!window.Tesseract){ await new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"; sc.onload=res; sc.onerror=()=>rej(new Error("não carregou")); document.head.appendChild(sc); }); }
    const res = await Tesseract.recognize(file, "spa", { logger: m=>{ if(m.status==="recognizing text") st.textContent=`Lendo a imagem… ${Math.round((m.progress||0)*100)}%`; else if(m.status) st.textContent=`${m.status}…`; } });

const DOW_PT=["dom","seg","ter","qua","qui","sex","sáb"];
function fmtDay(n){ const d=new Date(n*864e5); return `${DOW_PT[d.getUTCDay()]} ${fmtShort(n)}`; }
function cityDates(){ let start=numOf(S.trip); const out={}; V.dests.filter(id=>DEST[id]).forEach(id=>{ const n=V.days[id]||1; out[id]=[start, start+n-1]; start+=n; }); return out; }
function moveDest(id, dir){ const i=V.dests.indexOf(id); const j=i+dir; if(i<0||j<0||j>=V.dests.length) return; [V.dests[i],V.dests[j]]=[V.dests[j],V.dests[i]]; }
function setArrival(id){ if(!DEST[id]) return; if(!V.days[id]) V.days[id]=DEST[id].stay.ideal; V.dests=[id, ...V.dests.filter(x=>x!==id)]; if(V.dep!==id && V.dests.includes(V.dep)) V.dests=[...V.dests.filter(x=>x!==V.dep), V.dep]; V.city=id; }
function setDeparture(id){ if(!DEST[id]) return; V.dep=id; if(!V.days[id]) V.days[id]=DEST[id].stay.ideal; if(id!==V.dests[0]) V.dests=[...V.dests.filter(x=>x!==id), id]; }
function arrivalId(){ return V.dests[0]; }
function availableDays(){ if(!V.ret || !/^\d{4}-\d{2}-\d{2}$/.test(V.ret)) return null; return numOf(V.ret)-numOf(S.trip); }
function autoDays(){
  const av=availableDays(); const sel=V.dests.filter(id=>DEST[id]); if(!av || av<sel.length) return false;
  const ideal=sel.map(id=>DEST[id].stay.ideal); const sum=ideal.reduce((a,b)=>a+b,0);
  let days=sel.map((id,i)=>Math.max(1, Math.floor(av*ideal[i]/sum))); let left=av-days.reduce((a,b)=>a+b,0);
  // sobra vai para as cidades com maior "ideal", uma a uma
  const order=sel.map((id,i)=>i).sort((a,b)=>ideal[b]-ideal[a]); let k=0; while(left>0){ days[order[k%order.length]]++; left--; k++; }
  sel.forEach((id,i)=>V.days[id]=Math.min(14,days[i])); return true;
}
function toggleMiddle(id){
  if(id===arrivalId() || id===V.dep) return;
  if(V.dests.includes(id)) V.dests=V.dests.filter(x=>x!==id);
  else { if(!V.days[id]) V.days[id]=DEST[id].stay.ideal; const endIdx = (V.dep!==arrivalId() && V.dests.includes(V.dep)) ? V.dests.length-1 : V.dests.length; V.dests.splice(endIdx,0,id); }

}

function viajeSearch(q){
  const n = norm(q.trim()); if(n.length<2) return [];
  const hit = (...xs) => xs.some(x => x && norm(String(x).replace(/<[^>]+>/g,"")).includes(n));
  const out=[];
  Object.entries(DEST).forEach(([id,d])=>{
    const cityHit = hit(d.name, d.region);
    d.must.forEach(m=>{ if(cityHit || hit(m.t, m.area, m.tip, m.price)) out.push({city:d.name, id, kind:"Imperdível", m}); });
    d.daytrips.forEach(m=>{ if(cityHit || hit(m.t, m.how, m.tip)) out.push({city:d.name, id, kind:"Bate e volta", m}); });
    curioList(id).forEach(c=>{ if(hit(c.t)) out.push({city:d.name, id, kind:"Curiosidade", text:c.t}); });
    foodList(id).forEach(f=>{ if(cityHit || hit(f.t, f.d, f.w, f.k)) out.push({city:d.name, id, kind:"Comida local", text:`<b>${h(f.t)}</b> (${f.k}). ${f.d} <span class="muted">Onde: ${h(f.w)}</span>`}); });
    if(d.custom && AUTO[id]) (AUTO[id].trips||[]).forEach(tr=>{ if(cityHit || hit(tr.t, tr.desc)) out.push({city:d.name, id, kind:"Bate e volta (automático)", m:{t:tr.t, how:"a partir de "+d.name, link:autoTripLink(d,tr), tip:tr.desc, book:"h", pay:1}}); });
    if(d.custom && AUTO[id]) AUTO[id].items.forEach(it=>{ if(cityHit || hit(it.t, it.desc, it.addr)) out.push({city:d.name, id, kind:"Guia automático", m:{t:it.t, how:it.kind+(it.addr?" · "+it.addr:""), link:autoItemLink(d,it), tip:it.desc, book:"h", pay:1, price:it.price}}); });

  });
  return out.slice(0,40);
}

function openDrill(d){ D = d; D.i = 0; D.score = 0; D.revealed = false; D.total = d.items.length; D.misses = []; D.fixing = false; D.fixed = 0; $("#drill").hidden = false; document.body.style.overflow="hidden"; drawDrill(); }

/* Transcrição curta das falas anteriores da conversa (até 3), como um chat */
function convPos(it){ const L=D.items.filter(x=>!x.fix && (x.t==="mine"||x.t==="theirs")); return `${L.indexOf(it)+1} de ${L.length}`; }
function convLog(it){ if(it.fix){ return it.prev?`<div class="ctx">${h(it.prev[0])}: “${h(it.prev[1])}”</div>`:""; } const L=D.items.filter(x=>!x.fix && (x.t==="mine"||x.t==="theirs")); const i=L.indexOf(it); const prev=L.slice(Math.max(0,i-3), i); if(!prev.length) return "";
  return `<div class="dlg convlog">${prev.map(x=>`<div class="msg${x.t==="mine"?" r":""}"><div class="bub"><div class="who">${h(x.line[0])}</div><div class="es">${h(x.line[1])}</div></div></div>`).join("")}</div>`; }
/* Lacunas: cada palavra da frase em espanhol vira um botão; tocar mostra a palavra e a pronuncia.
   pre = palavras já visíveis (ex.: o molde da fórmula). */
function blanksHtml(it, es, pre){
  const toks = es.split(/\s+/).filter(Boolean); it.hints = it.hints || []; const preSet = new Set((pre||[]).map(w=>norm(w.replace(/[¿¡?!.,;:…]/g,""))));
  const core = w => w.replace(/[¿¡?!.,;:…]/g,"");
  return `<div class="blanks">${toks.map((w,i)=>{ const on = it.hints.includes(i); const isPre = !on && preSet.has(norm(core(w))); const lead=(w.match(/^[¿¡]+/)||[""])[0], trail=(w.match(/[?!.,;:…]+$/)||[""])[0];
    return `<span class="bwrap">${lead?`<span class="bp">${h(lead)}</span>`:""}<button class="bw${on?" on":isPre?" pre":""}" data-act="bw" data-i="${i}" aria-label="${on||isPre?h(core(w)):"palavra "+(i+1)}" style="min-width:${Math.max(30, core(w).length*11)}px">${on||isPre?h(core(w)):""}</button>${trail?`<span class="bp">${h(trail)}</span>`:""}</span>`; }).join("")}</div>
  <p class="small muted">Toque numa lacuna para ver e ouvir a palavra. Sem pressa: toque em ${MIC?"Falar":"Já falei"} só quando estiver pronta.</p>`;
}
function drillTop(){ const pct = D.items.length ? Math.round(100*D.i/D.items.length) : 100;
  return `<div class="top"><button class="x" data-act="closedrill" aria-label="Fechar">${ICON.x}</button><div class="meter"><span style="width:${pct}%"></span></div><span class="count">${Math.min(D.i+1,D.items.length)}/${D.items.length}</span></div>`; }

function startSession(){
  const fresh = newCards().slice(0, newLeftToday());
  const due = shuffle(dueCards().slice(0,40));
  const items = [];
  for(let i=0;i<fresh.length;i+=4){ const chunk=fresh.slice(i,i+4); chunk.forEach(c=>items.push({t:"learn",c})); shuffle(chunk).forEach(c=>items.push({t:"test",c,dir:Math.random()<.8?"pt":"es"})); }
  due.forEach(c=>items.push({t:"test",c,dir:Math.random()<.8?"pt":"es"}));
  if(!items.length){ toast("Nada pendente hoje. Faça um quiz!"); return; }
  openDrill({mode:"session", items, revealed:false, retries:{}});
}
function quizPool(week){
  let pool = week ? CARDS.filter(c=>c.week===week) : seenCards();
  if(pool.length < 6) pool = unlockedCards();
  return pool;
}
function replyItems(n, week){
  const ds = allDialogs(week||curWeek()); const pairs=[];
  ds.forEach(d=>{ for(let i=0;i<d.lines.length-1;i++) pairs.push({q:d.lines[i], a:d.lines[i+1], d}); });
  if(pairs.length<4) return [];
  const allAnswers = pairs.map(p=>p.a[1]);
  return shuffle(pairs).slice(0,n).map(p=>{
    const opts=[p.a[1]]; for(const x of shuffle(allAnswers)){ if(opts.length>=4) break; if(!opts.includes(x) && x!==p.q[1]) opts.push(x); }
    const c={es:p.q[1], pt:p.q[2], ans:p.a[1], ansPt:p.a[2], note:`Resposta: ${p.a[1]} (${p.a[2]})`, week:p.d.week, kind:"v"};
    return {t:"mc", c, dir:"reply", field:"ans", opts:shuffle(opts), picked:null};
  });
}
function startQuiz(kind, week){
  const pool = quizPool(week);
  const nReply = kind==="quiz" ? 4 : 0;
  const rep = replyItems(nReply, week);
  const qs = shuffle(pool).slice(0,10-rep.length).map(c=>{
    const dir = kind==="listen" ? "listen" : (Math.random()<.5 ? "es" : "pt");
    const field = dir==="pt" ? "es" : "pt";
    const sameW = CARDS.filter(x=>x.id!==c.id && x.kind===c.kind && x[field]!==c[field]);
    const near = shuffle(sameW.filter(x=>Math.abs(x.week-c.week)<=1));
    const far = shuffle(sameW);
    const opts=[c[field]]; for(const x of [...near,...far]){ if(opts.length>=4) break; if(!opts.includes(x[field])) opts.push(x[field]); }
    return {t:"mc", c, dir, field, opts:shuffle(opts), picked:null};
  });
  openDrill({mode:kind, items:shuffle([...qs, ...rep])});
}

/* Montar frases: ordenar as palavras de uma frase já vista, com 2 ou 3 palavras a mais para confundir */
const tokES = t => t.replace(/[¿¡?!.,;:…«»"]/g,"").split(/\s+/).filter(Boolean);
function startBuild(){
  let pool = seenCards(); if(pool.length<8) pool = unlockedCards();
  pool = pool.filter(c=>!/[\/…()]/.test(c.es) && tokES(c.es).length>=3 && tokES(c.es).length<=9);
  if(pool.length<4){ toast("Veja mais frases na sessão primeiro."); return; }
  const items = shuffle(pool).slice(0,8).map(c=>{
    const target = tokES(c.es); const low = new Set(target.map(w=>norm(w)));
    const others = shuffle(pool.filter(x=>x.id!==c.id && Math.abs(x.week-c.week)<=2).flatMap(x=>tokES(x.es))).filter(w=>!low.has(norm(w)) && w.length>1);
    const extra=[]; for(const w of others){ if(extra.length>=(target.length>=6?3:2)) break; if(!extra.some(e=>norm(e)===norm(w))) extra.push(w); }
    return {t:"build", c, target, bank:shuffle([...target, ...extra]), seq:[], res:null};
  });
  openDrill({mode:"build", items});
}
/* Fórmulas: molde + encaixe → diga a frase inteira */
function startFrames(n){
  const N=n||10, nPeg=Math.max(1, Math.round(N*0.3));
  const fr = shuffle(FRAMES.flatMap(fr=>fr.x.map(x=>({fr,x})))).slice(0,N-nPeg).map(({fr,x})=>({t:"frame", fr, es:fr.es.replace("{x}",x[0]), pt:fr.pt.replace("{x}",x[1]), txt:fr.es.replace("{x}",x[0])}));
  const pg = shuffle(PEGADINHAS.flatMap(pg=>pg.ex.map(x=>({pg,x})))).slice(0,nPeg).map(({pg,x})=>({t:"frame", fr:{es:pg.t, pt:"pegadinha", g:pg.r + (pg.bad?` <span style="color:var(--bad)"><b>Armadilha:</b> ${h(pg.bad)}</span>`:"")}, peg:true, es:x[0], pt:x[1], txt:x[0]}));
  const items = shuffle([...fr, ...pg]);
  openDrill({mode:"frames", items});
}

function startWrite(){
  let pool = seenCards(); if(pool.length<6) pool = unlockedCards();
  pool = pool.filter(c=>!/[\/…,]/.test(c.es) && c.es.length<=36);
  if(!pool.length){ toast("Veja algumas frases primeiro."); return; }
  openDrill({mode:"write", items:shuffle(pool).slice(0,8).map(c=>({t:"write",c,answer:null}))});
}
function startConv(week, role, which, hard, label){
  const w = WEEKS[(week||curWeek())-1]; const dg=dialogOf(w, which); which=dg.which;
  const lines = dg.lines; const def = dg.me; const me = role || def;
  openDrill({mode:"conv", week:w.n, which, me, hard:!!hard, swap: me!==def, label:label||"", items:lines.map((l,k)=>({t:l[0]===me?"mine":"theirs", line:l, prev:k?lines[k-1]:null}))});
}
/* Ao terminar a última fala da conversa (antes da correção), registra a conversa como feita no dia. */
function convMaybeDone(){ if(!D || D.mode!=="conv" || D.convDone) return; const left=D.items.slice(D.i).some(x=>!x.fix && (x.t==="mine"||x.t==="theirs")); if(left) return;
  D.convDone=true; D.logged=true; const lg=logToday(); lg.c=(lg.c||0)+1; lg.cw=D.which; S.conv=S.conv||{}; S.conv[lvKey(D.week+D.which)]=(S.conv[lvKey(D.week+D.which)]||0)+1; save(); }

const READ={playing:false,k:-1,run:0};
function allSpeakables(){
  const out=new Map(); const add=(t,m)=>{ if(!t) return; const c=cleanSpeech(String(t)).trim(); if(!c) return; const k=audioKey(c); const cur=out.get(k)||{k,t:c,m:false}; if(m) cur.m=true; out.set(k,cur); };
  SURV_CARDS.forEach(c=>add(c.es));
  Object.values(COURSE).forEach(L=>{
    L.cards.forEach(c=>add(c.es));
    L.weeks.forEach(w=>{ (w.dialog||[]).forEach(l=>add(l[1],true)); (w.dialogB||[]).forEach(l=>add(l[1],true)); (w.more||[]).forEach(d=>d.lines.forEach(l=>add(l[1],true))); });
    L.frames.forEach(fr=>fr.x.forEach(x=>add(fr.es.replace("{x}",x[0])))); L.peg.forEach(pg=>pg.ex.forEach(x=>add(x[0])));
    Object.values(L.lect).forEach(T=>T.forEach(x=>{ sentences(x.txt).forEach(sn=>add(sn)); x.q.forEach(q=>add(q.q)); }));
  });
  SOUNDS.forEach(x=>(x.ex||[]).forEach(e=>add(e)));
  add("Hola, soy Elvira. Hablaré contigo en las conversaciones."); add("Hola, soy Álvaro. Hablaré contigo en las conversaciones.", true);
  return [...out.values()];
}
function readAll(){ return Object.keys(LECTURAS).flatMap(id=>LECTURAS[id].map((L,i)=>({id,i,L}))); }
function readOfDay(){ const ids=(V.dests||[]).filter(id=>LECTURAS[id]); const pool = ids.length ? ids.flatMap(id=>LECTURAS[id].map((L,i)=>({id,i,L}))) : readAll(); if(!pool.length) return null; const done=S.reads||{}; const fresh=pool.filter(x=>!done[lvKey(x.id+":"+x.i)]); const P=fresh.length?fresh:pool; return P[todayN()%P.length]; }
function sentences(txt){ return (txt.match(/[^.!?…]+[.!?…]+["»]?\s*|[^.!?…]+$/g)||[txt]).map(x=>x.trim()).filter(Boolean); }
function readStop(){ READ.playing=false; READ.k=-1; READ.run=(READ.run||0)+1; stopAudio(); try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll(".sent.on").forEach(x=>x.classList.remove("on")); const b=document.querySelector('[data-act="readplay"]:not([data-slow])'); if(b) b.innerHTML=ICON.say+" Ouvir"; }
function readPlay(sents, slow){ if(!canSpeak) return; readStop(); READ.playing=true; const run=++READ.run; try{ speechSynthesis.resume(); }catch(e){} SPEAK_LAST=Date.now();
  const b=document.querySelector('[data-act="readplay"]:not([data-slow])'); if(b) b.innerHTML=ICON.say+" Parar";
  const mark=k=>{ READ.k=k; document.querySelectorAll(".sent").forEach(x=>x.classList.toggle("on", +x.dataset.k===k)); const el=document.querySelector(`.sent[data-k="${k}"]`); if(el) el.scrollIntoView({block:"center",behavior:"smooth"}); };
  const go=k=>{ if(!READ.playing || run!==READ.run) return; if(k>=sents.length){ readStop(); return; }
    speak(sents[k], slow, "", ()=>mark(k), ()=>setTimeout(()=>go(k+1), 250)); };
  go(0); }
function startRead(id, i){ const L=(LECTURAS[id]||[])[i||0]; if(!L){ toast("Ainda não há leitura para esta cidade."); return; } const sents=sentences(L.txt);
  const qs=L.q.map((q,n)=>({t:"mc", c:{es:q.q, pt:"", ans:q.o[q.a], note:""}, dir:"readq", field:"ans", opts:shuffle(q.o.slice()), picked:null, sents, qn:n+1}));

function startPron(){
  if(!MIC){ toast(window.claude ? "O microfone não funciona dentro do Claude. Use o app instalado." : "Este navegador não permite microfone. Vou abrir o Eco."); startEco(); return; }
  const w=curWeek(); let pool=seenCards(); if(pool.length<8) pool=unlockedCards();
  const soundWords = shuffle(SOUNDS.flatMap(x=>x.ex.filter(e=>!/\s/.test(e)))).slice(0,3);
  const cardWords = shuffle([...new Set(pool.flatMap(c=>wordsOf(c.es)).filter(x=>x.length>=4))]).slice(0,4).map(x=>{ const c=pool.find(c=>wordsOf(c.es).includes(x)); const orig=c ? c.es.replace(/[¿?¡!.,;:…]/g," ").split(/\s+/).find(o=>norm(o)===x) : x; return orig||x; });
  const words=[...new Set([...soundWords, ...cardWords])].slice(0,5).map(t=>({t:"pron",kind:"word",txt:t,tries:0}));
  const phrases=shuffle(pool.filter(c=>!/[\/…]/.test(c.es) && c.es.split(" ").length>=2 && c.es.length<=40)).slice(0,7).map(c=>({t:"pron",kind:"phrase",txt:c.es,pt:c.pt,tries:0}));

function heardHtml(it){ if(!it.heard) return ""; const sc=it.heard.score; const cls=sc>=.8?"ok":sc>=.5?"mid":"bad";
  if(!it.heard.msg) it.heard.msg = sc>=.8 ? rnd(PRAISE) : rnd(CHEER);
  return `<div class="verdict ${cls}">${h(it.heard.msg[0])} ${sc>=.8?"":sc>=.5?"Quase lá.":"Não ficou claro."} <span class="muted" style="font-weight:400">Entendi: “${h(it.heard.text)}”</span></div>`; }

function heardLive(txt){ let el=$("#heard-live"); if(!el){ const flash=$("#drill .flash"); if(!flash) return; el=document.createElement("div"); el.id="heard-live"; el.className="verdict mid"; flash.appendChild(el); } el.textContent = txt ? "Ouvindo: "+txt : "Ouvindo… pense com calma, você tem 20 segundos"; }
function mcItem(c, dir, pool){
  const field = dir==="pt" ? "es" : "pt";
  const same = CARDS.filter(x=>x.id!==c.id && x.kind===c.kind && x[field]!==c[field]);
  const near = shuffle(same.filter(x=>Math.abs(x.week-c.week)<=1)), far = shuffle(same);
  const opts=[c[field]]; for(const x of [...near,...far]){ if(opts.length>=4) break; if(!opts.includes(x[field])) opts.push(x[field]); }
  return {t:"mc", c, dir, field, opts:shuffle(opts), picked:null};
}
function startDuel(){
  if(locals().length<2){ toast("O duelo é para duas pessoas no mesmo celular. Adicione um perfil em Pasajeros."); openPasajeros(); return; }
  const others = locals().filter(x=>x.id!==PR.active);

  let pool = unlockedCards(); if(pool.length<8) pool = CARDS.filter(c=>c.week<=2);
  const qs = shuffle(pool).slice(0,10);
  const items=[]; qs.forEach((c,i)=>{ const who=players[i%2]; items.push({t:"turn", who}); const it=mcItem(c, Math.random()<.5?"es":"pt", pool); it.who=who; items.push(it); });

}

      : `<span class="kind">${fx}${it.dir==="es"?"O que significa?":"Como se diz em espanhol?"}</span><div class="big ${it.dir==="pt"?"pt":""}">${h(it.dir==="es"?c.es:c.pt)}</div>${it.dir==="es"?sayBtn(c.es):""}`;

function drawDone(){
  if(D.mode==="duel") return drawDuelDone();
  if(D.mode==="conv") convMaybeDone();
  if(!D.logged){ D.logged=true; const lg=logToday(); if(D.mode==="read"){ lg.rd=(lg.rd||0)+1; S.reads=S.reads||{}; S.reads[lvKey(D.city+":"+D.ri)]=todayN(); save(); } if(D.mode==="build"||D.mode==="frames"){ lg.b=(lg.b||0)+1; save(); } if(D.mode==="eco"||D.mode==="sons"||D.mode==="pron"){ lg.e=(lg.e||0)+1; save(); } if(D.mode==="listen"){ lg.li=(lg.li||0)+1; save(); } if(D.mode==="write"){ lg.w=(lg.w||0)+1; save(); } }
  const good = D.mode==="session" || D.mode==="conv" || D.mode==="eco" || D.mode==="sons" || D.score>=D.total*0.7;
  const pr = good ? rnd(PRAISE) : rnd(CHEER);
  confetti_if(good); tone("done");
  const M = {
    session:["¡Olé!","Sessão concluída!",`${D.fixed ? `${D.fixed} ${D.fixed===1?"frase revista":"frases revistas"} na correção; elas voltam amanhã. ` : ""}Agora pratique a conversa de hoje. Sequência: ${streak()} ${streak()===1?"dia":"dias"}.`],
    conv:["¡Genial!","Conversa completa!", D.fixed ? `${D.fixed} ${D.fixed===1?"fala revista":"falas revistas"} na correção. Amanhã vem ${D.week && WEEKS[D.week-1].dialogB?"a outra conversa deste tema":"a conversa do próximo tema"}.` : "Tudo de primeira. Se quiser, troque de papel e faça a outra pessoa."],
    eco:["¡Bien!","Eco concluído","Quanto mais você repete em voz alta, mais natural fica."],
    read:["¡Bien leído!",`${D.score} de ${D.items.filter(x=>x.t==="mc"&&!x.fix).length} perguntas`,`${D.fixed ? `${D.fixed} ${D.fixed===1?"pergunta revista":"perguntas revistas"} na correção. ` : ""}Ler em espanhol sobre o lugar aonde você vai fixa vocabulário de verdade. Amanhã vem outro texto.`],
    build:["¡Muy bien!",`${D.score} de ${D.total} na ordem certa`,`${D.fixed ? `${D.fixed} ${D.fixed===1?"frase revista":"frases revistas"} na correção. ` : ""}Montar a frase é o passo entre decorar e falar: amanhã vêm outras.`],
    frames:["¡Eso es!",`${D.score} de ${D.total} fórmulas`,`${D.fixed ? `${D.fixed} ${D.fixed===1?"revista":"revistas"} na correção. ` : ""}Com 18 moldes e o encaixe certo você diz quase tudo que precisa numa viagem.`],
    pron:["¡Qué bien suena!","Pronúncia treinada",`${D.firstTry} de ${D.total} entendidas de primeira. As que falharam voltam amanhã.`],
    sons:["¡Perfecto!","Sons revisados","Volte aqui sempre que algum som travar."]
  }[D.mode];
  const [, msg0, sub] = M || ["", `${D.score} de ${D.total}`, (D.fixed ? `${D.fixed} ${D.fixed===1?"erro revisto":"erros revistos"} na correção. ` : "") + (good ? "Você está mandando bem." : "Os erros voltam na sua próxima sessão de revisão.")];
  const big = pr[0], msg = msg0 ? `${msg0} · ${pr[1]}` : pr[1];
  const btns = D.mode==="session" ? `<button class="btn saff wide" data-act="conv" data-which="${todayConv()}">Praticar a conversa de hoje</button>`
    : D.mode==="conv" ? `<button class="btn saff wide" data-act="convswap">Trocar de papel</button>${WEEKS[D.week-1].dialogB ? `<button class="btn soft wide" data-act="conv" data-week="${D.week}" data-which="${D.which==="B"?"A":"B"}">${D.which==="B"?"Conversa 1 desta semana":"2ª conversa desta semana"}</button>`:""}<button class="btn ghost wide" data-act="again">De novo</button>`
    : D.mode==="read" ? `<button class="btn saff wide" data-act="read" data-pick="1">Outra leitura</button><button class="btn ghost wide" data-act="again">Ler de novo</button>`
    : `<button class="btn soft wide" data-act="again">Mais uma rodada</button>`;
  $("#drill").innerHTML = drillTop() + `<div class="stage"><div class="done-box"><div class="av cheer" style="width:84px;height:84px">${LOLA}</div><div class="big">${h(big)}</div>${msg?`<p style="font-size:18px;font-weight:700">${h(msg)}</p>`:""}<p class="muted">${h(sub)}</p></div></div><div class="actions">${btns}<button class="btn ghost wide" data-act="closedrill">Voltar</button></div>`;
}
function confetti_if(ok){ if(ok) confetti(); }
function drawDuelDone(){
  const [a,b]=D.players, sa=D.dscore[a.id], sb=D.dscore[b.id];
  const tie = sa===sb; const win = sa>sb?a:b;
  if(!tie && !D.recorded){ D.recorded=true; PR.duels[win.id]=(PR.duels[win.id]||0)+1; saveProfiles(); }
  confetti(); tone("done"); const pr=rnd(PRAISE);
  $("#drill").innerHTML = drillTop() + `<div class="stage"><div class="done-box"><div class="av cheer" style="width:84px;height:84px">${tie?LOLA:faceOf(win.id)}</div><div class="big">${tie?"¡Empate!":h(pr[0])}</div><p style="font-size:18px;font-weight:700">${tie?"Ninguém leva desta vez":`${h(win.name)} ganha o duelo!`}</p><p class="muted">${h(a.name)} ${sa} × ${sb} ${h(b.name)}${tie?"":" · "+h(pr[1])}</p></div></div><div class="actions"><button class="btn saff wide" data-act="again">Revanche</button><button class="btn ghost wide" data-act="closedrill">Voltar</button></div>`;
}
function checkWrite(){
  const it = D.items[D.i]; const v = ($("#ans")||{}).value || "";
  const strip = s => s.toLowerCase().replace(/[¿?¡!.,;:]/g,"").replace(/\s+/g," ").trim();
  const exact = strip(v)===strip(it.c.es);
  const loose = norm(strip(v))===norm(strip(it.c.es));
  it.answer = {v: exact?"ok":loose?"mid":"bad"}; tone(exact||loose?"ok":"bad");
  if((exact||loose) && !it.fix) D.score++;
  if(!exact && !loose){ if(S.cards[it.c.id]) S.cards[it.c.id].d = todayN(); miss(it); }
  logToday().q++; save();
  drawDrill();
}

{ n:4, me:"A", pv:["f","m"], title:"Planes para mañana", sub:"Futuro, intenções e condições",
  tip:`<h3>Falar do futuro: três jeitos</h3>
  <p><b>1. Ir a + infinitivo</b> é o mais usado para planos: <i>Mañana <b>vamos a visitar</b> el Alcázar.</i></p>
  <p><b>2. Futuro simples</b> (-é, -ás, -á, -emos, -éis, -án no infinitivo): <i>Mañana <b>lloverá</b>. Te <b>llamaré</b>.</i> Irregulares: <b>tendré, haré, podré, saldré, vendré, diré, pondré, sabré, querré, habrá</b>.</p>
  <p><b>3. Presente</b> com hora marcada: <i>El tren <b>sale</b> a las ocho.</i></p>
  <p>O futuro também expressa <b>suposição</b>: <i>¿Dónde está Juan? — <b>Estará</b> en el bar.</i> (deve estar).</p>
  <p>Condição real: <b>si + presente, futuro</b>: <i>Si <b>hace</b> sol, <b>iremos</b> a la playa.</i> Nunca "si hará".</p>`,
  mission:"Monte o plano de um dia da viagem falando: seis frases com 'vamos a', 'iremos' e 'si hace…'.",
  dialog:[["A","¿Qué planes tenéis para mañana?","Que planos vocês têm para amanhã?"],["B","Por la mañana vamos a subir a la Giralda y después iremos al Alcázar.","De manhã vamos subir na Giralda e depois iremos ao Alcázar."],["A","Comprad las entradas hoy, que mañana habrá cola.","Comprem os ingressos hoje, que amanhã vai ter fila."],["B","Buena idea. ¿Y por la tarde qué nos recomiendas?","Boa ideia. E de tarde, o que você recomenda?"],["A","Si hace buen tiempo, cruzad a Triana y tomad algo junto al río.","Se o tempo estiver bom, atravessem para Triana e tomem algo junto ao rio."],["B","¿Y si llueve?","E se chover?"],["A","Entonces el Museo de Bellas Artes. Es precioso y casi nunca está lleno.","Então o Museu de Belas Artes. É lindo e quase nunca está cheio."]],
  meB:"A", dialogB:[["A","Hola, quería cambiar mi reserva. Llegaré un día más tarde.","Olá, queria mudar minha reserva. Vou chegar um dia mais tarde."],["B","Sin problema. ¿Qué día llegará entonces?","Sem problema. Que dia vai chegar então?"],["A","El jueves 11, por la noche. ¿Tendré que pagar algo?","Quinta, dia 11, à noite. Vou ter que pagar alguma coisa?"],["B","No, solo le cobraremos las noches que se quede.","Não, só vamos cobrar as noites em que ficar."],["A","Perfecto. ¿Podré hacer el check-in a las once de la noche?","Perfeito. Vou poder fazer o check-in às onze da noite?"],["B","Sí, la recepción está abierta las veinticuatro horas.","Sim, a recepção fica aberta vinte e quatro horas."],["A","Estupendo. Entonces nos veremos el jueves.","Ótimo. Então nos vemos na quinta."]],

   ["¿Qué planes tenéis para mañana?","Que planos vocês têm para amanhã?"],["Vamos a subir a la Giralda","Vamos subir na Giralda"],["Después iremos al Alcázar","Depois iremos ao Alcázar"],["Mañana habrá mucha cola","Amanhã vai ter muita fila"],["Compraré las entradas por internet","Vou comprar os ingressos pela internet"],

{ n:5, me:"A", pv:["f","m"], title:"Tengo un problema", sub:"Reclamar e resolver com educação",
  tip:`<h3>Reclamar sem brigar: condicional e fórmulas</h3>
  <p>O espanhol da Espanha é direto, mas a reclamação boa começa suave. Use o <b>condicional</b> (-ía): <i>¿<b>Podría</b> cambiarme de habitación? Me <b>gustaría</b> hablar con el encargado.</i></p>
  <p>Estrutura que funciona: <b>problema + pedido + agradecimento</b>. <i>Perdone, la ducha no funciona. ¿Podrían enviar a alguien? Gracias.</i></p>
  <p>Vocabulário de problema: <b>no funciona</b> (não funciona), <b>está roto/rota</b> (quebrado), <b>falta</b> (falta), <b>hay un error en la cuenta</b>, <b>me han cobrado de más</b>, <b>no es lo que pedí</b>.</p>
  <p>Para insistir com classe: <i>Lo entiendo, pero…</i> · <i>¿Qué solución me pueden ofrecer?</i> · <i>Quisiera poner una reclamación</i> (quero fazer uma reclamação formal; na Espanha existe a <b>hoja de reclamaciones</b>).</p>`,
  mission:"Grave um áudio de 30 segundos reclamando educadamente de um quarto barulhento e pedindo troca.",
  dialog:[["A","Perdone, tengo un problema con la habitación. El aire acondicionado no funciona.","Com licença, tenho um problema com o quarto. O ar-condicionado não funciona."],["B","Lo siento mucho. ¿Ha probado a reiniciarlo con el mando?","Sinto muito. Tentou reiniciar com o controle?"],["A","Sí, varias veces. Y además hay mucho ruido de la calle. ¿Podría cambiarme de habitación?","Sim, várias vezes. E além disso tem muito barulho da rua. Poderia me trocar de quarto?"],["B","Déjeme ver… Tengo una interior en la cuarta planta, más tranquila.","Deixe eu ver… Tenho um interno no quarto andar, mais tranquilo."],["A","Me vendría muy bien. ¿Tiene el mismo precio?","Seria ótimo para mim. Tem o mesmo preço?"],["B","Sí, sin coste adicional. Ahora mismo le preparo la llave.","Sim, sem custo adicional. Agora mesmo preparo a chave."],["A","Muchas gracias por la rapidez.","Muito obrigada pela rapidez."]],
  meB:"A", dialogB:[["A","Disculpe, creo que hay un error en la cuenta. Nos han cobrado dos postres y solo pedimos uno.","Desculpe, acho que tem um erro na conta. Cobraram duas sobremesas e só pedimos uma."],["B","Perdone, ahora mismo lo compruebo.","Desculpe, vou conferir agora mesmo."],["A","Y el vino era de la casa, no el de la carta.","E o vinho era da casa, não o da carta."],["B","Tiene razón, ha sido un error nuestro. Le traigo la cuenta corregida.","Tem razão, foi um erro nosso. Trago a conta corrigida."],["A","Gracias. ¿Puedo pagar con tarjeta?","Obrigada. Posso pagar com cartão?"],["B","Por supuesto. Y les invito a los cafés por las molestias.","Claro. E os cafés são por nossa conta, pelo incômodo."],["A","No hacía falta, pero se lo agradezco.","Não precisava, mas agradeço."]],
  cards:[
   ["Tengo un problema con la habitación","Tenho um problema com o quarto"],["El aire acondicionado no funciona","O ar-condicionado não funciona"],["La ducha está rota","O chuveiro está quebrado"],["No hay agua caliente","Não tem água quente"],["Hay mucho ruido","Tem muito barulho"],
   ["¿Podría cambiarme de habitación?","Poderia me trocar de quarto?"],["Me gustaría hablar con el encargado","Gostaria de falar com o gerente"],["Creo que hay un error en la cuenta","Acho que tem um erro na conta"],["Me han cobrado de más","Me cobraram a mais"],["Esto no es lo que pedí","Isto não é o que pedi"],

   ["Lo entiendo, pero no es culpa mía","Entendo, mas não é culpa minha"],["Tiene razón, ha sido un error nuestro","Tem razão, foi um erro nosso"],["Le traigo la cuenta corregida","Trago a conta corrigida"],["Les invito a los cafés","Os cafés são por nossa conta"],["No hacía falta","Não precisava"],
   ["Se lo agradezco mucho","Agradeço muito","'Se lo' = a você (le) + isso (lo)."],["Quiero que me devuelvan el dinero","Quero que me devolvam o dinheiro"],["El vuelo ha salido con dos horas de retraso","O voo saiu com duas horas de atraso"],["Mi maleta ha llegado rota","Minha mala chegou quebrada"],["¿Dónde pongo la reclamación?","Onde faço a reclamação?"],["Gracias por la rapidez","Obrigada pela rapidez"]

{ n:6, me:"A", pv:["f","m"], title:"Me duele aquí", sub:"Saúde: descrever sintomas com detalhe",
  tip:`<h3>Doler, sentirse, tener: o corpo em espanhol</h3>
  <p><b>Doler</b> funciona como <i>gustar</i>: <i>me duele la cabeza</i> (singular), <i>me duelen las piernas</i> (plural). Nunca "yo duelo".</p>
  <p><b>Tener</b>: tengo fiebre, tos, náuseas, mareos, alergia, la tensión alta. <b>Estar</b>: estoy mareado, resfriado, agotado. <b>Sentirse</b>: me siento débil, me siento mejor.</p>
  <p>Desde quando: <i>¿<b>Desde cuándo</b> le duele? — <b>Desde</b> ayer. / <b>Desde hace</b> tres días. / <b>Llevo</b> dos días con fiebre.</i></p>
  <p>Na farmácia se pede conselho: <i>¿Qué me recomienda para…?</i> Com receita: <b>con receta</b>; sem: <b>sin receta</b>. O posto de saúde é o <b>centro de salud</b>; emergência, <b>urgencias</b>; o telefone é <b>112</b>.</p>`,
  mission:"Descreva em voz alta um resfriado completo: desde quando, três sintomas e o que você já tomou.",
  dialog:[["A","Buenos días. Llevo tres días con dolor de garganta y hoy me he levantado con fiebre.","Bom dia. Estou há três dias com dor de garganta e hoje acordei com febre."],["B","¿Cuánta fiebre tiene?","Quanto de febre?"],["A","Treinta y ocho y medio. Y me duele todo el cuerpo.","Trinta e oito e meio. E me dói o corpo todo."],["B","¿Tiene tos o mocos?","Tem tosse ou nariz escorrendo?"],["A","Tos seca, sobre todo por la noche. No puedo dormir.","Tosse seca, principalmente à noite. Não consigo dormir."],["B","Parece una gripe. Tome paracetamol cada ocho horas y este jarabe para la tos. Si en tres días no mejora, vaya al centro de salud.","Parece uma gripe. Tome paracetamol a cada oito horas e este xarope para a tosse. Se em três dias não melhorar, vá ao posto de saúde."],["A","¿Puedo tomarlo con el antihistamínico que ya tomo?","Posso tomar com o anti-histamínico que já tomo?"]],
  meB:"A", dialogB:[["A","Buenas, tengo cita con el médico a las once. Soy Ana Souza.","Olá, tenho consulta com o médico às onze. Sou Ana Souza."],["B","¿Me deja la tarjeta sanitaria o el seguro de viaje?","Me dá o cartão do convênio ou o seguro de viagem?"],["A","Tengo seguro de viaje. Aquí está la póliza.","Tenho seguro de viagem. Aqui está a apólice."],["B","Perfecto. Siéntese, la doctora la llamará enseguida. ¿Qué le pasa?","Perfeito. Sente-se, a doutora vai chamar em seguida. O que está sentindo?"],["A","Me caí en la calle y me duele mucho el tobillo. Está hinchado.","Caí na rua e meu tornozelo dói muito. Está inchado."],["B","¿Puede apoyar el pie?","Consegue apoiar o pé?"],["A","Un poco, pero me duele al caminar.","Um pouco, mas dói ao andar."]],

   ["Me duele la cabeza","Minha cabeça dói"],["Me duelen las piernas","Minhas pernas doem"],["Llevo tres días con dolor de garganta","Estou há três dias com dor de garganta","'Llevar + tempo + con' = estar há."],["¿Desde cuándo le duele?","Desde quando dói?"],["Desde ayer por la noche","Desde ontem à noite"],
   ["Tengo fiebre, treinta y ocho y medio","Tenho febre, trinta e oito e meio"],["Tengo tos seca","Tenho tosse seca"],["Tengo mocos","Estou com o nariz escorrendo"],["Estoy mareada","Estou tonta"],["Tengo náuseas","Estou enjoada"],

   ["Me duele al caminar","Dói ao andar"],["¿Qué me recomienda para la tos?","O que me recomenda para a tosse?"],["¿Necesito receta?","Preciso de receita?"],["Tome una cada ocho horas","Tome um a cada oito horas"],["Si no mejora, vaya al centro de salud","Se não melhorar, vá ao posto de saúde"],

{ n:7, me:"A", pv:["m","f"], title:"Yo creo que…", sub:"Opinar, concordar e discordar",
  tip:`<h3>Dar opinião e discordar com jeito</h3>
  <p>Opinar: <b>creo que</b>, <b>pienso que</b>, <b>me parece que</b>, <b>para mí</b>, <b>en mi opinión</b>. Com <b>indicativo</b> quando afirma: <i>Creo que <b>es</b> caro.</i></p>
  <p>Na negativa, o verbo que vem depois vai no <b>subjuntivo</b>: <i>No creo que <b>sea</b> caro. No me parece que <b>valga</b> la pena.</i></p>
  <p>Concordar: <i>Estoy de acuerdo. Tienes razón. Yo también lo creo. Totalmente.</i> Discordar com educação: <i>No estoy del todo de acuerdo. Yo lo veo de otra manera. Sí, pero…</i></p>
  <p>Espanhóis discutem com energia e interrompem; não é briga, é interesse. Entre na conversa com <i>Es que…</i>, <i>A ver…</i>, <i>Hombre, …</i></p>`,
  mission:"Escolha um tema (praia ou montanha, cidade grande ou pequena) e defenda sua opinião por um minuto em voz alta.",
  dialog:[["A","¿Qué te ha parecido la paella?","O que você achou da paella?"],["B","Sinceramente, un poco salada. Pero el arroz estaba en su punto.","Sinceramente, um pouco salgada. Mas o arroz estava no ponto."],["A","Yo creo que la de ayer estaba mejor.","Eu acho que a de ontem estava melhor."],["B","No estoy de acuerdo. La de ayer tenía demasiado marisco.","Não concordo. A de ontem tinha marisco demais."],["A","Hombre, para mí el marisco es lo mejor.","Ora, para mim o marisco é o melhor."],["B","Sí, pero una paella valenciana de verdad lleva pollo y conejo, no marisco.","Sim, mas uma paella valenciana de verdade leva frango e coelho, não marisco."],["A","Vale, en eso tienes razón. ¿Pedimos otra para comprobarlo?","Tá, nisso você tem razão. Pedimos outra para conferir?"]],
  meB:"B", dialogB:[["A","Yo pienso que viajar en tren es mucho mejor que en avión.","Eu acho que viajar de trem é muito melhor que de avião."],["B","Depende. Para distancias cortas sí, pero de Madrid a Lisboa no me parece que valga la pena.","Depende. Para distâncias curtas sim, mas de Madri a Lisboa não me parece que valha a pena."],["A","Es que en el tren puedes trabajar, ver el paisaje, no hay colas…","É que no trem você pode trabalhar, ver a paisagem, não tem filas…"],["B","Estoy de acuerdo en eso, pero el precio también cuenta.","Concordo nisso, mas o preço também conta."],["A","A ver, si compras con tiempo, el tren sale barato.","Olha, se compra com antecedência, o trem sai barato."],["B","Puede ser. Yo lo veo de otra manera, pero respeto tu opinión.","Pode ser. Eu vejo de outro jeito, mas respeito sua opinião."],["A","Pues probamos los dos y luego comparamos.","Então testamos os dois e depois comparamos."]],
  cards:[
   ["¿Qué te ha parecido?","O que você achou?"],["Yo creo que está muy bien","Eu acho que está muito bom"],["Me parece un poco caro","Me parece um pouco caro"],["Para mí, es el mejor barrio","Para mim, é o melhor bairro"],["En mi opinión, merece la pena","Na minha opinião, vale a pena"],
   ["No creo que sea tan difícil","Não acho que seja tão difícil","Negativa → subjuntivo (sea)."],["No me parece que valga la pena","Não me parece que valha a pena"],["Estoy de acuerdo","Concordo"],["Tienes razón","Você tem razão"],["Yo también lo creo","Eu também acho"],
   ["No estoy del todo de acuerdo","Não concordo totalmente"],["Yo lo veo de otra manera","Eu vejo de outro jeito"],["Depende","Depende"],["Sí, pero…","Sim, mas…"],["Es que no tengo tiempo","É que não tenho tempo","'Es que' introduz a justificativa."],
   ["A ver, no es tan sencillo","Olha, não é tão simples"],["Hombre, eso es exagerado","Ora, isso é exagero","'Hombre' é interjeição, serve até para mulheres."],["Puede ser","Pode ser"],["Sinceramente, no me gustó","Sinceramente, não gostei"],["La verdad es que me encantó","A verdade é que adorei"],
   ["Respeto tu opinión","Respeito sua opinião"],["¿Y tú qué opinas?","E você, o que acha?"],["Estaba en su punto","Estava no ponto"],["Tenía demasiada sal","Tinha sal demais"],["En eso tienes razón","Nisso você tem razão"],["Vale, me has convencido","Tá, você me convenceu"]
  ]},
{ n:8, me:"B", pv:["f","m"], title:"Te recomiendo que…", sub:"Conselhos e desejos: subjuntivo presente",
  tip:`<h3>Subjuntivo presente: quiero que vengas</h3>
  <p>Quando uma pessoa quer, pede, recomenda ou espera que <b>outra</b> faça algo, o segundo verbo vai no <b>subjuntivo</b>: <i>Quiero que <b>vengas</b>. Te recomiendo que <b>pruebes</b> el salmorejo. Espero que <b>te guste</b>.</i></p>
  <div class="tblwrap"><table><tr><td><b>-ar</b></td><td>hable, hables, hable, hablemos, habléis, hablen</td></tr><tr><td><b>-er / -ir</b></td><td>coma, comas, coma, comamos, comáis, coman</td></tr></table></div>
  <p>Truque: parta da forma <i>yo</i> do presente e troque a vogal: <i>tengo → tenga, pongo → ponga, digo → diga, conozco → conozca</i>. Irregulares totais: <b>sea, esté, vaya, haya, sepa, dé</b>.</p>
  <p>Gatilhos: <b>quiero que, espero que, te recomiendo que, es mejor que, es importante que, ojalá, para que</b>. Se o sujeito é o mesmo, use infinitivo: <i>Quiero <b>ir</b></i> (não "quiero que yo vaya").</p>`,
  mission:"Dê cinco conselhos a um amigo que vai viajar para a Espanha, todos começando com 'Te recomiendo que…'.",
  dialog:[["A","Es nuestra primera vez en Granada. ¿Qué nos recomiendas?","É nossa primeira vez em Granada. O que você recomenda?"],["B","Os recomiendo que compréis la entrada de la Alhambra con semanas de antelación. Se agotan.","Recomendo que comprem o ingresso da Alhambra com semanas de antecedência. Esgotam."],["A","Ya la tenemos. ¿Algún consejo para la visita?","Já temos. Algum conselho para a visita?"],["B","Que lleguéis media hora antes y que no olvidéis el pasaporte. Lo piden en la entrada.","Que cheguem meia hora antes e não esqueçam o passaporte. Pedem na entrada."],["A","¿Y para cenar?","E para jantar?"],["B","Es mejor que vayáis al Albaicín al atardecer. Espero que tengáis suerte con el tiempo.","É melhor irem ao Albaicín ao entardecer. Espero que tenham sorte com o tempo."],["A","Ojalá no llueva. ¡Gracias por los consejos!","Tomara que não chova. Obrigada pelos conselhos!"]],
  meB:"A", dialogB:[["A","Mi hija quiere estudiar un semestre en España. ¿Tú qué le aconsejas?","Minha filha quer estudar um semestre na Espanha. O que você aconselha?"],["B","Que elija una ciudad universitaria, como Salamanca o Granada. Son más baratas y muy animadas.","Que escolha uma cidade universitária, como Salamanca ou Granada. São mais baratas e muito animadas."],["A","Le preocupa no entender a la gente.","Ela se preocupa em não entender as pessoas."],["B","Es normal al principio. Es importante que viva con españoles y que no hable portugués en casa.","É normal no começo. É importante que more com espanhóis e não fale português em casa."],["A","¿Y para el alojamiento?","E para a moradia?"],["B","Le sugiero que busque un piso compartido antes de llegar y que pida fotos reales.","Sugiro que procure um apartamento compartilhado antes de chegar e peça fotos reais."],["A","Se lo diré. Ojalá se decida pronto.","Vou dizer a ela. Tomara que se decida logo."]],
  cards:[
   ["¿Qué nos recomiendas?","O que você recomenda para nós?"],["Te recomiendo que pruebes el salmorejo","Recomendo que você prove o salmorejo"],["Os recomiendo que compréis la entrada antes","Recomendo que comprem o ingresso antes"],["Es mejor que vayas por la mañana","É melhor que você vá de manhã"],["Es importante que lleves el pasaporte","É importante que você leve o passaporte"],
   ["Quiero que vengas con nosotros","Quero que você venha com a gente"],["Espero que te guste","Espero que você goste"],["Espero que tengáis suerte","Espero que vocês tenham sorte"],["Ojalá no llueva","Tomara que não chova"],["Ojalá podamos volver","Tomara que possamos voltar"],
   ["No quiero que te pierdas","Não quero que você se perca"],["Te aconsejo que reserves con tiempo","Aconselho que reserve com antecedência"],["Le sugiero que pida fotos reales","Sugiro que peça fotos reais"],["Es necesario que llegues antes","É necessário que chegue antes"],["Prefiero que paguemos a medias","Prefiro que a gente divida a conta"],
   ["Me alegro de que estés aquí","Fico feliz que você esteja aqui"],["Siento que no puedas venir","Sinto que você não possa vir"],["Que tengas buen viaje","Boa viagem (que tenha boa viagem)"],["Que te mejores","Melhoras"],["Que lo paséis bien","Divirtam-se"],
   ["Quiero ir al Albaicín","Quero ir ao Albaicín","Mesmo sujeito: infinitivo, não subjuntivo."],["Para que no te pierdas, lleva el mapa","Para você não se perder, leve o mapa"],["Aunque llueva, iremos","Mesmo que chova, iremos"],["Cuando llegues, avísame","Quando chegar, me avisa"],["Antes de que cierren, compra el pan","Antes que fechem, compre o pão"],["Se agotan rápido","Esgotam rápido"]

{ n:9, me:"A", pv:["f","f"], title:"Costumbres de aquí", sub:"Horários, festas e hábitos espanhóis",
  tip:`<h3>Soler, acostumbrarse e o relógio espanhol</h3>
  <p><b>Soler + infinitivo</b> = costumar: <i>Los españoles <b>suelen</b> cenar a las diez. Yo <b>solía</b> almorzar al mediodía.</i></p>
  <p><b>Acostumbrarse a</b>: <i>Ya <b>me he acostumbrado</b> al horario.</i> <b>Estar acostumbrado a</b>: <i>No <b>estoy acostumbrada a</b> comer tan tarde.</i></p>
  <p>Horários de verdade: desayuno leve às 8h, <b>almuerzo</b> às 14h-15h (a refeição principal; <i>comer</i> = almoçar), <b>merienda</b> às 18h, <b>cena</b> às 21h-22h. Lojas de bairro fecham das 14h às 17h. A <b>sobremesa</b> é a conversa depois do almoço, não o doce (que é <i>el postre</i>).</p>
  <p>Festas que param tudo: <b>Semana Santa</b>, <b>Feria de Abril</b> (Sevilla), <b>Fallas</b> (Valencia, março), <b>San Fermín</b> (Pamplona, julho), <b>Nochevieja</b> com as doze uvas. Em festa, os preços sobem e os hotéis esgotam.</p>`,
  mission:"Por um dia, siga o horário espanhol: almoce às 14h e jante às 21h. Depois conte como foi, usando 'suelo' e 'me he acostumbrado'.",
  dialog:[["A","Son las tres y el restaurante está lleno. ¿Aquí siempre se come tan tarde?","São três horas e o restaurante está cheio. Aqui sempre se almoça tão tarde?"],["B","Sí, solemos comer entre las dos y las tres y media. Y cenamos a partir de las nueve.","Sim, costumamos almoçar entre as duas e as três e meia. E jantamos a partir das nove."],["A","En Brasil almorzamos al mediodía. No estoy acostumbrada.","No Brasil almoçamos ao meio-dia. Não estou acostumada."],["B","Te acostumbrarás en dos días. Lo importante es desayunar poco y merendar algo.","Você vai se acostumar em dois dias. O importante é tomar pouco café da manhã e fazer um lanche."],["A","¿Y la siesta existe de verdad?","E a siesta existe de verdade?"],["B","Menos de lo que se cree. En las ciudades casi nadie la hace, pero las tiendas pequeñas sí cierran a mediodía.","Menos do que se pensa. Nas cidades quase ninguém faz, mas as lojas pequenas fecham ao meio-dia."],["A","Entonces compraré el pan por la mañana.","Então vou comprar o pão de manhã."]],
  meB:"A", dialogB:[["A","Hemos venido en Semana Santa sin saberlo. ¡Las calles están cortadas!","Viemos na Semana Santa sem saber. As ruas estão fechadas!"],["B","Es la semana más importante del año aquí. Las procesiones salen por la tarde y por la noche.","É a semana mais importante do ano aqui. As procissões saem de tarde e de noite."],["A","¿Merece la pena verlas?","Vale a pena ver?"],["B","Mucho. Pero llegad con tiempo y no crucéis la calle cuando pasa el paso.","Muito. Mas cheguem com tempo e não atravessem a rua quando passa a imagem."],["A","¿Qué se come estos días?","O que se come nesses dias?"],["B","Torrijas, que son parecidas a vuestra rabanada, y potaje de vigilia, sin carne.","Torrijas, parecidas com a rabanada de vocês, e potaje de vigília, sem carne."],["A","Pues probaremos las dos cosas.","Então vamos provar as duas coisas."]],
  cards:[
   ["¿Aquí siempre se come tan tarde?","Aqui sempre se almoça tão tarde?"],["Solemos comer a las dos y media","Costumamos almoçar às duas e meia"],["Cenamos a partir de las nueve","Jantamos a partir das nove"],["No estoy acostumbrada al horario","Não estou acostumada ao horário"],["Ya me he acostumbrado","Já me acostumei"],
   ["Te acostumbrarás en dos días","Você vai se acostumar em dois dias"],["Solía almorzar al mediodía","Costumava almoçar ao meio-dia"],["Las tiendas cierran a mediodía","As lojas fecham ao meio-dia"],["Abren por la tarde a las cinco","Abrem de tarde às cinco"],["Los domingos casi todo está cerrado","Aos domingos quase tudo está fechado"],
   ["La siesta casi nadie la hace","A siesta quase ninguém faz"],["Después de comer hacemos sobremesa","Depois do almoço ficamos conversando à mesa","'Sobremesa' é a conversa depois da refeição."],["Merendamos sobre las seis","Lanchamos por volta das seis"],["Es Semana Santa","É Semana Santa"],["Las calles están cortadas","As ruas estão fechadas"],
   ["Las procesiones salen por la noche","As procissões saem à noite"],["En las fiestas los hoteles se agotan","Nas festas os hotéis esgotam"],["Hay que reservar con meses de antelación","É preciso reservar com meses de antecedência"],["En Nochevieja se comen doce uvas","No Ano-Novo comem-se doze uvas"],["Es costumbre dejar propina pequeña","É costume deixar gorjeta pequena"],
   ["Aquí se saluda con dos besos","Aqui se cumprimenta com dois beijos"],["Es de mala educación llegar muy pronto","É falta de educação chegar muito cedo"],["Se tutea a casi todo el mundo","Trata-se quase todo mundo por tu"],["Las terrazas se llenan al atardecer","Os terraços se enchem ao entardecer"],["¿Qué se celebra hoy?","O que se comemora hoje?"],["Es un día festivo","É feriado"]
  ]},
{ n:10, me:"B", pv:["m","f"], title:"¿A qué te dedicas?", sub:"Trabalho, estudos e rotina",
  tip:`<h3>Falar de trabalho e rotina</h3>
  <p><b>¿A qué te dedicas?</b> = o que você faz? Respostas: <i>Soy contable. Trabajo en una empresa de logística. Trabajo por mi cuenta</i> (autônomo) <i>. Estoy en paro</i> (desempregado) <i>. Estoy jubilada</i> (aposentada).</p>
  <p>Profissões que enganam: <b>abogado</b> (advogado), <b>contable</b> (contador), <b>enfermero</b> (enfermeiro), <b>fontanero</b> (encanador), <b>albañil</b> (pedreiro), <b>periodista</b> (jornalista), <b>empresario</b> (empresário), <b>funcionario</b> (servidor público).</p>
  <p>Rotina com reflexivos: <i>me levanto, me ducho, me visto, me voy, me acuesto</i>. Frequência: <b>a menudo</b> (com frequência), <b>a veces</b>, <b>casi nunca</b>, <b>de vez en cuando</b>, <b>todos los días</b>.</p>
  <p><b>Llevar + tempo + gerundio</b>: <i>Llevo diez años trabajando en la misma empresa.</i> <b>Seguir + gerundio</b>: <i>Sigo estudiando español.</i></p>`,
  mission:"Apresente seu trabalho em um minuto de áudio: o que faz, há quanto tempo, horário e o que mais gosta.",
  dialog:[["A","¿Y tú a qué te dedicas?","E você, o que faz?"],["B","Soy contable. Trabajo en una empresa de transporte en São Paulo.","Sou contadora. Trabalho numa empresa de transporte em São Paulo."],["A","¿Y te gusta?","E você gosta?"],["B","Me gusta, pero es mucho estrés. Llevo doce años en la misma empresa.","Gosto, mas é muito estresse. Estou há doze anos na mesma empresa."],["A","¿Cuál es tu horario?","Qual é o seu horário?"],["B","De ocho a seis, con una hora para comer. Ahora trabajo dos días desde casa.","Das oito às seis, com uma hora para almoçar. Agora trabalho dois dias de casa."],["A","Aquí también se ha puesto de moda el teletrabajo.","Aqui também o home office entrou na moda."]],
  meB:"B", dialogB:[["A","¿Qué estudias?","O que você estuda?"],["B","Estoy terminando Derecho. Me quedan dos asignaturas y el trabajo de fin de grado.","Estou terminando Direito. Faltam duas matérias e o trabalho de conclusão."],["A","¿Y después qué quieres hacer?","E depois, o que você quer fazer?"],["B","Me gustaría hacer un máster aquí en España y trabajar en un despacho internacional.","Gostaria de fazer um mestrado aqui na Espanha e trabalhar num escritório internacional."],["A","Pues hablas muy bien. ¿Cuánto tiempo llevas estudiando español?","Você fala muito bem. Há quanto tempo estuda espanhol?"],["B","Llevo un año, pero sigo cometiendo muchos errores.","Faz um ano, mas continuo cometendo muitos erros."],["A","Eso es normal. Lo importante es que no te cortes al hablar.","Isso é normal. O importante é não travar ao falar."]],
  cards:[
   ["¿A qué te dedicas?","O que você faz da vida?"],["Soy contable","Sou contadora"],["Trabajo en una empresa de transporte","Trabalho numa empresa de transporte"],["Trabajo por mi cuenta","Trabalho por conta própria"],["Estoy en paro","Estou desempregado"],
   ["Estoy jubilada","Estou aposentada"],["Llevo doce años en la misma empresa","Estou há doze anos na mesma empresa"],["Trabajo de ocho a seis","Trabalho das oito às seis"],["Tengo una hora para comer","Tenho uma hora para almoçar"],["Trabajo desde casa dos días","Trabalho de casa dois dias"],
   ["El teletrabajo se ha puesto de moda","O home office entrou na moda"],["Es mucho estrés","É muito estresse"],["Me levanto a las seis y media","Levanto às seis e meia"],["Me acuesto tarde","Vou dormir tarde"],["Voy al trabajo en metro","Vou ao trabalho de metrô"],
   ["¿Qué estudias?","O que você estuda?"],["Estoy terminando la carrera","Estou terminando a faculdade","'Carrera' = curso superior."],["Me quedan dos asignaturas","Faltam duas matérias"],["Me gustaría hacer un máster","Gostaria de fazer um mestrado"],["Trabajo en un despacho de abogados","Trabalho num escritório de advocacia"],
   ["¿Cuánto tiempo llevas estudiando español?","Há quanto tempo você estuda espanhol?"],["Llevo un año estudiando","Estudo há um ano"],["Sigo cometiendo errores","Continuo cometendo erros"],["No te cortes al hablar","Não trave ao falar","'Cortarse' = ficar com vergonha, travar."],["Tengo una reunión a las diez","Tenho uma reunião às dez"],["Estoy de vacaciones hasta el lunes","Estou de férias até segunda"]
